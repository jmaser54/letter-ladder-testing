    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D; --green:#6FBF8B;

  .chain-word{ background: var(--rung); color:#1B2A41; padding:4px 10px; border-radius:6px; font-weight:600; text-transform:uppercase; font-size:0.9rem; }
  .chain-arrow{ color: var(--ink-dim); }

  .play-btn{
    position: absolute; top: 18px; right: 18px;
    background: var(--green); color: #142132; text-decoration:none;
    font-weight:700; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.04em;
    padding: 8px 14px; border-radius:8px; line-height:1;
    transition: filter 0.15s ease;
  }
  .play-btn:hover{ filter: brightness(1.1); }

<script src="data/hints.js?v=1793974992"></script>
<script>
function todayKey(){
  const d = new Date();
  const eastern = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const y = eastern.getFullYear();
  const m = String(eastern.getMonth()+1).padStart(2,'0');
  const day = String(eastern.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

const container = document.getElementById('past-puzzles-list');

// Puzzle attributions — keyed by "date_tier"
// Add new entries here when a puzzle is submitted by a community member.
const PUZZLE_ATTRIBUTIONS = {
  '2026-09-08_easy': 'Submitted by Redditor Ray2024',
  '2026-09-26_hard': 'Submitted by Aly M',
  '2026-09-29_easy': 'Solution includes an NHL team name',
  '2026-09-29_medium': 'Solution includes an NHL team name',
  '2026-09-29_hard': 'Solution includes an NHL team name',
  '2026-09-30_easy': 'Solution includes an NHL team name',
  '2026-09-30_medium': 'Solution includes an NHL team name',
  '2026-09-30_hard': 'Solution includes an NHL team name',
  '2026-10-01_easy': 'Solution includes an NHL team name',
  '2026-10-01_medium': 'Solution includes an NHL team name',
  '2026-10-01_hard': 'Solution includes an NHL team name',
  '2026-10-02_easy': 'Solution includes an NHL team name',
  '2026-10-02_medium': 'Solution includes an NHL team name',
  '2026-10-02_hard': 'Solution includes an NHL team name',
  '2026-10-03_easy': 'Solution includes an NHL team name',
  '2026-10-03_medium': 'Solution includes an NHL team name',
  '2026-10-03_hard': 'Solution includes an NHL team name',
};

const allDayKeys = Object.keys(HINTS_SCHEDULE || {}).sort().reverse();
const today = todayKey();
// Strictly before today only - never show today's own puzzle here (that's
// what the main game page is for) and never a future one.
const pastKeys = allDayKeys.filter(k => k < today);
// Live count for the intro line: "Missed a day? Play 315 past puzzles here".
const pastPuzzleTotal = pastKeys.reduce((n, k) => n + Object.keys(HINTS_SCHEDULE[k]).length, 0);
if(pastPuzzleTotal > 0) document.getElementById('past-puzzles-count').textContent = `${pastPuzzleTotal} `;

if(pastKeys.length === 0){
  container.innerHTML = `<div class="empty-state">No past puzzles yet - check back after the first day has run!</div>`;
} else {
  const tierNames = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  container.innerHTML = pastKeys.map(dayKey => {
    const day = HINTS_SCHEDULE[dayKey];
    const tierRows = ['easy','medium','hard']
      .filter(tier => day[tier])
      .map(tier => {
        const p = day[tier];
        const attribution = PUZZLE_ATTRIBUTIONS[`${dayKey}_${tier}`];
        const tierLabel = attribution
          ? `${tierNames[tier]} <span style="font-size:0.72rem; text-transform:none; letter-spacing:0; font-weight:600; color:var(--amber);">— ${attribution}</span>`
          : tierNames[tier];
        return `
          <div class="tier-row">
            <div class="tier-label">${tierLabel}</div>
            <div class="chain">
              <span class="chain-word">${p.start}</span>
              <span class="chain-arrow">→</span>
              <span class="chain-word">${p.final}</span>
            </div>
          </div>`;
      }).join('');
    return `
      <div class="day-card">
        <a class="play-btn" href="game.html?archive=${dayKey}">Play</a>
        <div class="day-date">${prettyDate(dayKey)}</div>
        ${tierRows}
      </div>`;
  }).join('');
}
</script>
