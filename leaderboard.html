<meta charset="UTF-8">

<title>Leaderboard — Letter Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D; --green:#6FBF8B;
  }
  body{
    margin:0; padding: 32px 16px 80px;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink); font-family:'Inter',system-ui,sans-serif;
  }
  .wrap{ max-width: 560px; margin:0 auto; position: relative; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin-bottom:4px; padding-right: 130px; }
  a{ color: var(--amber); }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 22px; }
  .back{ display:inline-block; color: var(--ink-dim); text-decoration:none; touch-action: manipulation; }
  .back:hover{ color: var(--amber); }
  .intro{ color: var(--ink-dim); margin-bottom: 24px; }

  .create-account-link{
    position: absolute; top: 32px; right: 0;
    font-weight:600; font-size:0.85rem; text-decoration:none;
    touch-action: manipulation;
  }
  .create-account-link:hover{ text-decoration: underline; }

  .day-card{
    background: var(--bg-panel); border-radius:18px; padding: 20px 22px; margin-bottom:18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .tier-row{ margin-bottom: 14px; }
  .tier-row:last-child{ margin-bottom: 0; }
  .tier-label{ font-size:0.83rem; text-transform:uppercase; letter-spacing:0.1em; color: var(--amber); font-weight:700; margin-bottom:6px; }
  .score-row{ display:flex; align-items:center; gap:10px; padding: 3px 0; font-size:1.06rem; }
  .score-rank{ font-family:'Fraunces',serif; font-weight:700; color: var(--amber); width: 1.2em; flex-shrink:0; }
  .score-name{ flex:1; font-weight:600; word-break: break-word; }
  .score-hints{ font-size: 0.92rem; }
  .score-time{ font-family:'Fraunces',serif; font-weight:700; font-variant-numeric: tabular-nums; }
  .empty-tier{ color: var(--ink-dim); font-size: 0.9rem; }

  .past-leaderboards-link{
    font-size: 0.8rem; color: var(--ink-dim); text-decoration:none;
    border-bottom: 1px dotted var(--ink-dim); touch-action: manipulation;
  }
  .past-leaderboards-link:hover{ color: var(--amber); border-color: var(--amber); }
  .empty-state{ text-align:center; color: var(--ink-dim); padding: 40px 20px; background: var(--bg-panel); border-radius:18px; }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K8X9ZNZP"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="wrap">
  <div class="top-row">
    <a class="back" href="index.html">← Back to game</a>
    <a class="past-leaderboards-link" href="past-leaderboards.html">Past Leaderboards</a>
  </div>
  <a class="create-account-link" href="index.html?showsignup=1" id="create-account-link" style="display:none;">Create account</a>
  <h1 id="leaderboard-title">Leaderboard</h1>
  <div class="intro">Each hint used adds 3 minutes to the timer.</div>
  <div id="leaderboard-content">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function todayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function prettyShortDate(key){
    const [y, m, d] = key.split('-').map(Number);
    return `${m}/${String(d).padStart(2,'0')}`;
  }
  document.getElementById('leaderboard-title').textContent = `Leaderboard - ${prettyShortDate(todayKey())}`;

  // The exact time-formatting logic used by index.html's Share Results
  // button, duplicated verbatim here since this is a separate static
  // HTML file with no shared JS module system to import it from directly.
  function formatTime(ms){
    const totalSeconds = ms / 1000;
    if(totalSeconds < 60){
      return `${totalSeconds.toFixed(1)}s`;
    } else if(totalSeconds < 3600){
      return `${Math.floor(totalSeconds / 60)}m ${Math.round(totalSeconds % 60)}s`;
    } else {
      const totalMinutes = Math.floor(totalSeconds / 60);
      return `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m ${Math.round(totalSeconds % 60)}s`;
    }
  }

  onAuthStateChanged(auth, (user) => {
    const link = document.getElementById('create-account-link');
    if(!user || user.isAnonymous){
      link.style.display = '';
    }
  });

  const tierNames = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

  async function loadLeaderboard(){
    const contentEl = document.getElementById('leaderboard-content');
    const today = todayKey();

    try{
      const tierSections = await Promise.all(['easy','medium','hard'].map(async (tier) => {
        const q = query(
          collection(db, 'scores'),
          where('date', '==', today),
          where('tier', '==', tier),
          orderBy('timeMs', 'asc'),
          limit(3)
        );
        const snap = await getDocs(q);
        const rows = snap.docs.map(d => d.data());
        const rowsHtml = rows.length === 0
          ? `<div class="empty-tier">No times posted yet today - be the first!</div>`
          : rows.map((row, i) => `
              <div class="score-row">
                <div class="score-rank">${i+1}</div>
                <div class="score-name">${row.displayName || 'Guest'}</div>
                <div class="score-hints">${'💡'.repeat(row.hintsUsed || 0)}</div>
                <div class="score-time">${formatTime(row.timeMs)}</div>
              </div>
            `).join('');
        return `
          <div class="tier-row">
            <div class="tier-label">${tierNames[tier]}</div>
            ${rowsHtml}
          </div>
        `;
      }));
      contentEl.innerHTML = `<div class="day-card">${tierSections.join('')}</div>`;
    }catch(e){
      console.error('Leaderboard failed to load:', e);
      contentEl.innerHTML = `<div class="empty-state">Couldn't load the leaderboard right now - try refreshing.</div>`;
    }
  }

  loadLeaderboard();
</script>
</body>
</html>
