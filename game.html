<style>
  :root{
    --bg: #1B2A41;
    --bg-panel: #24384F;
    --rung: #F5EFE0;
    --rung-empty: rgba(245,239,224,0.08);
    --ink: #F5EFE0;
    --ink-dim: #9FB3C8;
    --amber: #E8A33D;
    --red: #D9705F;
  }
  *{box-sizing:border-box;}
  html, body{ height: 100%; }
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 12px;
  }

  header{ position: relative; text-align:center; margin-bottom: 12px; flex-shrink:0; }
  .brand-row{
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 2rem;
    margin-bottom: 4px;
  }
  .brand-title-row{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 36px;
    padding: 0 44px; /* clears the 32px icons with ~12px gap each side */
  }
  .brand{
    grid-column: 2;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: inherit;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.1;
  }
  /* Anchor for timer + hint indicator — sits right side of the title row */
  .timer-widget-anchor{
    position: absolute; right: 0; top: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
  }
  .timer-widget-anchor .hint-time-penalty-indicator{
    position: absolute; top: calc(50% + 16px); right: 0;
    /* sits just below the vertically-centered timer button without moving it */
  }
  .brand .rung-i{ color: var(--amber); }
  /* ? how-to-play icon — top left, 11px right of the 32px account button */
  .howto-icon-btn{
    position: absolute; left: 43px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink-dim);
    background: none; color: var(--ink-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 1rem;
    touch-action: manipulation; padding: 0; line-height: 1;
    transition: color 0.15s, border-color 0.15s; flex-shrink: 0;
  }
  .howto-icon-btn:hover{ color: var(--amber); border-color: var(--amber); }
  .top-links{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 16px; margin-top:6px; font-size: 0.8rem;
  }
  .top-links a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); touch-action: manipulation; }
  .top-links a:hover{ color: var(--amber); border-color: var(--amber); }
  .top-links .logo-link{ display:inline-flex; align-items:center; border-bottom:none; line-height:0; }
  .top-links .logo-link svg{ display:block; border-radius:50%; transition:opacity 0.15s ease; }
  .top-links .logo-link:hover svg{ opacity:0.8; }

  .date-row{
    text-align:center; color: var(--ink-dim); font-size: 0.8rem; margin-bottom: 10px;
    letter-spacing: 0.03em; text-transform: uppercase; flex-shrink:0;
  }

  .tabs{
    display:flex; background: rgba(0,0,0,0.2); border-radius: 999px; padding: 4px; margin-bottom: 14px;
    flex-shrink:0;
  }
  .tab{
    flex:1; text-align:center; padding: 9px 0; border-radius: 999px; cursor:pointer;
    font-weight:600; font-size:0.9rem; color: var(--ink-dim); transition: all 0.15s ease;
    user-select:none;
  }
  .tab.active{ background: var(--amber); color: #1B2A41; }
  .tab .dot{ display:none; }

  .panel{
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }


  .ladder-scroll{
    /* No longer its own internal scroll region - the whole page scrolls
       naturally now via the browser's own scrollbar, which handles the
       on-screen keyboard correctly without any custom viewport math. */
    padding: 2px 2px;
  }
  .ladder{
    display:flex; flex-direction:column; align-items:center; gap: var(--rung-gap, 14px);
    position: relative;
    padding: 10px 30px;
    margin: 0 auto;
    width: -webkit-fit-content;
    width: fit-content;
  }

  @keyframes fade-away{
    0%{ opacity:1; }
    100%{ opacity:0; }
  }
  .ladder.fading-out{
    animation: fade-away 0.92s ease-in forwards;
  }

  .rung-row{
    display:grid; grid-template-columns: 22px 1fr 22px; align-items:center; column-gap:12px; width:100%;
    position: relative;
  }
  .rung-row > .rung{ justify-self: center; }
  .rung-count{ width: 22px; text-align:right; color: var(--ink-dim); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .delete-guess-btn{
    width: 24px; height: 38px;
    border: none; background: none;
    color: var(--red);
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center;
    padding: 0;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  .delete-guess-btn:hover{ filter: brightness(1.15); }
  .delete-guess-btn:active{ transform: scale(0.85); }
  .rung{
    font-family:'Fraunces', serif;
    font-size: var(--rung-font, 1.35rem);
    font-weight:600;
    letter-spacing: 0.14em;
    background: var(--rung);
    color: #1B2A41;
    height: var(--rung-height, 50px);
    line-height: var(--rung-height, 50px);
    padding: 0 18px;
    border-radius: 10px;
    text-align:center;
    text-transform: uppercase;
    box-sizing: border-box;
  }
  .rung.empty{
    background: var(--rung-empty);
    color: var(--ink-dim);
    border: 1.5px dashed rgba(245,239,224,0.25);
  }
  .rung.anchor{ background: var(--amber); }
  .rung.clickable{ cursor: pointer; transition: filter 0.1s ease, transform 0.1s ease; }
  .rung.clickable:hover{ filter: brightness(1.08); }
  .rung.clickable:active{ transform: scale(0.97); }
  input.rung-input{
    border: none;
    outline: none;
    box-sizing: border-box;
    min-width: 0;
    transform: scaleX(1.06);
  }

  /* Ladders get taller the more rungs a puzzle has, so these tiers shrink
     things down automatically to keep long puzzles more compact - short
     puzzles stay at full comfortable size. Combined with the scrollable
     ladder area above, a puzzle that still doesn't fully fit (rare - only
     the longest puzzles on the smallest screens) simply scrolls within its
     own little area instead of taking over the whole page. */
  .panel.rungs-md{ --rung-font: 1.15rem; --rung-height: 44px; --rung-minw: 115px; --rung-gap: 10px; }
  .panel.rungs-lg{ --rung-font: 1rem; --rung-height: 39px; --rung-minw: 100px; --rung-gap: 9px; }
  .panel.rungs-xl{ --rung-font: 0.9rem; --rung-height: 35px; --rung-minw: 88px; --rung-gap: 8px; }


  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; cursor:pointer; padding: 12px 18px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color:#1B2A41; }
  .btn-ghost{ background: rgba(245,239,224,0.08); color: var(--ink); }
  #hint-btn{ display:inline-flex; align-items:center; justify-content:center; padding: 10px 14px; }

  .feedback{ margin-top:8px; text-align:center; font-weight:600; min-height: 14px; flex-shrink:0; }
  .feedback:empty{ display:none; } /* no message: take no space at all */
  .feedback.win, .feedback.ok{ text-align:center; }
  .error-list{ list-style:none; margin: 12px 0 0; padding:0; text-align:left; display:inline-block; }
  .error-list li{ position:relative; padding-left:18px; margin-bottom:6px; font-weight:600; color: var(--red); font-size:0.9rem; line-height:1.2; }
  /* Dot centred on the first line: line box is 1.2em tall, so its middle is 0.6em down. */
  .error-list li::before{ content:""; position:absolute; left:0; top:calc(0.6em - 3px); width:6px; height:6px; border-radius:50%; background: var(--red); }
  .error-list-wrap{ display:flex; justify-content:center; }
  .feedback.win{ color: var(--amber); font-weight: 700; }
  .feedback.error{ color: var(--red); }
  .feedback.ok{ color: var(--ink-dim); font-weight:500; }

  .letter-bank{
    margin-top: 10px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    user-select: none; -webkit-user-select: none;
  }
  .bank-tiles{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 100%;
    user-select: none; -webkit-user-select: none;
  }
  .bank-tile{
    width: 48px; height: 48px;
    border: none; border-radius: 10px;
    background: var(--rung);
    color: #1B2A41;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.3rem;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .bank-tile.from-below{ background: var(--amber); }
  .bank-tile:active{ transform: scale(0.9); }
  .bank-tile{ touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; } /* prevents the browser's own touch-scroll AND text-selection highlight from fighting the hold-and-drag gesture */
  .bank-tile.dragging{
    position: relative;
    z-index: 50;
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    transition: none;
    scale: 1.3;
    animation: tile-jiggle 0.15s ease-in-out infinite;
  }
  @keyframes tile-jiggle{
    0%, 100%{ rotate: -5deg; }
    50%{ rotate: 5deg; }
  }
  .bank-tile.used{
    background: rgba(245,239,224,0.08);
    color: var(--ink-dim);
    opacity: 0.4;
    cursor: default;
  }
  .bank-tile-placeholder{
    width: 48px; height: 48px;
    border: 2px dashed rgba(245,239,224,0.2);
    border-radius: 10px;
    background: transparent;
    box-sizing: border-box;
  }
  .bank-controls{
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin-top: 22px;
  }
  .bank-ctrl-btn{
    width: 46px; height: 46px;
    border: none; border-radius: 10px;
    background: rgba(245,239,224,0.08);
    color: var(--ink);
    font-size: 1.5rem;
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .bank-ctrl-btn:active{ transform: scale(0.92); }
  .bank-ctrl-btn.kb-on{ background: var(--bg); color: var(--ink); }
  .bank-ctrl-btn.bank-submit-btn{ background: var(--amber); color: #1B2A41; }
  .bank-ctrl-btn.bank-group-spacer{ margin-left: 14px; }

  .bank-primary-actions{
    display: flex; gap: 14px;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    margin-top: 0;
    margin-bottom: 0;
  }
  .clear-hint-text{
    color: var(--ink-dim);
    font-size: 0.88rem;
    line-height: 1.3;
  }
  .bank-primary-btn{
    flex: 1;
    height: 46px; /* match bank-ctrl-btn height so the row is visually aligned */
    border: none; border-radius: 12px;
    background: rgba(245,239,224,0.08);
    color: var(--ink);
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .bank-primary-btn:active{ transform: scale(0.96); }
  .bank-primary-btn.bank-submit-btn{ background: var(--amber); color: #1B2A41; }

  .actions-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px; margin-top:8px; margin-bottom:8px; flex-shrink:0; }
  #next-puzzle-btn{ font-size: 0.95rem; padding: 12px 21px; }
  .hint-display{
    text-align:center; margin-top:6px; margin-bottom:8px; font-size:0.85rem; color: var(--ink-dim);
    font-style:italic; flex-shrink:0; min-height: 0;
  }
  .hint-display:empty{ margin-top: 0; margin-bottom: 0; } /* no hint showing: no gap */
  .hint-display .hint-letters{ color: var(--amber); font-style:normal; font-weight:600; letter-spacing:0.04em; }
  /* Share modal — Variant B (share-modal-redesign.html), classes prefixed sm- */
  .sm-scrim{ position:fixed; inset:0; z-index:1000; background:rgba(20,33,50,.66); display:flex; align-items:center; justify-content:center; padding:18px 14px; }
  .sm-modal{ position:relative; width:100%; max-width:344px; background:#24384F; border:1px solid rgba(245,239,224,0.14); border-radius:24px; box-shadow:0 26px 60px rgba(0,0,0,.5); padding:22px 18px 18px; animation:sm-pop .32s cubic-bezier(.2,.9,.3,1.15); max-height:100%; overflow-y:auto; font-family:"Archivo", system-ui, -apple-system, sans-serif; color:#F5EFE0; -webkit-font-smoothing:antialiased; }
  @keyframes sm-pop{ from{ transform:scale(.96) translateY(10px); opacity:0 } to{ transform:none; opacity:1 } }
  @media (prefers-reduced-motion: reduce){ .sm-modal{ animation:none } }
  .sm-close-x{ position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%; border:1px solid rgba(245,239,224,0.14); background:rgba(36,56,79,.85); color:#9FB3C8; font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center; z-index:2; padding:0; }
  .sm-close-x:hover{ color:#F5EFE0; }
  .sm-head{ padding-right:26px; }
  .sm-wordmark-row{ display:flex; align-items:center; gap:12px; }
  .sm-logo{ width:46px; height:46px; border-radius:50%; flex:none; border:2px solid #E8A33D; object-fit:cover; background:#1B2A41; }
  .sm-wordmark{ font-weight:900; color:#F5EFE0; letter-spacing:.015em; line-height:.98; text-transform:uppercase; font-size:31px; }
  .sm-result{ text-align:center; margin-top:14px; }
  .sm-meta-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .sm-pill{ font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; background:#E8A33D; color:#1B2A41; padding:4px 9px; border-radius:999px; flex:none; }
  .sm-big-time{ font-family:"IBM Plex Mono", monospace; font-size:29px; font-weight:700; line-height:1; letter-spacing:-.02em; }
  .sm-big-time small{ font-size:12px; color:#9FB3C8; font-weight:500; }
  .sm-challenge{ font-size:15px; font-weight:700; margin-top:7px; }
  .sm-challenge span{ color:#E8A33D; }
  .sm-date{ font-size:12.5px; color:#9FB3C8; margin-top:5px; }
  .sm-card{ margin-top:16px; border-radius:16px; overflow:hidden; text-align:left; background:#1B2A41; border:1px solid rgba(245,239,224,0.14); }
  .sm-card-body{ padding:14px 15px 13px; }
  /* Ladder: as wide as its widest row and centred in the card; shorter rows
     start at the same left edge, so it keeps its staircase shape. */
  .sm-ladder{ display:flex; flex-direction:column; align-items:flex-start; gap:5px; --sm-tile:25px; width:max-content; max-width:100%; margin:0 auto; }
  .sm-rung{ display:flex; align-items:center; gap:5px; }
  .sm-tile{ width:var(--sm-tile); height:var(--sm-tile); border-radius:6px; display:grid; place-items:center; font-family:"IBM Plex Mono", monospace; font-size:calc(var(--sm-tile) * 0.5); font-weight:700; }
  .sm-tile.anchor{ background:#E8A33D; color:#1B2A41; }
  .sm-tile.filled{ background:#F5EFE0; color:#1B2A41; font-family:"Archivo", sans-serif; font-size:calc(var(--sm-tile) * 0.48); }
  .sm-play-bar{ display:flex; align-items:center; justify-content:center; gap:8px; background:#E8A33D; color:#1B2A41; text-decoration:none; font-size:16.5px; font-weight:900; letter-spacing:.01em; padding:14px 12px; text-align:center; }
  .sm-play-bar:hover{ background:#f0b356; }
  .sm-actions{ margin-top:16px; display:grid; gap:9px; }
  .sm-btn{ font:inherit; font-weight:800; font-size:15px; cursor:pointer; border-radius:12px; padding:14px 14px; border:1px solid transparent; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .sm-btn-primary{ background:#E8A33D; color:#1B2A41; }
  .sm-btn-primary:active{ transform:scale(.99); }
  .sm-btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .sm-btn-row.single{ grid-template-columns:1fr; }
  .sm-btn-secondary{ background:rgba(245,239,224,.05); color:#F5EFE0; border-color:rgba(245,239,224,0.14); padding:11px 8px; font-size:13.5px; }
  .sm-btn-secondary:hover{ border-color:#9FB3C8; }
  .sm-toast{ position:fixed; left:50%; bottom:20px; transform:translate(-50%,16px); background:#F5EFE0; color:#1B2A41; padding:11px 17px; border-radius:999px; font-family:"Archivo", sans-serif; font-size:13.5px; font-weight:700; box-shadow:0 10px 28px rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:1001; max-width:88%; text-align:center; white-space:nowrap; }
  .sm-toast.show{ opacity:1; transform:translate(-50%,0); }
  @media (prefers-reduced-motion: reduce){ .sm-toast{ transition:none } }

  .view-solution-link{
    display:table; margin: 12px auto 8px auto;
    font-size:0.88rem; color: var(--ink-dim); text-decoration:none;
    border-bottom: 1px dotted var(--ink-dim);
    touch-action: manipulation;
  }
  .view-solution-link:hover{ color: var(--amber); border-color: var(--amber); }
  @media (min-width: 768px){ .wrap > footer{ margin-top: auto; padding-top: 12px; } }
  .share-results-link{ margin: 14px auto 4px auto; }
  .leaderboard-rank{ text-align:center; margin: 4px 0 18px; font-size:0.88rem; color: var(--ink-dim); }
  .leaderboard-rank-text{ color: var(--ink); font-size:0.95rem; font-weight: 700; font-style: italic; }
  .leaderboard-rank-time{ color: var(--amber); }
  .leaderboard-rank-link{ margin-top: 14px; }
  .leaderboard-rank-link a{ color: var(--ink-dim); text-decoration:none; border-bottom:1px dotted var(--ink-dim); touch-action: manipulation; }
  .leaderboard-rank-link a:hover{ color: var(--amber); border-color: var(--amber); }
  .checking-word{ color: var(--ink-dim); font-size: 0.88rem; }
  .practice-note{ text-align:center; margin: 4px 12px 10px; font-size:0.88rem; color: var(--ink-dim); font-style: italic; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 30px 0; }

  .confirm-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .confirm-card{
    background: var(--bg-panel); border-radius: 16px; padding: 24px 22px;
    max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    signInAnonymously, signOut, onAuthStateChanged, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, getDocFromServer, addDoc, deleteDoc,
    query, where, orderBy, limit, getDocs, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Firebase's email/password auth genuinely needs an email as the account
  // identifier - there's no native username-only option. Rather than ever
  // showing the player an email field, a chosen username is quietly turned
  // into a synthetic, never-displayed email behind the scenes. Firebase's
  // own built-in "no two accounts can share an email" enforcement then
  // transparently doubles as username-uniqueness checking, with nothing
  // extra needed to build that ourselves.
  function usernameToSyntheticEmail(username){
    const normalized = username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    return `${normalized}@players.letterladder.io`;
  }
  function normalizeUsername(username){
    return username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
  }
  async function findPlayerByUsername(username){
    const q = query(collection(db, 'players'), where('usernameLower', '==', normalizeUsername(username)));
    const snap = await getDocs(q);
    if(snap.empty) return null;
    const docSnap = snap.docs[0];
    return { uid: docSnap.id, ...docSnap.data() };
  }

  // Firebase's raw error codes and messages talk about "email" throughout,
  // which would be confusing/wrong to show directly given the disguise -
  // this translates the ones a player could realistically hit into
  // messages that talk about usernames instead.
  function friendlyAuthError(error){
    const code = error && error.code;
    if(code === 'auth/email-already-in-use') return 'That username is already taken - try another.';
    if(code === 'auth/invalid-email') return 'That username has characters that aren\'t allowed - try letters and numbers only.';
    if(code === 'auth/weak-password') return 'Password should be at least 6 characters.';
    if(code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Username or password is incorrect.';
    if(code === 'auth/too-many-requests') return 'Too many attempts - please wait a moment and try again.';
    return 'Something went wrong. Please try again.';
  }

  const BANNED_USERNAME_SUBSTRINGS = [
    'fuck', 'bitch', 'bastard', 'cunt', 'kike', 'nigger', 'nigga', 'asshole', 'faggot',
    '.com', '.net', '.org', '.edu', '.io', '.xyz', 'gmail',
  ];

  async function createAccount(username, password, recoveryEmail){
    const trimmedUsername = username.trim();
    if(trimmedUsername.length > 20){
      return { success: false, error: 'Username must be 20 characters or fewer.' };
    }
    if(trimmedUsername.includes('.')){
      return { success: false, error: 'Usernames cannot contain periods.' };
    }
    const lowerUsername = trimmedUsername.toLowerCase();
    if(BANNED_USERNAME_SUBSTRINGS.some(word => lowerUsername.includes(word))){
      return { success: false, error: 'Please choose a different username.' };
    }
    try{
      const trimmedEmail = recoveryEmail && recoveryEmail.trim();
      // If a real email was provided, register the actual Firebase account
      // under that email directly - this is what makes Firebase's own,
      // genuine password-reset email actually reach them, since Firebase
      // always sends it to whatever email is genuinely registered on the
      // account. Without one, there's no real inbox to deliver a reset
      // link to, so that account falls back to the synthetic,
      // un-recoverable email as before.
      const registeredEmail = trimmedEmail || usernameToSyntheticEmail(username);
      const cred = await createUserWithEmailAndPassword(auth, registeredEmail, password);
      // Store the player's real, human-chosen username alongside their
      // account, plus a lowercased copy for case-insensitive lookups (the
      // synthetic-email path got this for free by always lowercasing;
      // this keeps that same behavior now that login may need to look
      // this record up directly instead of just computing an email).
      // authEmail is the address the account actually signs in with -
      // safe to keep on the publicly-readable players doc, since login
      // needs it pre-auth and it's just an opaque login identifier. The
      // player's personal recoveryEmail is deliberately NOT stored here -
      // it goes in the separate, locked-down playerRecovery collection
      // below, so the public players doc never exposes personal emails.
      const playerDoc = {
        username: username.trim(),
        usernameLower: normalizeUsername(username),
        createdAt: Date.now(),
        authEmail: registeredEmail,
      };
      await setDoc(doc(db, 'players', cred.user.uid), playerDoc);
      if(trimmedEmail){
        // Personal recovery email lives in its own collection, readable
        // only as a single-document get (never enumerable), so it can
        // still be fetched pre-auth for password reset but can't be
        // harvested across all accounts.
        await setDoc(doc(db, 'playerRecovery', cred.user.uid), { recoveryEmail: trimmedEmail });
      }
      return { success: true, uid: cred.user.uid, username: username.trim() };
    }catch(error){
      return { success: false, error: friendlyAuthError(error) };
    }
  }

  async function login(username, password){
    try{
      const player = await findPlayerByUsername(username);
      // If this username has a real registered email on file, that's what
      // the account actually needs to sign in with - otherwise (unknown
      // username, or a known one that never provided an email) fall back
      // to the deterministic synthetic formula, which correctly covers
      // both those cases the same way account creation would have.
      // authEmail is the safe, public login identifier - the personal
      // recoveryEmail is no longer stored on this doc.
      const registeredEmail = (player && player.authEmail) || usernameToSyntheticEmail(username);
      const cred = await signInWithEmailAndPassword(auth, registeredEmail, password);
      // Accounts whose players doc went missing get it recreated here, so
      // their leaderboard setting has a real document behind it.
      try{ await ensurePlayerDoc(cred.user, (player && player.username) || username.trim()); }catch(e){ console.error('[leaderboard] could not check/backfill players doc on sign-in:', e); }
      return { success: true, uid: cred.user.uid, username: (player && player.username) || username.trim() };
    }catch(error){
      return { success: false, error: friendlyAuthError(error) };
    }
  }

  async function requestPasswordReset(username){
    try{
      const player = await findPlayerByUsername(username);
      if(!player){
        return { success: false, error: 'No recovery email is on file for that username.' };
      }
      // The personal recovery email now lives in the locked-down
      // playerRecovery collection, fetched here as a single get by the
      // uid we just resolved from the username - never enumerable.
      let recoveryEmail = null;
      try{
        const recoverySnap = await getDoc(doc(db, 'playerRecovery', player.uid));
        if(recoverySnap.exists()) recoveryEmail = recoverySnap.data().recoveryEmail;
      }catch(e){}
      if(!recoveryEmail){
        return { success: false, error: 'No recovery email is on file for that username.' };
      }
      const actionCodeSettings = {
        url: 'https://letterladder.io/',
        handleCodeInApp: false,
      };
      await sendPasswordResetEmail(auth, recoveryEmail, actionCodeSettings);
      return { success: true };
    }catch(error){
      return { success: false, error: 'Something went wrong. Please try again.' };
    }
  }

  async function playAsGuest(){
    try{
      const cred = await signInAnonymously(auth);
      return { success: true, uid: cred.user.uid, isGuest: true };
    }catch(error){
      return { success: false, error: friendlyAuthError(error) };
    }
  }

  async function logOut(){
    await signOut(auth);
    accountScopeReady = false; // prevent post-logout syncs with stale accountScope
    localStorage.removeItem('letterladder:accountUsername');
    localStorage.removeItem('letterladder:activeTier');
    localStorage.removeItem('letterladder:lastViewedDateKey');
  }

  // ── Leaderboard visibility: one source of truth ──────────────────────
  // A signed-in player's times are public unless they turned the profile
  // toggle off (players/{uid}.leaderboardVisible === false). A missing
  // players doc means "never opted out" - it is recreated here (same
  // fields createAccount writes, plus leaderboardVisible: true). The game
  // page and profile.html both use this rule, so the toggle always shows
  // what the next solve will be filed as.
  const LB_PREF_KEY = uid => `letterladder:leaderboardVisible:${uid}`;
  async function ensurePlayerDoc(user, usernameHint){
    if(!user || user.isAnonymous) return { status: 'skipped' };
    const ref = doc(db, 'players', user.uid);
    const snap = await getDocFromServer(ref);          // throws on network/rules failure
    if(snap.exists()) return { status: 'exists', data: snap.data() };
    const username = (usernameHint || '').trim();
    if(!username){
      console.error('[leaderboard] players doc is missing and no username is known on this device - not recreated', user.uid);
      return { status: 'missing' };
    }
    const created = Date.parse(user.metadata && user.metadata.creationTime);
    const data = {
      username,
      usernameLower: normalizeUsername(username),
      createdAt: Number.isFinite(created) ? created : Date.now(),
      authEmail: user.email || usernameToSyntheticEmail(username),
      leaderboardVisible: true,
    };
    await setDoc(ref, data, { merge: true });
    console.warn(`[leaderboard] players doc for "${username}" was missing - recreated with leaderboardVisible: true`);
    return { status: 'backfilled', data };
  }
  // Decides `visible` for a signed-in player's new leaderboard entry.
  async function leaderboardVisibilityFor(user, usernameHint){
    let lastError = null;
    for(let attempt = 0; attempt < 2; attempt++){      // one retry
      try{
        const r = await ensurePlayerDoc(user, usernameHint);
        if(r.status === 'exists'){
          const visible = r.data.leaderboardVisible !== false;
          try{ localStorage.setItem(LB_PREF_KEY(user.uid), String(visible)); }catch(e){}
          return { visible, reason: visible ? 'players doc read' : 'players doc read - player turned the leaderboard toggle off' };
        }
        if(r.status === 'backfilled'){
          try{ localStorage.setItem(LB_PREF_KEY(user.uid), 'true'); }catch(e){}
          return { visible: true, reason: 'players doc was missing - backfilled' };
        }
        return { visible: true, reason: 'players doc missing and could not be backfilled - default visible' };
      }catch(e){ lastError = e; }
    }
    // Read failed twice: use the setting last seen on this device (so an
    // opted-out player stays hidden), otherwise the default - visible.
    let cached = null;
    try{ cached = localStorage.getItem(LB_PREF_KEY(user.uid)); }catch(e){}
    if(cached !== null){
      console.error(`[leaderboard] players doc read FAILED after retry - entry written visible=${cached} (last known setting on this device)`, lastError);
      return { visible: cached === 'true', reason: 'read failed after retry - used last known setting' };
    }
    console.error('[leaderboard] players doc read FAILED after retry - entry written VISIBLE (default)', lastError);
    return { visible: true, reason: 'read failed after retry - default visible' };
  }
  // Once a day per account: republish any hidden entries of a player who
  // never opted out (repairs entries filed hidden by the old default).
  async function repairHiddenEntries(user, usernameHint){
    if(!user || user.isAnonymous) return null;
    const pref = await leaderboardVisibilityFor(user, usernameHint);
    if(!pref.visible) return { republished: 0, reason: 'player opted out' };
    const snap = await getDocs(query(collection(db, 'leaderboardEntries'), where('uid', '==', user.uid), where('visible', '==', false)));
    const hidden = snap.docs;
    for(let i = 0; i < hidden.length; i += 499){
      const batch = writeBatch(db);
      hidden.slice(i, i + 499).forEach(d => batch.update(d.ref, { visible: true }));
      await batch.commit();
    }
    if(hidden.length) console.warn(`[leaderboard] republished ${hidden.length} hidden entr${hidden.length === 1 ? 'y' : 'ies'} (player never opted out)`);
    return { republished: hidden.length, reason: pref.reason };
  }

  // Writes one completed-puzzle score as a new document, structured so
  // the leaderboard display (a later phase) can query "every score for
  // this exact puzzle date + tier, sorted fastest first."
  async function submitScore({ date, tier, timeMs, hintsUsed, displayName }){
    try{
      const user = auth.currentUser;
      const scoreData = {
        date, tier, timeMs, hintsUsed, displayName,
        uid: user ? user.uid : null,
        isGuest: !user || user.isAnonymous,
        createdAt: Date.now(),
      };
      if(user){
        // Use a deterministic doc ID for ALL users (real and anonymous),
        // keyed by their Firebase UID. For real accounts this prevents
        // duplicates across sessions/devices. For anonymous users it also
        // prevents duplicates, AND it means the backfill can find and
        // delete the old guest doc when they later create a real account.
        await setDoc(doc(db, 'scores', `${user.uid}_${date}_${tier}`), scoreData);
      } else {
        await addDoc(collection(db, 'scores'), scoreData);
      }
      return { success: true };
    }catch(error){
      return { success: false, error: 'Could not save your score right now.' };
    }
  }

  // Exposed on window since this lives in its own ES module scope,
  // separate from the game's main (non-module) script.
  window.LetterLadderAuth = {
    createAccount, login, playAsGuest, logOut, submitScore, requestPasswordReset,
    getCurrentUser: () => auth.currentUser,
    onAuthReady: (callback) => onAuthStateChanged(auth, callback),
    db, doc, setDoc, getDoc, getDocFromServer, deleteDoc, collection, query, where, orderBy, limit, getDocs,
    ensurePlayerDoc, leaderboardVisibilityFor, repairHiddenEntries,
  };
</script>

<!-- Bump the ?v= number below any time you update puzzles.js or the game logic,
     so returning visitors' browsers are guaranteed to fetch the new version
     instead of a cached copy. The dictionary (data/words.js, ~1.9 MB) is not
     loaded here: it loads after the game is interactive - see
     DICTIONARY_SRC below (and keep index.html's prefetch link on the same ?v=). -->
<script src="data/puzzles.js?v=1793974992"></script>
<script src="data/hints.js?v=1793974992"></script>
<script>
// ---------- dictionary (loaded off the critical path) ----------
// The word list is only needed to check a submitted guess, so it is fetched
// once the ladder is up instead of blocking the first paint. A guess
// submitted before it arrives waits for it ("Checking word…").
const DICTIONARY_SRC = 'data/words.js?v=5';
let dictionaryRequested = false;
const dictionaryWaiters = [];
function dictionaryReady(){ return typeof WORD_SET !== 'undefined'; }
function loadDictionary(){
  if(dictionaryRequested || dictionaryReady()) return;
  dictionaryRequested = true;
  const el = document.createElement('script');
  el.src = DICTIONARY_SRC;
  el.onload = () => { while(dictionaryWaiters.length) dictionaryWaiters.shift()(); };
  el.onerror = () => { dictionaryRequested = false; setTimeout(loadDictionary, 2000); }; // retry on a network blip
  document.head.appendChild(el);
}
function whenDictionaryReady(fn){
  if(dictionaryReady()) return fn();
  dictionaryWaiters.push(fn);
  loadDictionary();
}
setTimeout(loadDictionary, 4000); // backstop in case startup stalls

// ---------- date helpers ----------
function bumpGuessCount(tier, L){
  const key = `letterladder:${accountScope}:${dateKey}:${tier}:guessCount:${L}`;
  const current = Number(localStorage.getItem(key) || 0);
  localStorage.setItem(key, String(current + 1));
  return current + 1;
}
function getTotalGuessCount(tier){
  let total = 0;
  const prefix = `letterladder:${accountScope}:${dateKey}:${tier}:guessCount:`;
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(prefix)) total += Number(localStorage.getItem(key) || 0);
  }
  return total;
}

function getPlayerId(){
  const key = 'letterladder:playerId';
  let id = localStorage.getItem(key);
  if(!id){
    id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `p-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    localStorage.setItem(key, id);
  }
  return id;
}

function todayKey(){
  // Always use US Eastern time so puzzles launch at midnight ET worldwide.
  // A player in Florence at 11pm ET sees the same puzzle as someone in New York.
  const d = new Date();
  const eastern = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const y = eastern.getFullYear();
  const m = String(eastern.getMonth()+1).padStart(2,'0');
  const day = String(eastern.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
function resolveDateKey(){
  // Supports "Past Puzzles" archive play via ?archive=YYYY-MM-DD. Only
  // ever accepts a date that's both a real scheduled puzzle AND strictly
  // before today - never today's own date (that's just the real game) and
  // never a future date (which would leak an upcoming puzzle early).
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('archive');
  const today = todayKey();
  if(requested && /^\d{4}-\d{2}-\d{2}$/.test(requested) && requested < today
     && PUZZLE_SCHEDULE && PUZZLE_SCHEDULE[requested]){
    return { key: requested, isArchive: true };
  }
  return { key: today, isArchive: false };
}

// ---------- game logic (ported from the original Flask app.py) ----------
function counter(str){
  const c = {};
  for(const ch of str) c[ch] = (c[ch]||0)+1;
  return c;
}
// Tapping a button while a box is focused would otherwise blur that
// input first, which triggers commit() and can close/reset the box
// before this button's own action gets a chance to run. The fix is to
// run the action directly inside touchend (with preventDefault to stop
// the blur), not in a separate click listener - preventDefault on a
// touch event can silently suppress the click that would otherwise
// follow it, which is what broke this whole class of button on mobile.
// options.ignoreMovedTouches: treat a touch as a tap only if the finger
// stayed (nearly) still and the browser didn't cancel it, so scrolling or
// sliding across the control never triggers it. Used by the timer toggle,
// where an accidental trigger silently turns the player's timer off.
function bindTapAction(el, action, options){
  let firedViaTouch = false;
  const ignoreMovedTouches = !!(options && options.ignoreMovedTouches);
  const TAP_MOVE_TOLERANCE_PX = 10;
  let touchStartX = 0, touchStartY = 0, touchMoved = false, suppressClickUntil = 0;
  if(ignoreMovedTouches){
    el.addEventListener('touchstart', (e)=>{
      const t = e.touches[0];
      touchStartX = t.clientX; touchStartY = t.clientY; touchMoved = false;
    }, { passive: true });
    el.addEventListener('touchmove', (e)=>{
      const t = e.touches[0];
      if(Math.abs(t.clientX - touchStartX) > TAP_MOVE_TOLERANCE_PX || Math.abs(t.clientY - touchStartY) > TAP_MOVE_TOLERANCE_PX){
        touchMoved = true;
      }
    }, { passive: true });
    el.addEventListener('touchcancel', ()=>{ touchMoved = true; }, { passive: true });
  }
  el.addEventListener('touchend', (e)=>{
    if(ignoreMovedTouches && !touchMoved){
      // Also compare where the finger lifted: once the browser takes over a
      // scroll it may stop delivering touchmove to the page entirely.
      const t = e.changedTouches && e.changedTouches[0];
      if(t && (Math.abs(t.clientX - touchStartX) > TAP_MOVE_TOLERANCE_PX || Math.abs(t.clientY - touchStartY) > TAP_MOVE_TOLERANCE_PX)){
        touchMoved = true;
      }
    }
    if(ignoreMovedTouches && touchMoved){
      // A scroll/slide, not a tap. Also swallow any click the browser might
      // still synthesize for this touch (it arrives right after touchend),
      // so it can't trigger the action either.
      suppressClickUntil = Date.now() + 800;
      return;
    }
    e.preventDefault();
    firedViaTouch = true;
    action();
  });
  el.addEventListener('mousedown', (e)=> e.preventDefault());
  el.addEventListener('click', ()=>{
    if(firedViaTouch){ firedViaTouch = false; return; }
    if(ignoreMovedTouches && Date.now() < suppressClickUntil) return;
    action();
  });
}

// Lets Enter submit a form from any of its input fields, by triggering
// the same submit button's click handler - avoids duplicating submit
// logic separately for keyboard vs. mouse/touch across every form.
function bindEnterToSubmit(inputEls, submitBtnEl){
  inputEls.forEach(inputEl => {
    if(!inputEl) return;
    inputEl.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        submitBtnEl.click();
      }
    });
  });
}

function showConfirmModal(message, onConfirm, onDismiss){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';

      <div class="confirm-actions">
        <button type="button" class="btn-ghost confirm-cancel">Cancel</button>
        <button type="button" class="btn-primary confirm-ok">Confirm</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  function close(confirmed){
    overlay.remove();
    if(!confirmed && onDismiss) onDismiss();
  }
  bindTapAction(overlay.querySelector('.confirm-cancel'), ()=> close(false));
  setTimeout(()=>{
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(false); });
  }, 0);
  bindTapAction(overlay.querySelector('.confirm-ok'), ()=>{
    close(true);
    onConfirm();
  });
}

const HOWTO_SEEN_KEY = 'letterladder:howToPlaySeen';
// showHowToPlayPopupIfNeeded removed — the landing page handles all
// onboarding. The HOWTO_SEEN_KEY constant is kept because the landing
// page's Back navigation still reads/writes it.

// ACCOUNT_OR_GUEST_CHOICE_MADE_KEY and showAccountOrGuestPopupIfNeeded removed —
// users are no longer prompted to choose between account and guest.
// They simply play; account creation is available through the menu.

// showTimerChoicePopupIfNeeded removed — the landing page sets the timer
// choice before navigating here, so no in-game timer popup is needed.

// TIMER_CHOICE_MADE_KEY is kept — still used in the login flow (restoring
// the account's saved timer preference) and in cloud backfill logic.
const TIMER_CHOICE_MADE_KEY = 'letterladder:timerChoiceMade';

function joinAnd(items){
  if(items.length === 1) return items[0];
  if(items.length === 2) return `${items[0]} and ${items[1]}`;
  return `${items.slice(0,-1).join(', ')}, and ${items[items.length-1]}`;
}
function lettersPhrase(letters){
  return letters.length === 1 ? `the letter ${letters[0]}` : `the letters ${joinAnd(letters)}`;
}
function getHintLetterOrder(word){
  // The hint just needs to show which letters are used, not imply any
  // particular order matters - so if the plain alphabetical arrangement
  // happens to spell out a real word (possibly even the answer itself),
  // shuffle instead rather than accidentally giving away more than
  // intended.
  const lower = word.toLowerCase();
  const sorted = lower.split('');
  sorted.sort();
  const isWord = w => dictionaryReady() ? WORD_SET.has(w) : true; // unknown yet: shuffle to be safe
  if(!isWord(sorted.join(''))){
    return sorted;
  }
  let attempt = sorted.slice();
  for(let i = 0; i < 20; i++){
    for(let j = attempt.length - 1; j > 0; j--){
      const k = Math.floor(Math.random() * (j + 1));
      [attempt[j], attempt[k]] = [attempt[k], attempt[j]];
    }
    if(!isWord(attempt.join(''))) return attempt;
  }
  // Vanishingly unlikely to ever be reached, but don't loop forever.
  return attempt;
}
// Returns the starting (bottom) word's letters the guess is missing. Letters
// outside the final word, or beyond its counts, can't reach here: the rung
// input only accepts the final word's letters (sanitizeToAllowedLetters).
function checkGuessLetters(guess, startingWord, finalWord){
  const guessCounter = counter(guess);
  const startingCounter = counter(startingWord);
  const missingStarting = [];
  for(const ch of Object.keys(startingCounter)){
    const have = guessCounter[ch] || 0;
    if(have < startingCounter[ch]) missingStarting.push(ch);
  }
  return missingStarting;
}
function isStepValid(word1, word2){
  if(word2.length !== word1.length + 1){
    return { valid:false, reason:'wrong_length' };
  }
  const counts1 = counter(word1);
  const counts2 = counter(word2);
  const missing = [];
  for(const ch of Object.keys(counts1)){
    const have = counts2[ch] || 0;
    if(have < counts1[ch]) missing.push(ch);
  }
  if(missing.length > 0){
    return { valid:false, reason:'missing_letters', letters: missing };
  }
  return { valid:true };
}
function isValidChain(startingWord, guessesObj, finalWord){
  const lengths = Object.keys(guessesObj).map(Number).sort((a,b)=>a-b);
  const allWords = [startingWord, ...lengths.map(l => guessesObj[l]), finalWord];
  const invalidSteps = [];
  for(let i=0;i<allWords.length-1;i++){
    const result = isStepValid(allWords[i], allWords[i+1]);
    if(!result.valid){
      invalidSteps.push({ from: allWords[i], to: allWords[i+1], ...result });
    }
  }
  return { valid: invalidSteps.length === 0, invalidSteps };
}

// ---------- state ----------
const TIERS = ['easy','medium','hard'];
// Must match START_DATE in scripts/generate_schedule.py, so the puzzle
// "day number" shown in shared results matches what the schedule actually
// uses. Update both together if you ever change the launch date.
const LAUNCH_DATE_KEY = '2026-07-27';
const SITE_URL = 'https://letterladder.io/';
let activeTier = (function(){
  const saved = localStorage.getItem('letterladder:activeTier');
  return TIERS.includes(saved) ? saved : 'easy';
})();
let activeLength = null; // which rung (by word length) is currently being typed into
let skipNextBankTap = false; // true right after a drag-reorder finishes, so its release isn't also read as a letter-select tap
let activeSlotHasUntouchedGuess = false; // true right after opening a rung that already had a complete guess, until the first real edit happens - lets the next bank-tile tap or Backspace/Delete replace/clear it outright instead of appending onto or partially editing the old guess
let suppressBlurCommit = false; // true only while the panel is mid-rebuild, so the blur fired by destroying the focused input isn't mistaken for the person clicking away
let lastEnterCommitAt = 0; // guards against iOS sometimes firing two separate
                            // "Enter was pressed" signals for one keypress
let lastFeedback = {}; // per-tier: the last shown error, so it survives a
                        // re-render triggered by opening a different box
                        // (e.g. the keyboard appearing) instead of vanishing
let bankState = {}; // per tier: { word, order } - the source word the bank's
                     // tiles are drawn from, and their current shuffle order
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
let keyboardEnabled = isTouchDevice ? (localStorage.getItem('letterladder:keyboardEnabled') === 'true') : true; // bank-first on mobile, always-on on desktop
const OLD_DOMAIN_HOSTNAME = 'jmaser54.github.io';
const NEW_DOMAIN_HOSTNAME = 'letterladder.io';

function collectMigratableData(){
  const data = {};
  const globalKeys = [
    'letterladder:stats',
    'letterladder:activeTier',
    'letterladder:howToPlaySeen',
    'letterladder:keyboardEnabled',
    'letterladder:timerChoice',
    'letterladder:timerChoiceMade',
  ];
  for(const key of globalKeys){
    const value = localStorage.getItem(key);
    if(value !== null) data[key] = value;
  }
  // Also grab everything scoped to today's date (in-progress gameplay:
  // guesses, hints used, timer state, played/solved/loss bookkeeping
  // flags) - past days' per-puzzle data isn't included since it's no
  // longer actionable anyway (an old puzzle can't be replayed), and the
  // aggregate stats object above already captures what matters from
  // history (streaks, totals, scores).
  const todayPrefix = `letterladder:${todayKey()}:`;
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(todayPrefix)){
      data[key] = localStorage.getItem(key);
    }
  }
  return data;
}

function importMigrationDataIfPresent(){
  const host = window.location.hostname;
  const onNewDomain = host === NEW_DOMAIN_HOSTNAME || host.endsWith('.' + NEW_DOMAIN_HOSTNAME);
  if(!onNewDomain) return;
  const params = new URLSearchParams(window.location.search);
  const migrateParam = params.get('migrate');
  if(!migrateParam) return;

  try{
    const data = JSON.parse(decodeURIComponent(migrateParam));
    let importedCount = 0;
    for(const [key, value] of Object.entries(data)){
      if(key === getStatsKey()){
        // Stats get a genuine field-by-field merge rather than an
        // all-or-nothing replace, since someone may have already played
        // a bit on this domain before migrating - a whole-object
        // replace would silently throw away whichever side didn't win,
        // rather than combining them. Unlike every other key below,
        // summing isn't naturally safe to repeat - re-running the same
        // migration link would double the numbers each time - so this
        // is explicitly guarded to only ever merge once.
        if(localStorage.getItem('letterladder:statsMigrationApplied')){
          continue;
        }
        const incoming = JSON.parse(value);
        const existing = loadStats();
        const merged = {};
        for(const tier of ['easy','medium','hard','total']){
          const a = existing[tier] || blankStat();
          const b = incoming[tier] || blankStat();
          const aMoreRecent = (a.lastSolvedDate || '') >= (b.lastSolvedDate || '');
          merged[tier] = {
            played: (a.played || 0) + (b.played || 0),
            solved: (a.solved || 0) + (b.solved || 0),
            maxStreak: Math.max(a.maxStreak || 0, b.maxStreak || 0),
            lastSolvedDate: aMoreRecent ? a.lastSolvedDate : b.lastSolvedDate,
            currentStreak: aMoreRecent ? (a.currentStreak || 0) : (b.currentStreak || 0),
          };
        }
        saveStats(merged);
        localStorage.setItem('letterladder:statsMigrationApplied', '1');
        importedCount++;
        continue;
      }
      // Only fill in keys that aren't already present locally, so this
      // never overwrites any fresh progress already made on the new
      // domain before clicking the migration link.
      if(localStorage.getItem(key) === null){
        localStorage.setItem(key, value);
        importedCount++;
      }
    }
    if(importedCount > 0){
      window.letterLadderMigrationJustImported = true;
    }
  }catch(e){
    // malformed or tampered migrate param - fail silently rather than
    // breaking the page load over it
  }

  // Clean the URL either way, so the migration data doesn't linger in
  // the address bar or browser history.
  const cleanUrl = window.location.origin + window.location.pathname;
  window.history.replaceState({}, '', cleanUrl);
}

function showMigrationWelcomeBannerIfNeeded(){
  if(!window.letterLadderMigrationJustImported) return;
  const banner = document.createElement('div');
  banner.className = 'migration-banner';
  banner.textContent = "Welcome back! Your streak and stats have carried over.";
  document.body.appendChild(banner);
  setTimeout(()=> banner.remove(), 5000);
}

function showMigrationLinkBannerIfNeeded(){
  // Any page on the old origin, not one specific path: once a custom
  // domain is attached, the original project path HTTP-redirects to it
  // before any script can run there, so pinning this to that path meant
  // the banner could never appear. Other repos on the same account share
  // the same origin (and therefore the same saved progress) without
  // being redirected, so this can still do useful work from one of those.
  if(window.location.hostname !== OLD_DOMAIN_HOSTNAME) return;
  if(localStorage.getItem('letterladder:migrationBannerDismissed')) return;
  const data = collectMigratableData();
  if(Object.keys(data).length === 0) return; // nothing meaningful to offer migrating

  const encoded = encodeURIComponent(JSON.stringify(data));
  const migrationUrl = `https://${NEW_DOMAIN_HOSTNAME}/?migrate=${encoded}`;

  const banner = document.createElement('div');
  banner.className = 'migration-banner migration-banner-persistent';
  banner.innerHTML = `
    <span>We've moved! <a href="${migrationUrl}">Play at letterladder.io</a> to keep your streak and stats.</span>
    <button type="button" class="migration-dismiss" aria-label="Dismiss">&times;</button>
  `;
  document.body.appendChild(banner);
  banner.querySelector('.migration-dismiss').addEventListener('click', () => {
    localStorage.setItem('letterladder:migrationBannerDismissed', '1');
    banner.remove();
  });
}

const { key: dateKey, isArchive: isArchiveMode } = resolveDateKey();

// Daily rollover: if the puzzle date has changed since the user last
// viewed this page, redirect them to the landing page so they get the
// intentional "new day" experience (streak messaging, Play button, etc.)
// rather than being silently dropped into the new day's puzzle.
// This is the single source of truth for date-change detection.
const LAST_VIEWED_DATE_KEY = 'letterladder:lastViewedDateKey';
const lastViewedDate = localStorage.getItem(LAST_VIEWED_DATE_KEY);
// "Play today's puzzle" links (game.html?play=today) are an explicit request
// for today's puzzle: start the new day on Easy right here instead of
// redirecting to the landing page.
const explicitPlayToday = new URLSearchParams(window.location.search).get('play') === 'today';
if(!isArchiveMode && explicitPlayToday && lastViewedDate !== dateKey){
  localStorage.setItem(LAST_VIEWED_DATE_KEY, dateKey);
  activeTier = 'easy';
  localStorage.setItem('letterladder:activeTier', 'easy');
} else if(!isArchiveMode && lastViewedDate && lastViewedDate !== dateKey){
  // Date has changed — send to landing page before anything renders.
  // Update the stored date first so a normal same-day reload after
  // reaching the landing page doesn't trigger another redirect.
  localStorage.setItem(LAST_VIEWED_DATE_KEY, dateKey);
  localStorage.setItem('letterladder:activeTier', 'easy');
  window.location.replace('index.html');
  // Stop all further script execution while the redirect happens.
  throw new Error('daily-rollover-redirect');
} else {
  // Same day (or first ever visit) — record this date and continue normally.
  localStorage.setItem(LAST_VIEWED_DATE_KEY, dateKey);
  if(!lastViewedDate){
    // First visit ever — default to easy
    activeTier = 'easy';
    localStorage.setItem('letterladder:activeTier', 'easy');
  }
}
// Isolates all per-day puzzle-progress and stats keys by account, so
// logging out of one account and into another on the same device never
// bleeds data between them. Guests share one common 'guest' namespace,
// matching how things worked before accounts existed - guests don't get
// personal stats tracked anyway, so this only matters for the day's
// in-progress guesses/hints, which is fine to share among guest sessions.
// accountScope starts as 'guest' and is set authoritatively in onAuthReady
// after Firebase Auth resolves and players/{uid}.username is confirmed from
// Firestore. Nothing reads puzzle state before accountScope is correct.
let accountScope = 'guest';

// Guard that prevents visibilitychange/pagehide from syncing stats before
// authoritative account initialization is complete. Set to true only after:
// Auth resolved → accountScope confirmed from Firestore → ownerUid validated
// → cloud stats/dailyProgress restored → game rendered.
// Prevents a pre-init sync from writing another account's stats to Firestore.
let accountScopeReady = false;

// ---------- optional per-puzzle timer ----------
const TIMER_CHOICE_KEY = 'letterladder:timerChoice';
function getTimerChoice(){ return localStorage.getItem(TIMER_CHOICE_KEY) || 'timed'; }
function setTimerChoice(choice){
  localStorage.setItem(TIMER_CHOICE_KEY, choice);
  // Remembers this as the account's usual preference in the cloud, so
  // logging in on a different or unfamiliar device later correctly
  // recalls it - rather than leaving someone who always plays timed
  // stuck on whatever was locally set as a guest on that device.
  if(window.LetterLadderAuth){
    const user = window.LetterLadderAuth.getCurrentUser();
    if(user && !user.isAnonymous){
      try{
        window.LetterLadderAuth.setDoc(
          window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'playerStats', user.uid),
          { timerChoice: choice },
          { merge: true }
        ).catch(()=>{});
      }catch(e){}
    }

function timerStartKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}:timerStartedAt`; }
function timerElapsedKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}:timerElapsedMs`; }
function timerAccumulatedKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}:timerAccumulatedMs`; }

// The timer should only advance while the player is actually here, on this
// puzzle - not while the tab is hidden, another tier is active, or they've
// navigated to a different page entirely. Rather than tracking a single
// start timestamp and assuming it always represents unbroken elapsed time,
// this banks completed segments into an accumulated total and only ever
// treats timerStartKey as "the current segment's start" - present exactly
// while actively running, absent while paused.
function getCurrentElapsedMs(tier){
  const accumulated = Number(localStorage.getItem(timerAccumulatedKey(tier)) || 0);
  const segmentStart = localStorage.getItem(timerStartKey(tier));
  const running = segmentStart !== null ? (Date.now() - Number(segmentStart)) : 0;
  return accumulated + running;
}
function pauseTimer(tier){
  const segmentStart = localStorage.getItem(timerStartKey(tier));
  if(segmentStart === null) return; // already paused (or never started) - nothing to fold in
  const elapsed = getCurrentElapsedMs(tier);
  localStorage.setItem(timerAccumulatedKey(tier), String(elapsed));
  localStorage.removeItem(timerStartKey(tier));
}

function formatElapsed(ms){
  const totalSeconds = Math.floor(ms / 1000);
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function hasEverStartedTimer(tier){
  const accumulated = Number(localStorage.getItem(timerAccumulatedKey(tier)) || 0);
  return accumulated > 0
    || localStorage.getItem(timerElapsedKey(tier)) !== null
    || localStorage.getItem(timerStartKey(tier)) !== null;
}

function showPlayPopupIfNeeded(tier, onPlay, onBack){
  // The landing page now handles pre-game onboarding, so there is no

  if(!isTouchDevice && activeLength != null){

    if(inputEl) inputEl.focus({ preventScroll: true });

function startTimerIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never get timed
  if(!(PUZZLE_SCHEDULE[dateKey] && PUZZLE_SCHEDULE[dateKey][tier])) return; // nothing scheduled to time
  if(localStorage.getItem(timerElapsedKey(tier))) return; // already solved and frozen
  if(localStorage.getItem(timerStartKey(tier))) return; // already started
  localStorage.setItem(timerStartKey(tier), String(Date.now()));
}
let timerTickInterval = null;

function storageKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}`; }

}
