// ---------- stats, streaks & score (all local to this device/browser -
// there are no accounts, so none of this follows you to another device) ----------
// STATS_KEY is a function, not a constant, so it always reflects the current
// accountScope rather than the value at module parse time.
function getStatsKey(){ return `letterladder:${accountScope}:stats`; }

function blankStat(){
  return { played:0, solved:0, currentStreak:0, maxStreak:0, lastSolvedDate:null };
}
function loadStats(){
  try{
    // One-time recovery: stats accumulated before account-scoping existed
    // lived under this same, unscoped key. The very first time a given
    // account loads its own (still-empty) scoped stats, inherit a copy of
    // that pre-existing history rather than silently losing it - the old
    // key is left in place rather than deleted, since it's ambiguous
    // which account should end up claiming it.
    const raw = localStorage.getItem(getStatsKey());
    if(raw){
      const parsed = JSON.parse(raw);
      // guard against a corrupted/partial object from an older version
      for(const key of ['easy','medium','hard','total']){
        parsed[key] = Object.assign(blankStat(), parsed[key] || {});
      }
      return parsed;
    }
  }catch(e){}
  return { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
}
function saveStats(stats){
  try{ localStorage.setItem(getStatsKey(), JSON.stringify(stats)); }catch(e){}
  syncStatsToCloud(stats);
}

// Fire-and-forget: keeps a durable, cloud-backed copy of stats in sync
// with every local change, so they survive local storage getting cleared
// and can eventually follow the account across devices. Local storage
// remains the fast, synchronous source of truth for everything currently
// on this page - this just mirrors it outward in the background.
let dailyProgressSyncTimeout = null;
let lastKnownProgressSnapshotJSON = null;

// Excludes lastModifiedAt itself from the comparison snapshot - comparing
// a snapshot against itself including its own timestamp key would be
// circular, since that key changes every time it's bumped regardless of
// whether anything else did.
function getComparableProgressSnapshot(){
  const snapshot = getTodaysProgressSnapshot();
  delete snapshot[`letterladder:${accountScope}:${dateKey}:lastModifiedAt`];
  return snapshot;
}

// Silently re-establishes the comparison baseline to match whatever was
// just restored from the cloud, without treating that restoration itself
// as a "genuine new change" that would spuriously bump the timestamp
// right back to now - which would defeat the point of having preserved
// the cloud's original, meaningful timestamp in the first place.
function rebaselineProgressComparison(){
  lastKnownProgressSnapshotJSON = JSON.stringify(getComparableProgressSnapshot());
}

function scheduleDailyProgressSync(){
  // Only bumps the timestamp when the underlying progress data has
  // genuinely changed since it was last seen - not simply whenever
  // render() happens to fire, which includes plain page loads and
  // passive re-displays with zero new progress. Without this check, a
  // browser could always look artificially "more recent" than the cloud
  // just from being opened, even while holding stale, pre-fix puzzle
  // data - which is exactly what let it keep losing the comparison and
  // never actually pulling the real, current state.
  if(window.LetterLadderAuth && !isArchiveMode){
    const user = window.LetterLadderAuth.getCurrentUser();
    if(user && !user.isAnonymous){
      const currentJSON = JSON.stringify(getComparableProgressSnapshot());
      if(lastKnownProgressSnapshotJSON !== null && currentJSON !== lastKnownProgressSnapshotJSON){
        localStorage.setItem(`letterladder:${accountScope}:${dateKey}:lastModifiedAt`, String(Date.now()));
      }
      lastKnownProgressSnapshotJSON = currentJSON;
    }
  }
  clearTimeout(dailyProgressSyncTimeout);
  dailyProgressSyncTimeout = setTimeout(syncDailyProgressToCloud, 2000);
}

function syncStatsToCloud(stats){
  if(!window.LetterLadderAuth) return;
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return;
  // Never sync a completely blank stats object up to the cloud - since
  // merge:true replaces each tier's object wholesale rather than deep-
  // merging its individual fields, writing an all-zero state here would
  // silently destroy any real, existing progress already in the cloud.
  // The only time every tier is genuinely 0/0 is either a brand-new
  // account (cloud is presumably also blank, so skipping is harmless) or
  // local data that's been lost/wiped, which should never be allowed to
  // propagate and overwrite real cloud data.
  const isEntirelyBlank = [...TIERS, 'total'].every(tier => {
    const t = stats[tier] || {};
    return !t.played && !t.solved;
  });
  if(isEntirelyBlank) return;
  const attempt = () => window.LetterLadderAuth.setDoc(
    window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'playerStats', user.uid),
    stats,
    { merge: true }
  );
  try{
    attempt().catch(() => {
      // One retry after a short delay - covers the common case of a
      // brief network hiccup or the write racing a page navigation,
      // without adding unbounded retry complexity right before launch.
      setTimeout(() => { attempt().catch(()=>{}); }, 1500);
    });
  }catch(e){}
}

// Captures every localStorage key under today's account+date prefix as
// one bundle - guesses, timer state, hints, completion flags, all of it
// - rather than listing each specific key type individually, which would
// risk silently missing something as the game's state model grows. This
// naturally includes lastModifiedAt too, since it lives under the same
// prefix, so it correctly travels along with the rest of the snapshot.
function getTodaysProgressSnapshot(){
  const prefix = `letterladder:${accountScope}:${dateKey}:`;
  const snapshot = {};
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(prefix)){
      snapshot[key] = localStorage.getItem(key);
    }
  }
  return snapshot;
}

function applyProgressSnapshot(snapshot){
  for(const key of Object.keys(snapshot)){
    localStorage.setItem(key, snapshot[key]);
  }
}

function getLocalLastModifiedAt(){
  return Number(localStorage.getItem(`letterladder:${accountScope}:${dateKey}:lastModifiedAt`) || 0);
}

// When someone creates an account mid-session after already genuinely
// playing (and possibly solving) today's puzzles as a guest, that
// progress lives under the 'guest' scope and would otherwise be
// silently orphaned - the new account's own scope starts out completely
// empty, making an already-solved puzzle look unstarted after the
// reload. This re-keys today's guest-scoped progress under the new
// account's scope instead, before the reload happens, so nothing gets
// lost. Only runs when genuinely coming from guest play - a normal
// login/account-creation from a fresh, guest-free session has nothing
// to migrate and this correctly no-ops.
function migrateGuestProgressToAccount(newUsername){
  if(accountScope !== 'guest') return;
  const guestSnapshot = getTodaysProgressSnapshot();
  const oldPrefix = `letterladder:guest:`;
  const newPrefix = `letterladder:${newUsername}:`;
  const migratedSnapshot = {};
  for(const key of Object.keys(guestSnapshot)){
    if(key.startsWith(oldPrefix)){
      const newKey = newPrefix + key.slice(oldPrefix.length);
      localStorage.setItem(newKey, guestSnapshot[key]);
      migratedSnapshot[newKey] = guestSnapshot[key];
    }
  }
  // Push this migrated data to the cloud immediately, under the new
  // account's real uid - without this, the migration only ever existed
  // on this one device, and a fresh session anywhere else (a different
  // browser, incognito, another device) would find nothing to restore
  // and show every puzzle as unstarted, despite it genuinely already
  // being solved.
  try{
    const user = window.LetterLadderAuth && window.LetterLadderAuth.getCurrentUser();
    if(user && !user.isAnonymous && Object.keys(migratedSnapshot).length > 0){
      const modifiedAt = Date.now();
      migratedSnapshot[`letterladder:${newUsername}:${dateKey}:lastModifiedAt`] = String(modifiedAt);
      localStorage.setItem(`letterladder:${newUsername}:${dateKey}:lastModifiedAt`, String(modifiedAt));
      window.LetterLadderAuth.setDoc(
        window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'dailyProgress', `${user.uid}_${dateKey}`),
        { snapshot: migratedSnapshot, lastModifiedAt: modifiedAt }
      ).catch(()=>{});
    }
  }catch(e){}
}

// Guests never get personal stats tracked (markPlayedIfNeeded/
// markSolvedIfNeeded both skip entirely without a real account), and
// their leaderboard scores get submitted under 'Guest', not any
// specific account. So completing puzzles as a guest and then creating
// an account partway through today left those earlier completions
// stranded - correctly migrated as raw progress data (guesses, timer),
// but never counted toward played/solved/streak, and never
// re-attributed on the leaderboard. This backfills both, for every
// tier genuinely won today (excluding revealed solutions) that stats
// don't yet reflect. Safe to call unconditionally: re-submitting an
// already-attributed score is a harmless overwrite given deterministic,
// per-account document IDs, and the lastSolvedDate check below is what
// actually prevents double-counting stats.
async function backfillGuestStatsAndScores(newUsername){
  // Grab the anonymous UID saved just before account creation — used to
  // delete the old guest score docs so they don't persist alongside the
  // new real-account entries on the leaderboard.
  const anonUidToClean = sessionStorage.getItem('letterladder:anonUidForCleanup') || null;
  if(anonUidToClean) sessionStorage.removeItem('letterladder:anonUidForCleanup');
  // loadStats()/saveStats() both read and write the module-level
  // STATS_KEY constant, which is fixed to the OLD 'guest' scope at this
  // point in execution (accountScope only re-evaluates on the page's
  // next reload) - using them here would silently write these backfilled
  // stats to the wrong, orphaned key. Read/write the new account's key
  // explicitly instead, mirroring loadStats' exact parsing/defaulting.
  const newStatsKey = `letterladder:${newUsername}:stats`;
  let stats;
  try{
    const raw = localStorage.getItem(newStatsKey);
    const parsed = raw ? JSON.parse(raw) : {};
    stats = {
      easy: Object.assign(blankStat(), parsed.easy || {}),
      medium: Object.assign(blankStat(), parsed.medium || {}),
      hard: Object.assign(blankStat(), parsed.hard || {}),
      total: Object.assign(blankStat(), parsed.total || {}),
    };
  }catch(e){
    stats = { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
  }

  let anyBackfilled = false;
  for(const tier of TIERS){
    const playedFlag = `letterladder:${newUsername}:${dateKey}:${tier}:playedCounted`;
    const solvedFlag = `letterladder:${newUsername}:${dateKey}:${tier}:solvedCounted`;
    const alreadyCounted = localStorage.getItem(playedFlag);
    if(isTierGenuinelyWon(tier) && !alreadyCounted){
      stats[tier].played += 1;
      stats[tier].solved += 1;
      bumpStreak(stats[tier], dateKey);
      stats.total.played += 1;
      stats.total.solved += 1;
      anyBackfilled = true;
      localStorage.setItem(playedFlag, '1');
      localStorage.setItem(solvedFlag, '1');
      await submitCurrentScore(tier, newUsername, true);
      if(anonUidToClean && window.LetterLadderAuth && window.LetterLadderAuth.deleteDoc){
        try{
          await window.LetterLadderAuth.deleteDoc(
            window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'scores', `${anonUidToClean}_${dateKey}_${tier}`)
          );
        }catch(e){}
      }
    } else if(isTierGenuinelyWon(tier) && alreadyCounted){
      // markPlayedIfNeeded already ran for this tier — just submit the
      // score under the real account without double-counting stats.
      anyBackfilled = true;
      await submitCurrentScore(tier, newUsername, true);
      if(anonUidToClean && window.LetterLadderAuth && window.LetterLadderAuth.deleteDoc){
        try{
          await window.LetterLadderAuth.deleteDoc(
            window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'scores', `${anonUidToClean}_${dateKey}_${tier}`)
          );
        }catch(e){}
      }
    }
  }
  const allThreeScheduled = TIERS.every(t => getTodaysPuzzle(t) !== null);
  if(allThreeScheduled && TIERS.every(isTierGenuinelyWon) && stats.total.lastSolvedDate !== dateKey){
    bumpStreak(stats.total, dateKey);
    anyBackfilled = true;
  }
  if(anyBackfilled){
    try{ localStorage.setItem(newStatsKey, JSON.stringify(stats)); }catch(e){}
    syncStatsToCloud(stats);
  }
}

// Same fire-and-forget pattern as stats: keeps a durable, cloud-backed
// copy of today's actual puzzle progress in sync, so a genuinely fresh
// browser or device can restore it rather than starting from scratch.
// The lastModifiedAt timestamp travels alongside the snapshot, since
// it's what a later session needs to correctly resolve a conflict
// against its own local state.
function syncDailyProgressToCloud(){
  if(!window.LetterLadderAuth) return;
  if(isArchiveMode) return; // archive plays never sync progress
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return;
  try{
    const snapshot = getTodaysProgressSnapshot();
    let modifiedAt = getLocalLastModifiedAt();
    if(modifiedAt === 0){
      modifiedAt = Date.now();
      localStorage.setItem(`letterladder:${accountScope}:${dateKey}:lastModifiedAt`, String(modifiedAt));
    }
    window.LetterLadderAuth.setDoc(
      window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'dailyProgress', `${user.uid}_${dateKey}`),
      { snapshot, lastModifiedAt: modifiedAt }
    ).then(() => {
    }).catch((e) => {
    });
  }catch(e){
  }
}

// Compares the local and cloud timestamps directly and lets whichever
// side was genuinely touched more recently win - rather than a blunt
// "only pull if local is completely empty" check, which would leave two
// sessions with any pre-existing local data permanently unable to ever
// reconcile with each other, even when one is meaningfully more current.
async function pullDailyProgressFromCloudIfNeeded(){
  if(!window.LetterLadderAuth) return false;
  if(isArchiveMode) return false;
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return false;
  try{
    const snap = await window.LetterLadderAuth.getDoc(
      window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'dailyProgress', `${user.uid}_${dateKey}`)
    );
    if(!snap.exists() || !snap.data().snapshot){
      return false;
    }
    const cloudModifiedAt = Number(snap.data().lastModifiedAt || 0);
    const localModifiedAt = getLocalLastModifiedAt();
    const localIsGenuinelyEmpty = Object.keys(getTodaysProgressSnapshot()).length === 0;
    if(cloudModifiedAt <= localModifiedAt && !localIsGenuinelyEmpty){
      return false;
    }
    const snapshot = snap.data().snapshot;
    // Validate that the snapshot's keys belong to the current accountScope.
    // If they belong to a different account (cross-account contamination —
    // the toohotforapenguin/Umbrellaboy bug), reject the snapshot entirely
    // rather than applying another account's puzzle state to this session.
    const expectedPrefix = `letterladder:${accountScope}:`;
    const snapshotKeys = Object.keys(snapshot);
    const foreignKeys = snapshotKeys.filter(k => !k.startsWith(expectedPrefix));
    if(foreignKeys.length > 0){
      // Determine what account the snapshot actually belongs to
      const sampleKey = foreignKeys[0];
      const rejectedPrefix = sampleKey.split(':').slice(0,2).join(':') + ':';
      console.warn(
        '[Letter Ladder] dailyProgress snapshot rejected — cross-account contamination detected.\n' +
        `  Current accountScope: "${accountScope}"\n` +
        `  Rejected key prefix:  "${rejectedPrefix}"\n` +
        `  UID: ${user.uid}\n` +
        `  dateKey: ${dateKey}\n` +
        `  Foreign keys (${foreignKeys.length}): ${foreignKeys.slice(0,3).join(', ')}${foreignKeys.length > 3 ? '…' : ''}`
      );
      return false;
    }
    applyProgressSnapshot(snapshot);
    return true;
  }catch(e){
  }
  return false;
}

importMigrationDataIfPresent(); // deferred to here so STATS_KEY/blankStat/loadStats/saveStats above are safely initialized before the merge logic can reference them
function dateKeyMinusOneDay(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()-1);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function bumpStreak(stat, todayKeyStr){
  if(stat.lastSolvedDate === todayKeyStr) return; // already counted today, don't double-bump
  const wasYesterday = stat.lastSolvedDate === dateKeyMinusOneDay(todayKeyStr);
  stat.currentStreak = wasYesterday ? stat.currentStreak + 1 : 1;
  stat.maxStreak = Math.max(stat.maxStreak, stat.currentStreak);
  stat.lastSolvedDate = todayKeyStr;
}

function revealSolutionAsLoss(tier){
  const puzzleHints = HINTS_SCHEDULE[dateKey] && HINTS_SCHEDULE[dateKey][tier];
  if(!puzzleHints) return; // nothing to reveal - shouldn't happen in practice
  const solution = puzzleHints.solution;
  const revealedGuesses = {};
  for(let i = 1; i < solution.length - 1; i++){
    revealedGuesses[solution[i].length] = solution[i];
  }
  saveGuesses(tier, revealedGuesses);
  localStorage.setItem(`letterladder:${accountScope}:${dateKey}:${tier}:solutionRevealedAsLoss`, '1');
  const hasEverStarted = localStorage.getItem(timerStartKey(tier)) !== null || localStorage.getItem(timerAccumulatedKey(tier)) !== null;
  if(hasEverStarted && !localStorage.getItem(timerElapsedKey(tier))){
    localStorage.setItem(timerElapsedKey(tier), String(getCurrentElapsedMs(tier)));
  }
  recordLossIfNeeded(tier);
}

function hasRealAccount(){
  return !!localStorage.getItem('letterladder:accountUsername');
}

function recordLossIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:lossCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  markPlayedIfNeeded(tier);

  function updateStatsForLoss(){
    if(hasRealAccount()){
      const stats = loadStats();
      stats[tier].currentStreak = 0; // explicitly break the streak - this is a loss
      saveStats(stats);
    }
  }
  // Same ordering as played/solved updates: wait for the cloud stats pull,
  // so stale local stats are never uploaded over newer cloud stats.
  if(statsPullPromise){
    statsPullPromise.then(updateStatsForLoss).catch(updateStatsForLoss);
  } else {
    updateStatsForLoss();
  }
}

function markPlayedIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  if(!hasRealAccount()) return; // guests don't get personal stats tracked at all
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:playedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  function updatePlayedCount(){
    const stats = loadStats();
    stats[tier].played += 1;
    stats.total.played += 1;
    saveStats(stats);
  }
  if(statsPullPromise){
    statsPullPromise.then(updatePlayedCount).catch(updatePlayedCount);
  } else {
    updatePlayedCount();
  }
}

const HINT_TIME_PENALTY_MS = 3 * 60 * 1000;

function showHintTimePenaltyIndicator(){
  const existing = document.getElementById('hint-time-penalty-indicator');
  if(existing) existing.remove();

  // Append to timer-widget-anchor — the indicator is absolutely positioned
  // relative to timer-widget (its sibling's parent), so it floats below
  // the timer without affecting the flex layout or moving the timer.
  const anchor = document.querySelector('.timer-widget-anchor');
  if(!anchor) return;

  const indicator = document.createElement('div');
  indicator.id = 'hint-time-penalty-indicator';
  indicator.className = 'hint-time-penalty-indicator';
  indicator.textContent = '+3 mins';
  anchor.appendChild(indicator);

  setTimeout(() => {
    if(indicator.parentNode) indicator.remove();
  }, 3000);
}

function recordHintUsed(tier){
  const key = `letterladder:${accountScope}:${dateKey}:${tier}:hintsUsed`;
  const current = parseInt(localStorage.getItem(key) || '0', 10);
  localStorage.setItem(key, String(current + 1));

  // Applied directly to the accumulated total (not deferred until the
  // puzzle is completed), so the very next timer display tick already
  // reflects the penalty - regardless of whether the timer is currently
  // running or paused at this exact moment.
  const accumulatedKey = timerAccumulatedKey(tier);
  if(!isArchiveMode){
    const currentAccumulated = Number(localStorage.getItem(accumulatedKey) || 0);
    localStorage.setItem(accumulatedKey, String(currentAccumulated + HINT_TIME_PENALTY_MS));
  }

  if(!isArchiveMode && getTimerChoice() === 'timed'){
    showHintTimePenaltyIndicator();
  }
}
function getHintsUsed(tier){
  return parseInt(localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintsUsed`) || '0', 10);
}
// Practice mode: a puzzle solved today can be cleared and re-solved, but its
// result is locked - time, rank, stats and the shared result never change.
function wasSolvedToday(tier){
  return !isArchiveMode
    && !!localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:solvedCounted`)
    && !localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:solutionRevealedAsLoss`);
}
function isPracticeMode(tier){ return wasSolvedToday(tier) && !isTierComplete(tier); }
function lockedTimeMs(tier){
  if(getTimerChoice() !== 'timed') return null;
  const frozen = localStorage.getItem(timerElapsedKey(tier));
  return frozen !== null ? Number(frozen) : null;
}
function practiceNoteText(tier){
  const ms = lockedTimeMs(tier);
  return ms !== null
    ? `Your time for today is locked in at ${formatDurationForShare(ms)} — this is just practice.`
    : `You've already solved today's puzzle — this is just practice.`;
}
// Hints as they stood when the puzzle was solved (practice hints don't count).
function hintsForShare(tier){
  const atSolve = localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintsAtSolve`);
  return atSolve !== null ? parseInt(atSolve, 10) : getHintsUsed(tier);
}

function getHintInfo(tier, L){
  try{
    const raw = localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintInfo:${L}`);
    return raw ? JSON.parse(raw) : { count: 0, letters: null, firstLetter: null };
  }catch(e){
    return { count: 0, letters: null, firstLetter: null };
  }
}
function saveHintInfo(tier, L, info){
  localStorage.setItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintInfo:${L}`, JSON.stringify(info));
}

function getLastHintedLength(tier){
  const raw = localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:lastHintedLength`);
  return raw !== null ? Number(raw) : null;
}
function setLastHintedLength(tier, L){
  const key = `letterladder:${accountScope}:${dateKey}:${tier}:lastHintedLength`;
  if(L === null){
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, String(L));
  }
}

function buildHintDisplayHtml(tier, L){
  const info = getHintInfo(tier, L);
  const parts = [];
  if(info.letters){
    parts.push(`${L}-letter word uses: <span class="hint-letters">${info.letters}</span>`);
  }
  if(info.firstLetter){
    parts.push(`First letter: <span class="hint-letters">${info.firstLetter}</span>`);
  }
  return parts.join('<br>');
}

function markStartedIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:startedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  if(typeof dataLayer !== 'undefined'){
    dataLayer.push({
      event: 'puzzle_started',
      player_id: getPlayerId(),
      tier: tier,
      puzzle_date: dateKey,
    });
  }
}

// directly (not just after winning a timed puzzle) - shares the same
// underlying Firebase calls and error handling as the post-win popup.
function showAccountForm(mode){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  const isLogin = mode === 'login';
  overlay.innerHTML = `
    <div class="leaderboard-prompt-card">
      ${isLogin ? `<div class="leaderboard-prompt-title">Log in</div>` : `<div class="leaderboard-form-title">Create account</div>`}

      ${isLogin ? '' : `
        <input type="email" class="leaderboard-form-field" id="acct-email-field" placeholder="Email (optional)" autocomplete="email">
        <div class="leaderboard-form-hint">Your email will only be used for password recovery purposes.</div>
      `}
      <div class="leaderboard-prompt-actions">
        <button type="button" class="btn-primary" id="acct-submit-btn">${isLogin ? 'Log in' : 'Create account'}</button>
        <button type="button" class="btn-ghost" id="acct-cancel-btn">Cancel</button>
      </div>
      ${isLogin ? '<a href="#" class="leaderboard-form-hint" id="acct-forgot-link" style="display:block; text-align:center; margin-top:12px; cursor:pointer;">Forgot password?</a>' : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  bindTapAction(overlay.querySelector('#acct-cancel-btn'), close);

  const errorEl = overlay.querySelector('#acct-form-error');
  const submitBtnEl = overlay.querySelector('#acct-submit-btn');
  bindEnterToSubmit([
    overlay.querySelector('#acct-username-field'),
    overlay.querySelector('#acct-password-field'),
    overlay.querySelector('#acct-email-field'),
  ], submitBtnEl);

  if(isLogin){
    bindTapAction(overlay.querySelector('#acct-forgot-link'), ()=>{
      close();
      showForgotPasswordForm();
    });
  }

  bindTapAction(overlay.querySelector('#acct-submit-btn'), async ()=>{
    const username = overlay.querySelector('#acct-username-field').value.trim();
    const password = overlay.querySelector('#acct-password-field').value;
    if(!username || !password){
      errorEl.textContent = 'Please fill in both fields.';
      return;
    }
    errorEl.textContent = '';
    const emailField = overlay.querySelector('#acct-email-field');
    // Save anon UID before account creation so backfill can delete old guest docs
    const currentUserBeforeCreate = window.LetterLadderAuth.getCurrentUser();
    if(currentUserBeforeCreate && currentUserBeforeCreate.isAnonymous){
      sessionStorage.setItem('letterladder:anonUidForCleanup', currentUserBeforeCreate.uid);
    }
    const result = isLogin
      ? await window.LetterLadderAuth.login(username, password)
      : await window.LetterLadderAuth.createAccount(username, password, emailField ? emailField.value : '');
    if(!result.success){
      errorEl.textContent = result.error;
      return;
    }
    // Migrate guest localStorage keys BEFORE updating accountUsername,
    // so migrateGuestProgressToAccount sees accountScope as 'guest'.
    migrateGuestProgressToAccount(result.username);
    localStorage.setItem('letterladder:accountUsername', result.username);
    localStorage.setItem('letterladder:activeTier', 'easy');
    // Backfill scores and stats — runs for both login and create account.
    await backfillGuestStatsAndScores(result.username);

    // Pull this account's usual timer preference from the cloud, so
    // someone who always plays timed doesn't stay stuck on whatever was
    // locally set as a guest on this particular device.
    try{
      let usualTimerChoice = null;
      const statsSnap = await window.LetterLadderAuth.getDoc(
        window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'playerStats', result.uid)
      );
      if(statsSnap.exists() && statsSnap.data().timerChoice){
        usualTimerChoice = statsSnap.data().timerChoice;
      } else {
        const scoresQuery = window.LetterLadderAuth.query(
          window.LetterLadderAuth.collection(window.LetterLadderAuth.db, 'scores'),
          window.LetterLadderAuth.where('uid', '==', result.uid),
          window.LetterLadderAuth.limit(1)
        );
        const scoresSnap = await window.LetterLadderAuth.getDocs(scoresQuery);
        if(!scoresSnap.empty) usualTimerChoice = 'timed';
      }
      if(usualTimerChoice){
        localStorage.setItem(TIMER_CHOICE_KEY, usualTimerChoice);
        localStorage.setItem(TIMER_CHOICE_MADE_KEY, '1');
      }
    }catch(e){
      console.error('Failed to pull timer preference on login:', e);
    }

    window.location.reload();
  });
}

const LEADERBOARD_PROMPT_DISMISSED_KEY = 'letterladder:leaderboardPromptDismissed';

async function submitCurrentScore(tier, displayName, forceIfElapsed = false){
  if(!window.LetterLadderAuth) return;
  const timerChoice = getTimerChoice();

  // If the timer was never frozen for this tier but the user is timed,
  // freeze it now before reading — covers edge cases where the win path
  // didn't call pauseTimer first.
  if(!localStorage.getItem(timerElapsedKey(tier))){
    const current = getCurrentElapsedMs(tier);
    if(current > 0){
      localStorage.setItem(timerElapsedKey(tier), String(current));
    }
  }

  const rawElapsed = localStorage.getItem(timerElapsedKey(tier));
  const timeMs = rawElapsed ? Number(rawElapsed) : null;

  // Submit if: display toggle is timed, OR forceIfElapsed=true and a real elapsed time exists.
  // Never submit a 0 or null time — that's always a bug.
  const shouldSubmit = (timerChoice === 'timed' || (forceIfElapsed && timeMs !== null && timeMs > 0));
  const lbWhere = `${tier} ${dateKey}`;
  if(!shouldSubmit){ console.info(`[leaderboard] ${lbWhere}: not submitted - timer is off`); return; }
  if(!timeMs || timeMs === 0){ console.error(`[leaderboard] ${lbWhere}: not submitted - no recorded time`); return; }

  const hintsUsed = getHintsUsed(tier);
  const user = window.LetterLadderAuth.getCurrentUser();
  const uid = user ? user.uid : null;
  const isGuest = !user || user.isAnonymous;

  const scoreData = { date: dateKey, tier, timeMs, hintsUsed, displayName, uid, isGuest };

  // Always write to the immutable scores event log
  await window.LetterLadderAuth.submitScore({ date: dateKey, tier, timeMs, hintsUsed, displayName });

  // Also write to the leaderboardEntries display layer (timed only)
  if(!uid){
    console.error(`[leaderboard] ${lbWhere}: entry NOT written - not signed in to Firebase${isGuest && displayName !== 'Guest' ? ` (this device remembers account "${displayName}" but its sign-in has ended; the time is submitted when they sign in again)` : ''}`);
    return;
  }
  if(window.LetterLadderAuth.setDoc && window.LetterLadderAuth.doc && window.LetterLadderAuth.db){
    const entryRef = window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'leaderboardEntries', `${uid}_${dateKey}_${tier}`);
    let visible = true, reason = 'guest (guests are shown by default)';
    try{
      if(!isGuest){
        // Signed-in player: visible unless they turned the profile toggle
        // off. Missing players doc → recreated first; read failure → retry,
        // then last known setting, then visible (logged loudly).
        ({ visible, reason } = await window.LetterLadderAuth.leaderboardVisibilityFor(user, displayName));
      }
      // One entry per player per puzzle: the first solve of the day is the
      // one on the board (times are locked), so never try to replace it.
      const existing = await window.LetterLadderAuth.getDoc(entryRef).catch(() => null);
      if(existing && existing.exists()){
        const prev = existing.data();
        console.info(`[leaderboard] ${lbWhere}: entry NOT written - already on the board with ${formatDurationForShare(prev.timeMs)} (visible=${prev.visible}); the first solve of the day counts`);
        return;
      }
      await window.LetterLadderAuth.setDoc(entryRef, { ...scoreData, visible, createdAt: Date.now() }, { merge: false });
      console.info(`[leaderboard] ${lbWhere}: entry written for "${displayName}" - ${formatDurationForShare(timeMs)}, visible=${visible} (${reason})`);
    }catch(e){
      console.error(`[leaderboard] ${lbWhere}: entry write FAILED for "${displayName}" (visible=${visible}, ${reason}):`, e);
    }
  }
}

function showLeaderboardPromptIfNeeded(tier){
  if(isArchiveMode) return;
  if(!window.LetterLadderAuth) return;
  const savedUsername = localStorage.getItem('letterladder:accountUsername');

  // Belt-and-suspenders: check both localStorage AND Firebase auth state.
  // If either indicates a real account, submit under the real username.
  const currentUser = window.LetterLadderAuth.getCurrentUser();
  const isRealFirebaseUser = currentUser && !currentUser.isAnonymous;

  if(hasRealAccount() || isRealFirebaseUser){
    const username = savedUsername || (isRealFirebaseUser ? currentUser.displayName : null);
    if(username) submitCurrentScore(tier, username);
    else console.error(`[leaderboard] ${tier} ${dateKey}: not submitted - signed in but no username is known on this device`);
    return;
  }
  // Guests automatically play as guest and submit — no popup.
  window.LetterLadderAuth.playAsGuest().then(() => submitCurrentScore(tier, 'Guest'));
}

function markSolvedIfNeeded(tier, guesses){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:solvedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  localStorage.setItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintsAtSolve`, String(getHintsUsed(tier)));

  const hasEverStarted = localStorage.getItem(timerStartKey(tier)) !== null || localStorage.getItem(timerAccumulatedKey(tier)) !== null;
  if(hasEverStarted){
    localStorage.setItem(timerElapsedKey(tier), String(getCurrentElapsedMs(tier)));
  }

  // Pushed to the GTM data layer rather than called via gtag() directly -
  // gtag('event', ...) routes straight to GA4 and never passes through
  // GTM's own trigger system, so GTM has no way to see or act on it.
  // Guarded since ad blockers commonly block analytics scripts entirely -
  // that should never be able to break the actual game if dataLayer isn't
  // available for any reason.
  if(typeof dataLayer !== 'undefined'){
    const elapsedMs = localStorage.getItem(timerElapsedKey(tier));
    const timerChoice = getTimerChoice();
    dataLayer.push({
      event: 'puzzle_completed',
      player_id: getPlayerId(),
      tier: tier,
      puzzle_date: dateKey,
      hints_used: getHintsUsed(tier),
      guess_count: getTotalGuessCount(tier),
      timed_or_untimed: timerChoice,
      completion_time_seconds: (timerChoice === 'timed' && elapsedMs !== null) ? Math.round(Number(elapsedMs) / 1000) : null,
    });

    // Which specific word ended up in the player's own completed path at
    // each rung, using the final settled answer at the moment of
    // completion rather than every intermediate attempt (those are
    // separately covered by word_submitted above) - this fires exactly
    // once per rung per player (guarded by the same one-time flag as
    // puzzle_completed), so changing an answer back and forth only ever
    // counts as a single word for that position. Also flags whether that
    // word happens to match the creator's designated solution at this
    // rung, since a player's real path and the creator's path aren't
    // always the same word.
    const daySolution = (typeof HINTS_SCHEDULE !== 'undefined' && HINTS_SCHEDULE[dateKey] && HINTS_SCHEDULE[dateKey][tier])
      ? HINTS_SCHEDULE[dateKey][tier].solution : null;
    for(const len of Object.keys(guesses)){
      const creatorWordAtLength = daySolution ? daySolution.find(w => w.length === Number(len)) : null;
      dataLayer.push({
        event: 'word_used',
        player_id: getPlayerId(),
        tier: tier,
        puzzle_date: dateKey,
        rung_length: Number(len),
        word: guesses[len],
        is_player_solution_word: true,
        is_creator_solution_word: creatorWordAtLength === guesses[len],
      });
    }
  }

  function updateStatsForSolve(){
    if(hasRealAccount()){
      const stats = loadStats();
      const stat = stats[tier];
      stat.solved += 1;
      stats.total.solved += 1;
      bumpStreak(stat, dateKey);

      // If this solve completes all three tiers for today, bump the
      // total streak. Use isTierGenuinelyWon (not isTierComplete) so
      // solution-reveals and unscheduled tiers don't count.
      const allThreeScheduled = TIERS.every(t => getTodaysPuzzle(t) !== null);
      if(allThreeScheduled && TIERS.every(isTierGenuinelyWon)){
        bumpStreak(stats.total, dateKey);
      }

      saveStats(stats);
    }
  }
  if(statsPullPromise){
    statsPullPromise.then(updateStatsForSolve).catch(updateStatsForSolve);
  } else {
    updateStatsForSolve();
  }

  // Confetti for the 1st and 2nd puzzle completed today, whichever tiers
  // those happen to be - the 3rd (finishing all three) gets the bigger
  // ladder-climb celebration instead, not confetti.
  if(!TIERS.every(isTierComplete)){
    triggerTierWinConfetti();
  }

  if(getTimerChoice() === 'timed'){
    showLeaderboardPromptIfNeeded(tier);
  }

  scheduleShareModal(tier);

  scheduleDailyProgressSync(); // updates the timestamp if this genuinely changed anything
  clearTimeout(dailyProgressSyncTimeout);
  syncDailyProgressToCloud(); // then sync immediately rather than waiting on the debounce
}

function computeInitialUsedIndices(order, typedValue){
  // Best-effort reconstruction for a slot that already has a value when
  // opened (we don't know which specific tiles were originally tapped,
  // so this just claims the first N matching instances of each letter).
  const neededCounts = {};
  for(const ch of typedValue.toUpperCase()){
    neededCounts[ch] = (neededCounts[ch] || 0) + 1;
  }
  const consumedSoFar = {};
  const indices = [];
  order.forEach((letter, i) => {
    const upper = letter.toUpperCase();
    consumedSoFar[upper] = consumedSoFar[upper] || 0;
    if(neededCounts[upper] && consumedSoFar[upper] < neededCounts[upper]){
      indices.push(i);
      consumedSoFar[upper]++;
    }
  });
  return indices;
}

function setupBankTileDragging(){
  const bankTiles = document.getElementById('bank-tiles');
  if(!bankTiles) return;
  const HOLD_DELAY_MS = 120; // reduced from 180ms — activates drag sooner, shrinks the race window that caused stuck-pressed tiles
  const MOVE_CANCEL_THRESHOLD = 10; // px of movement before the hold timer fires that cancels the drag-intent (lets a quick swipe/scroll pass through untouched)

  bankTiles.querySelectorAll('.bank-tile').forEach(tile => {
    tile.addEventListener('pointerdown', (e)=>{
      if(tile.classList.contains('used')) return;
      if(!bankState[activeTier]) return;

      const startClientX = e.clientX;
      const startClientY = e.clientY;
      const rect = tile.getBoundingClientRect();
      const grabOffsetX = e.clientX - rect.left;
      // Fixed rather than exact touch-relative offset, so the dragged
      // tile consistently sits above the finger (not obscured by it)
      // regardless of exactly where within the tile it was grabbed.
      const grabOffsetY = rect.height * 1.5;
      let dragging = false;
      let holdTimeout = null;
      let pointerReleased = false; // guard: if finger lifted before hold timer, cancel drag

      // Preview-only state while dragging - the real bankState order
      // isn't touched until an actual drop. originalIndex is where the
      // dragged tile truly lives; previewGapIndex is where the empty
      // placeholder currently visually sits, which only matches
      // originalIndex until the pointer moves elsewhere within the bank.
      const originalIndex = Number(tile.dataset.index);
      let previewGapIndex = originalIndex;
      let otherTiles = [];
      let baselineRects = [];
      let placeholder = null;
      let bankTop = 0;

      function beginDrag(){
        if(pointerReleased) return; // finger lifted before hold timer fired — don't start a ghost drag
        dragging = true;
        tile.classList.add('dragging');
        tile.style.position = 'fixed';
        tile.style.left = `${rect.left}px`;
        tile.style.top = `${rect.top}px`;
        tile.style.width = `${rect.width}px`;
        tile.style.height = `${rect.height}px`;
        tile.style.margin = '0';

        otherTiles = [...bankTiles.querySelectorAll('.bank-tile')].filter(t => t !== tile);
        // Captured once, before any preview shifting happens - these stay
        // valid, stable reference points for the gap-index calculation
        // for the entire drag, regardless of whatever transforms get
        // applied to individual tiles later during the preview.
        baselineRects = otherTiles.map(t => t.getBoundingClientRect());
        bankTop = bankTiles.getBoundingClientRect().top;

        // Placeholder takes the dragged tile's exact spot in the flex
        // row - same size, faded, no letter - so nothing else shifts
        // the instant the drag begins, only once the pointer actually
        // moves somewhere new.
        placeholder = document.createElement('div');
        placeholder.className = 'bank-tile-placeholder';
        tile.parentNode.insertBefore(placeholder, tile);
      }

      // Moves the placeholder to sit right before otherTiles[gapIndex]
      // (or at the very end if gapIndex is past the last tile), then
      // FLIP-animates any other tile whose position actually changed
      // as a result - this is what makes the shift read as tiles
      // sliding aside to open a space, not a silent snap.
      function movePlaceholderTo(gapIndex){
        const beforeRects = new Map();
        otherTiles.forEach(t => beforeRects.set(t, t.getBoundingClientRect()));

        if(gapIndex >= otherTiles.length){
          bankTiles.appendChild(placeholder);
        } else {
          bankTiles.insertBefore(placeholder, otherTiles[gapIndex]);
        }

        otherTiles.forEach(t => {
          const before = beforeRects.get(t);
          const after = t.getBoundingClientRect();
          const dx = before.left - after.left;
          if(dx === 0) return;
          t.style.transition = 'none';
          t.style.transform = `translateX(${dx}px)`;
          requestAnimationFrame(() => {
            t.style.transition = 'transform 0.15s ease';
            t.style.transform = '';
          });
        });

        previewGapIndex = gapIndex;
      }

      function onMove(ev){
        if(!dragging){
          const dx = Math.abs(ev.clientX - startClientX);
          const dy = Math.abs(ev.clientY - startClientY);
          if(dx > MOVE_CANCEL_THRESHOLD || dy > MOVE_CANCEL_THRESHOLD){
            clearTimeout(holdTimeout);
          }
          return;
        }
        ev.preventDefault();
        tile.style.left = `${ev.clientX - grabOffsetX}px`;
        tile.style.top = `${ev.clientY - grabOffsetY}px`;

        // The dragged tile's own rendered center - not the raw finger/
        // cursor position - is what determines overlap from here on.
        // The tile sits offset above the finger (so it isn't obscured
        // by it), so using the finger's position directly would trigger
        // reordering before the tile itself visually reaches another
        // tile's spot.
        const tileCenterX = (ev.clientX - grabOffsetX) + rect.width / 2;
        const tileCenterY = (ev.clientY - grabOffsetY) + rect.height / 2;

        // Nothing moves at all while the dragged tile is still above the
        // letter bank - only once it actually reaches the top of the
        // tiles does a live preview begin.
        const withinBank = tileCenterY >= bankTop;
        let targetGapIndex;
        if(!withinBank){
          targetGapIndex = originalIndex;
        } else {
          // Group into rows by baseline top value - flex-wrap lays tiles
          // out in horizontal rows, so tiles sharing a row share the
          // same top. Comparing X-position needs to happen only within
          // whichever row the dragged tile is actually overlapping, not
          // across every row at once.
          const rowTops = [...new Set(baselineRects.map(r => r.top))].sort((a,b) => a - b);
          let targetRowTop = rowTops[0];
          let closestDist = Infinity;
          for(const top of rowTops){
            const dist = Math.abs(tileCenterY - (top + 24)); // compare against each row's vertical center
            if(dist < closestDist){ closestDist = dist; targetRowTop = top; }
          }

          const rowEntries = baselineRects
            .map((r, i) => ({ i, r }))
            .filter(entry => entry.r.top === targetRowTop);

          targetGapIndex = rowEntries.length ? rowEntries[rowEntries.length - 1].i + 1 : otherTiles.length;
          for(const entry of rowEntries){
            const midX = (entry.r.left + entry.r.right) / 2;
            if(tileCenterX < midX){ targetGapIndex = entry.i; break; }
          }
        }

        if(targetGapIndex !== previewGapIndex){
          movePlaceholderTo(targetGapIndex);
        }
      }

      function onUp(){
        pointerReleased = true;
        clearTimeout(holdTimeout);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if(dragging){
          // Only now, on an actual drop, does the real order/stableIds
          // data get touched - everything up to this point was purely
          // visual preview.
          if(previewGapIndex !== originalIndex){
            const order = bankState[activeTier].order;
            const stableIds = bankState[activeTier].stableIds;
            const remainingOrder = [...order];
            const [movedLetter] = remainingOrder.splice(originalIndex, 1);
            remainingOrder.splice(previewGapIndex, 0, movedLetter);
            const remainingIds = [...stableIds];
            const [movedId] = remainingIds.splice(originalIndex, 1);
            remainingIds.splice(previewGapIndex, 0, movedId);
            bankState[activeTier].order = remainingOrder;
            bankState[activeTier].stableIds = remainingIds;
          }

          if(placeholder && placeholder.parentNode) placeholder.remove();
          tile.classList.remove('dragging');
          tile.style.position = '';
          tile.style.left = '';
          tile.style.top = '';
          tile.style.width = '';
          tile.style.height = '';
          tile.style.margin = '';
          skipNextBankTap = true; // a real drag just completed — suppress the tap that pointerup also fires

          // Clean rebuild in the newly-committed order, rather than
          // trying to reconcile whatever ad-hoc DOM state the preview
          // left behind.
          render(false);
        }
      }

      holdTimeout = setTimeout(beginDrag, HOLD_DELAY_MS);
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}


function getBankWord(finalWord, guesses, steps, activeLength){
  // The bank shows whichever already-filled slot is the nearest one above
  // the active length - since every valid lower word's letters must be a
  // subset of every valid higher word's letters, that's always a valid
  // reference for building the current slot. Falls back to the final word
  // (the given, longest reference) if nothing above the active slot is
  // filled in yet.
  const above = steps.filter(L => L > activeLength && guesses[L]).sort((a,b)=>a-b);
  if(above.length > 0) return guesses[above[0]];
  return finalWord;
}

function getBelowWord(startingWord, guesses, steps, activeLength){
  // Mirror of getBankWord, looking downward instead of up: the letters in
  // whichever filled slot is the nearest one below the active length are
  // guaranteed to all reappear in the current guess too, so highlighting
  // them helps show what's already "locked in" versus what's genuinely
  // new territory. Falls back to the puzzle's given starting word if
  // nothing below the active slot has been filled in yet.
  const below = steps.filter(L => L < activeLength && guesses[L]).sort((a,b)=>b-a);
  if(below.length > 0) return guesses[below[0]];
  return startingWord;
}

function computeBelowMatchIndices(order, belowWord){
  // Greedily matches bank tiles (in whatever order they're currently
  // shown, shuffled or not) against the letter counts in belowWord, so
  // exactly the right number of tiles per letter get marked - e.g. if
  // belowWord has one "e" but the bank has two "e" tiles, only one of
  // them is marked as "from below," never both or neither.
  const remaining = {};
  for(const ch of belowWord){ remaining[ch] = (remaining[ch] || 0) + 1; }
  const matched = new Set();
  order.forEach((letter, i) => {
    if(remaining[letter] > 0){
      matched.add(i);
      remaining[letter]--;
    }
  });
  return matched;
}

function isTierComplete(tier){
  const puzzle = getTodaysPuzzle(tier);
  if(!puzzle) return true; // no puzzle scheduled for this tier today - don't block the celebration on it
  const steps = [];
  for(let L = puzzle.start.length+1; L < puzzle.final.length; L++) steps.push(L);
  const guesses = loadGuesses(tier);
  if(!steps.every(L => guesses[L])) return false;
  const { valid } = isValidChain(puzzle.start, guesses, puzzle.final);
  return valid;
}
function isTierGenuinelyWon(tier){
  // isTierComplete alone can't tell a real win apart from a tier that was
  // only filled in via "View solution" - this adds that distinction, for
  // anywhere that specifically needs to exclude revealed solutions (the
  // ladder-climb celebration, and the share text's win/not-played line).
  if(!isTierComplete(tier)) return false;
  return !localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:solutionRevealedAsLoss`);
}

function puzzleDayNumber(){

// The exact time-formatting logic used by the Share Results button -
// extracted into its own named function so it's the single, reusable
// source of truth. Other pages (leaderboard, stats) duplicate this exact
// same logic verbatim, since they're separate static HTML files with no
// shared JS module system to actually import a function across.
function formatDurationForShare(ms){
  const totalSeconds = ms / 1000;
  if(totalSeconds < 60){
    return `${totalSeconds.toFixed(1)}s`;
  } else if(totalSeconds < 3600){
    return `${Math.floor(totalSeconds / 60)}m ${Math.round(totalSeconds % 60)}s`;
  } else {
    const totalMinutes = Math.floor(totalSeconds / 60);
    return `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m ${Math.round(totalSeconds % 60)}s`;
  }
}

// Spoiler-free share text: date, one line per puzzle finished today (time
// if timed, hints used), streak for signed-in players, challenge, and a
// short clean link (the tracked link travels separately - see SHARE_URL).
const SHARE_LINK_TEXT = 'letterladder.io/s/'; // its page has no link-preview tags, so pastes stay a small link
// Short tracked link for native shares: s/index.html forwards to
// /?utm_source=share&utm_medium=social&utm_campaign=share_results.
const SHARE_URL = 'https://letterladder.io/s/';
function shareResultLines(){
  const tierLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const [y, m, d] = dateKey.split('-').map(Number);
  const dateLabel = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const lines = [`Letter Ladder — ${dateLabel}`];
  const timerChoice = getTimerChoice();
  let anyTime = false;
  for(const tier of TIERS){
    if(!getTodaysPuzzle(tier) || !(isTierGenuinelyWon(tier) || wasSolvedToday(tier))) continue; // only puzzles actually finished (incl. cleared for practice)
    let result = 'solved';
    if(timerChoice === 'timed'){
      const frozenElapsed = localStorage.getItem(timerElapsedKey(tier));
      if(frozenElapsed !== null){
        result = formatDurationForShare(Number(frozenElapsed));
        anyTime = true;
      }
    }
    const hints = hintsForShare(tier);
    const hintPart = hints > 0 ? ` (${hints} hint${hints === 1 ? '' : 's'})` : '';
    lines.push(`${tierLabels[tier]}: ${result}${hintPart}`);
  }
  if(hasRealAccount()){
    const total = loadStats().total;
    const live = total.lastSolvedDate === todayKey() || total.lastSolvedDate === dateKeyMinusOneDay(todayKey());
    const streak = live ? (total.currentStreak || 0) : 0;
    if(streak > 0) lines.push(`🔥 Streak: ${streak} day${streak === 1 ? '' : 's'}`);
  }
  lines.push(anyTime ? 'Can you beat my time?' : 'Can you solve it?');
  return lines;
}
// Text for Copy text / clipboard: ends with the clean link.
function buildShareText(){ return [...shareResultLines(), SHARE_LINK_TEXT].join('\n'); }

// Data for one finished puzzle's share card (modal and image).
function shareCardData(tier){
  const puzzle = getTodaysPuzzle(tier);
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const frozen = getTimerChoice() === 'timed' ? localStorage.getItem(timerElapsedKey(tier)) : null;
  const rungs = [];                                   // top (final, hidden) to bottom (start)
  rungs.push({ hidden: puzzle.final.length });
  for(let L = puzzle.final.length - 1; L > puzzle.start.length; L--) rungs.push({ checks: L });
  rungs.push({ word: puzzle.start.toUpperCase() });
  return {
    tierLabel: { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[tier],
    time: frozen !== null ? formatDurationForShare(Number(frozen)) : null,
    longDate: dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' }),
    rungs,
    maxLen: puzzle.final.length,
  };
}

// Draws the share card (Variant B: wordmark, result, ladder card, play bar)
// to a PNG, matching the modal. Returns a Blob.
async function buildShareCardImage(data){
  const fonts = ['900 31px Archivo', '800 16px Archivo', '700 15px Archivo', '700 29px "IBM Plex Mono"', '600 10px "IBM Plex Mono"'];
  try{ await Promise.all(fonts.map(f => document.fonts.load(f))); }catch(e){}
  const logo = await new Promise(resolve => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => resolve(null); img.src = 'og-image.png'; });
  const W = 344, PAD = 18, CARD_PAD = 15, GAP = 5;
  const innerW = W - PAD * 2;
  const tile = Math.max(12, Math.min(25, Math.floor((innerW - 2 - CARD_PAD * 2 - (data.maxLen - 1) * GAP) / data.maxLen)));
  const ladderH = data.rungs.length * tile + (data.rungs.length - 1) * GAP;
  const ladderW = data.maxLen * tile + (data.maxLen - 1) * GAP;     // widest row
  const cardTop = 22 + 62 + 14 + 29 + 7 + 18 + 16;                  // header + result block (pill, time, challenge)
  const cardH = 14 + ladderH + 13 + 48;
  const H = cardTop + cardH + 18;
  const scale = 3;
  const canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  // Panel
  ctx.fillStyle = '#24384F'; rr(0, 0, W, H, 24); ctx.fill();
  ctx.strokeStyle = 'rgba(245,239,224,0.14)'; ctx.lineWidth = 1; rr(0.5, 0.5, W - 1, H - 1, 24); ctx.stroke();
  // Wordmark row
  const logoX = PAD, logoY = 22 + 8;
  ctx.save(); ctx.beginPath(); ctx.arc(logoX + 23, logoY + 23, 23, 0, Math.PI * 2); ctx.fillStyle = '#1B2A41'; ctx.fill(); ctx.clip();
  if(logo) ctx.drawImage(logo, logoX, logoY, 46, 46);
  ctx.restore();
  ctx.beginPath(); ctx.arc(logoX + 23, logoY + 23, 22, 0, Math.PI * 2); ctx.strokeStyle = '#E8A33D'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#F5EFE0'; ctx.font = '900 31px Archivo, sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillText('LETTER', logoX + 58, 22 + 27);
  ctx.fillText('LADDER', logoX + 58, 22 + 57);
  // Result: pill + time
  let y = 22 + 62 + 14;
  ctx.font = '800 10.5px Archivo, sans-serif';
  const pillText = data.tierLabel.toUpperCase();
  const pillW = ctx.measureText(pillText).width + 18 + pillText.length * 1;
  ctx.font = '700 29px "IBM Plex Mono", monospace';
  const timeText = data.time || 'Solved';
  const timeW = ctx.measureText(timeText).width;
  const rowW = pillW + 10 + timeW;
  let x = (W - rowW) / 2;
  ctx.fillStyle = '#E8A33D'; rr(x, y + 6, pillW, 20, 10); ctx.fill();
  ctx.fillStyle = '#1B2A41'; ctx.font = '800 10.5px Archivo, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pillText, x + pillW / 2, y + 20);
  ctx.fillStyle = '#F5EFE0'; ctx.font = '700 29px "IBM Plex Mono", monospace'; ctx.textAlign = 'left'; ctx.fillText(timeText, x + pillW + 10, y + 26);
  // Challenge (amber emphasis)
  y += 29 + 7 + 14;
  const parts = data.time ? [['Can you beat ', '#F5EFE0'], ['my time', '#E8A33D'], ['?', '#F5EFE0']] : [['Can you ', '#F5EFE0'], ['solve it', '#E8A33D'], ['?', '#F5EFE0']];
  ctx.font = '700 15px Archivo, sans-serif';
  const cw = parts.reduce((w, [t]) => w + ctx.measureText(t).width, 0);
  x = (W - cw) / 2;
  for(const [t, c] of parts){ ctx.fillStyle = c; ctx.fillText(t, x, y); x += ctx.measureText(t).width; }
  // Card
  const cx = PAD, cy = cardTop, cwid = innerW;
  ctx.save(); rr(cx, cy, cwid, cardH, 16); ctx.clip();
  ctx.fillStyle = '#1B2A41'; ctx.fillRect(cx, cy, cwid, cardH);
  let ry = cy + 14;
  const ladderX = cx + (cwid - ladderW) / 2;                      // widest row centred; all rows start here
  data.rungs.forEach(r => {
    const cells = r.hidden ? Array(r.hidden).fill(['?', 'anchor']) : r.checks ? Array(r.checks).fill(['✓', 'filled']) : [...r.word].map(ch => [ch, 'anchor']);
    let tx = ladderX;
    for(const [ch, kind] of cells){
      ctx.fillStyle = kind === 'anchor' ? '#E8A33D' : '#F5EFE0'; rr(tx, ry, tile, tile, 6); ctx.fill();
      ctx.fillStyle = '#1B2A41'; ctx.textAlign = 'center';
      ctx.font = kind === 'anchor' ? `700 ${tile * 0.5}px "IBM Plex Mono", monospace` : `700 ${tile * 0.48}px Archivo, sans-serif`;
      ctx.fillText(ch, tx + tile / 2, ry + tile / 2 + tile * 0.17);
      tx += tile + GAP;
    }
    ry += tile + GAP;
  });
  const barY = cy + cardH - 48;
  ctx.fillStyle = '#E8A33D'; ctx.fillRect(cx, barY, cwid, 48);
  ctx.fillStyle = '#1B2A41'; ctx.font = '900 16.5px Archivo, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Play at letterladder.io →', cx + cwid / 2, barY + 30);
  ctx.restore();
  ctx.strokeStyle = 'rgba(245,239,224,0.14)'; ctx.lineWidth = 1; rr(cx + 0.5, cy + 0.5, cwid - 1, cardH - 1, 16); ctx.stroke();
  return await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
}

// Post-solve leaderboard placement for timed solves: "Completed in 30.1s —
// ranked #6 on today's Easy" (rank among today's visible leaderboard entries
// for that difficulty), with "View leaderboard" on the line below.
const leaderboardRankCache = {};
function fillLeaderboardRank(){
  const tier = activeTier;
  const frozen = localStorage.getItem(timerElapsedKey(tier));
  if(!document.getElementById('leaderboard-rank') || frozen === null) return;
  const myTime = Number(frozen);
  const key = `${dateKey}:${tier}`;
  const label = { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[tier];
  // The result goes on its own line; "View leaderboard" is always its own
  // line below (never a separator). The time shows right away and the rank
  // is added once the leaderboard query answers.
  function show(rank){
    const el = document.getElementById('leaderboard-rank-text');
    if(!el || activeTier !== tier) return;
    const timeHtml = `<span class="leaderboard-rank-time">${formatDurationForShare(myTime)}</span>`;
    el.innerHTML = rank
      ? `Completed in ${timeHtml} — ranked #${rank} on today's ${label}`
      : `Completed in ${timeHtml}`;
  }
  if(leaderboardRankCache[key]) return show(leaderboardRankCache[key]);
  show(null);
  const A = window.LetterLadderAuth;
  if(!A || !A.getDocs) return;
  A.getDocs(A.query(A.collection(A.db, 'leaderboardEntries'), A.where('date', '==', dateKey), A.where('tier', '==', tier), A.where('visible', '==', true)))
    .then(snap => {
      const me = A.getCurrentUser();
      const myUid = me ? me.uid : null;
      let faster = 0;
      snap.docs.forEach(d => { const r = d.data(); if(r.uid !== myUid && typeof r.timeMs === 'number' && r.timeMs < myTime) faster++; });
      leaderboardRankCache[key] = faster + 1;
      show(faster + 1);
    })
    .catch(() => {});
}

// "Missed a day?" link: count of puzzles from days before today.
function pastPuzzleCount(){
  const today = todayKey();
  return Object.keys(PUZZLE_SCHEDULE).filter(k => k < today).reduce((n, k) => n + Object.keys(PUZZLE_SCHEDULE[k]).length, 0);
}

async function buildShareImage(){
  // Builds a results-card PNG matching the game's own visual style, for
  // sharing to platforms like Instagram Stories that handle images far
  // better than plain text through the native share sheet.
  const tierLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const rows = [];
  for(const tier of TIERS){
    const puzzle = getTodaysPuzzle(tier);
    if(!puzzle) continue;
    if(isTierGenuinelyWon(tier)){
      const hints = getHintsUsed(tier);
      rows.push({ label: tierLabels[tier], status: hints > 0 ? '💡'.repeat(hints) : '✔', solved: true });
    } else {
      rows.push({ label: tierLabels[tier], status: '—', solved: false });
    }
  }

  const W = 1080, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background gradient matching the game's own body background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#24384F');
  grad.addColorStop(0.55, '#1B2A41');
  grad.addColorStop(1, '#142132');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#F5EFE0';
  ctx.font = "700 68px Georgia, serif";
  ctx.fillText(`Letter Ladder #${puzzleDayNumber()} 🪜`, W/2, 170);

  ctx.fillStyle = '#9FB3C8';
  ctx.font = "400 38px Arial, sans-serif";
  ctx.fillText("Can you climb it?", W/2, 232);

  // Per-tier result rows, styled as bold, high-contrast cards - solid
  // amber fill for solved tiers (not a faint tint), a clearly visible
  // outlined box for unsolved ones, so this still reads clearly even at
  // the small thumbnail size most share sheets and chat apps show it at.
  let y = 330;
  const cardW = 820, cardH = 140, cardX = (W - cardW) / 2, cardGap = 26;
  for(const row of rows){
    ctx.beginPath();
    ctx.roundRect(cardX, y, cardW, cardH, 24);
    if(row.solved){
      ctx.fillStyle = '#E8A33D';
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    const textColor = row.solved ? '#1B2A41' : '#F5EFE0';
    ctx.textAlign = 'left';
    ctx.fillStyle = textColor;
    ctx.font = "700 52px Arial, sans-serif";
    ctx.fillText(row.label, cardX + 40, y + 90);

    ctx.textAlign = 'right';
    ctx.font = "700 52px Arial, sans-serif";
    ctx.fillStyle = row.solved ? textColor : '#9FB3C8';
    ctx.fillText(row.status, cardX + cardW - 40, y + 90);

    y += cardH + cardGap;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9FB3C8';
  ctx.font = "400 34px Arial, sans-serif";
  ctx.fillText(SITE_URL.replace('https://', ''), W/2, y + 30);

  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), 'image/png');
  });
}

function spawnConfetti(pieceCount){
  const colors = ['#E8A33D', '#6FBF8B', '#F5EFE0', '#D9705F'];
  for(let i=0; i<pieceCount; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    // Each piece falls for 2.9-4.5s (0.7s longer than the original
    // 2.2-3.8s), starting within the first 0.4s.
    const duration = 2.9 + Math.random()*1.6, delay = Math.random()*0.4;
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = delay + 's';
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 4900); // longest fall (4.5s) + delay (0.4s)
  }
}

function triggerTierWinConfetti(){
  // A lighter burst for the 1st and 2nd puzzle completed each day - the
  // 3rd (finishing all three) gets the bigger ladder-climb celebration
  // below instead, not confetti.
  spawnConfetti(70); // was 35 - a fuller celebration
}

function showSummitBanner(){
  const banner = document.createElement('div');
  banner.className = 'summit-banner';
  const streak = loadStats().total.currentStreak || 0;
  const streakLine = streak > 0 ? `<br>🔥 ${streak} day streak!` : '';
  banner.innerHTML = `Well done! You&#39;ve completed all three of today&#39;s ladders!${streakLine}`;
  document.body.appendChild(banner);

}

function triggerLadderClimbCelebration(finalWord){
  // Once all three tiers are done for the day: the letters of the final
  // word walk out of their box (with a bouncy little walk) and climb a
  // ladder that appears on the right side of the screen, disappearing
  // off the top - no confetti for this one, since it's the bigger
  // moment. The real box empties out letter by letter in sync with each
  // one leaving (not a separate effect happening elsewhere), and the
  // full word reappears in the box a short pause after they've all
  // exited, right before the usual winning banner shows.
  const anchorEl = document.getElementById('final-word-rung');
  if(!anchorEl){ if(!isArchiveMode) showSummitBanner(); return; } // safety fallback (no share modal wait)
  ladderCelebrationActive = true;

  const rect = anchorEl.getBoundingClientRect();
  const originalText = anchorEl.textContent;

  const letters = finalWord.toUpperCase().split('');
  anchorEl.innerHTML = letters.map((ch, i) => `<span class="anchor-letter" data-anchor-index="${i}">${ch}</span>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'ladder-climb-overlay';

  const ladder = document.createElement('div');
  ladder.className = 'climb-ladder';
  // The ladder's base sits at the same height as the letters' starting
  // position (the final-word box), extending only upward off the top of
  // the screen from there - not spanning the full viewport - so it
  // visually reads as "walk to the ladder's base, then climb up."
  ladder.style.top = '-20px';
  ladder.style.bottom = `${window.innerHeight - rect.top}px`;
  overlay.appendChild(ladder);

  // The ladder itself (right: 6vw, 46px wide, with 5px rails on each
  // side) - climbing targets are spread across its interior width
  // (between the rails) rather than every letter aiming for one exact
  // spot, so they visibly use more of the ladder rather than stacking
  // on its right rail.
  const ladderRight = window.innerWidth - (window.innerWidth * 0.06);
  const ladderInnerLeft = ladderRight - 46 + 9;
  const ladderInnerWidth = 46 - 18;

  letters.forEach((letter, i) => {
    const el = document.createElement('div');
    el.className = 'climb-letter';
    el.textContent = letter;
    const letterStartX = rect.left + (i * (rect.width / letters.length));
    // Cycles across a few spots within the ladder's interior (left,
    // middle, right, repeat) - and subtracts half the letter's own
    // width (15px) since CSS "left" positions the left edge, not the
    // center, so without this the letter visually lands off-center.
    const targetCenterX = ladderInnerLeft + ladderInnerWidth * ((i % 3) / 2);
    el.style.setProperty('--start-x', `${letterStartX}px`);
    el.style.setProperty('--start-y', `${rect.top}px`);
    el.style.setProperty('--ladder-x', `${targetCenterX - 15}px`);
    const delayMs = i * 390;
    el.style.animationDelay = `${delayMs / 1000}s`;
    overlay.appendChild(el);

    // Hide this letter's spot in the real box at the same moment its
    // climbing counterpart starts walking out.
    setTimeout(() => {
      const anchorLetterEl = anchorEl.querySelector(`[data-anchor-index="${i}"]`);
      if(anchorLetterEl) anchorLetterEl.style.opacity = '0';
    }, delayMs);
  });

  document.body.appendChild(overlay);

  const exitDuration = 3060 + (letters.length - 1) * 390 + 180; // animation length + staggered delays + small buffer
  const pauseAfterExit = 1050; // a beat with the box sitting empty, before the word returns
  setTimeout(()=>{
    overlay.remove();
    anchorEl.textContent = originalText;
    ladderCelebrationActive = false;
    if(isArchiveMode) return;
    // If the share modal is open, the banner shows once it is closed.
    if(document.querySelector('.sm-scrim')) summitBannerAfterModal = () => showSummitBanner();
    else showSummitBanner();
  }, exitDuration + pauseAfterExit);
}

function checkAndCelebrateIfAllComplete(finalWord){
  if(!TIERS.every(isTierGenuinelyWon)) return;
  const flagKey = `letterladder:${accountScope}:${dateKey}:summitShown`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  // Deferred: this render() call is still mid-flight and about to
  // reassign panel.innerHTML with a fresh copy of the final-word box -
  // triggering immediately would mean modifying a DOM element that's
  // seconds away from being wiped out and replaced. Waiting a tick lets
  // render() finish first, so this operates on the box that's actually
  // visible on the page.
  setTimeout(() => triggerLadderClimbCelebration(finalWord), 0);
}

function render(focusInput = false, pendingErrors = null){
  let nextTierForButton = null;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tier === activeTier);
  });

  // Capture whatever is currently typed (but not yet submitted) in the
  // active input before the panel gets rebuilt below - otherwise actions
  // like shuffle, which re-render without changing what's being typed,
  // would wipe out in-progress typing since a fresh input element only
  // ever starts from the last *committed* guess.
  let preservedLiveValue = null;
  if(activeLength != null){
    const existingInput = document.getElementById(`rung-input-${activeLength}`);
    if(existingInput) preservedLiveValue = existingInput.value;
  }

  const puzzle = getTodaysPuzzle(activeTier);
  if(!puzzle){
    panel.className = 'panel';
    panel.innerHTML = `<div class="empty-state">No ${activeTier} puzzle scheduled for today yet — check back soon!</div>`;
    return;
  }

  const startingWord = puzzle.start;
  const finalWord = puzzle.final;
  const steps = [];
  for(let L = startingWord.length+1; L < finalWord.length; L++) steps.push(L);

  const guesses = loadGuesses(activeTier);
  const allFilled = steps.every(L => guesses[L]);
  let feedback = '';
  let feedbackClass = '';

  const revealedLossKey = `letterladder:${accountScope}:${dateKey}:${activeTier}:solutionRevealedAsLoss`;
  const isRevealedLoss = !!localStorage.getItem(revealedLossKey);

  if(isRevealedLoss){
    feedback = '';
    feedbackClass = 'revealed';
    nextTierForButton = { easy: 'medium', medium: 'hard' }[activeTier] || null;
  } else if(allFilled){
    // Guarantee "played" is always counted before "solved" ever can be -
    // this covers puzzles that were already fully filled in from before
    // stats tracking existed, which would otherwise count as solved
    // without ever having been marked as played.
    markPlayedIfNeeded(activeTier);
    const { valid, invalidSteps } = isValidChain(startingWord, guesses, finalWord);
    if(valid){
      const nextTierForLink = { easy: 'medium', medium: 'hard' }[activeTier];
      if(nextTierForLink){
        nextTierForButton = nextTierForLink;
      }
      feedback = '';
      feedbackClass = 'win';
      markSolvedIfNeeded(activeTier, guesses);
      checkAndCelebrateIfAllComplete(finalWord);

      // Archive-mode celebrations - confetti for 1st and 2nd puzzle won,
      // ladder climb when all 3 are genuinely won (same rules as daily).
      // Each gated by a one-time flag so they fire exactly once per tier
      // per archive date, not on every subsequent re-render.
      if(isArchiveMode){
        const archiveConfettiKey = `letterladder:${accountScope}:${dateKey}:${activeTier}:archiveConfettiShown`;
        if(!localStorage.getItem(archiveConfettiKey)){
          localStorage.setItem(archiveConfettiKey, '1');
          if(!TIERS.every(isTierComplete)){
            triggerTierWinConfetti();
          } else if(TIERS.every(isTierGenuinelyWon)){
            const archiveSummitKey = `letterladder:${accountScope}:${dateKey}:summitShown`;
            if(!localStorage.getItem(archiveSummitKey)){
              localStorage.setItem(archiveSummitKey, '1');
              setTimeout(() => triggerLadderClimbCelebration(finalWord), 0);
            }
          }
        }
      }
    } else {
      // One message, same style as the guess errors; if several steps are
      // broken, the first (lowest) is shown - fixing it reveals the next.
      const s = invalidSteps[0];
      const reason = s.reason === 'missing_letters'
        ? `"${s.to.toUpperCase()}" is missing the "${s.letters.length === 1 ? s.letters[0].toUpperCase() : joinAnd(s.letters.map(l => l.toUpperCase()))}" from "${s.from.toUpperCase()}"`
        : `"${s.from.toUpperCase()}" → "${s.to.toUpperCase()}" isn't a valid one-letter step`;
      feedback = `<div class="error-list-wrap"><ul class="error-list"><li>Invalid progression — ${reason}</li></ul></div>`;
      feedbackClass = 'error';
    }
  }

  const isWon = feedbackClass === 'win';
  // Distinct from isWon: this covers both a genuine win AND a puzzle
  // filled in via View Solution, since some UI decisions (hiding the hint
  // button, showing the "clear to find a new path" prompt) should apply
  // either way - there's nothing left to hint at or discover once every
  // rung is filled in, regardless of how it got that way.
  const isMechanicallyComplete = isTierComplete(activeTier);
  // Editing after a win is allowed (clicking a rung + its delete-X reopens
  // it), so activeLength is no longer force-reset just because isWon is
  // true - only the actual guess-acceptance/delete logic controls it now.
  // The same applies after a revealed-loss: someone might still want to
  // keep exploring for a different valid path, even though the loss
  // itself is already permanently locked in for today's stats.

  if(activeLength === null && !isWon){
    // Always have a target box selected (without auto-focusing/opening
    // the keyboard) so the letter bank is ready to use immediately,
    // instead of requiring an initial tap into a box first. Points to the
    // highest unfilled box, not the lowest.
    const lastIncomplete = [...steps].reverse().find(L => !guesses[L]);
    if(lastIncomplete !== undefined) activeLength = lastIncomplete;
  }

  let feedbackHtml = feedback;
  let feedbackClassFinal = feedbackClass;
  if(pendingErrors){
    feedbackHtml = `<div class="error-list-wrap"><ul class="error-list">${pendingErrors.map(e => `<li>${e}</li>`).join('')}</ul></div>`;
    feedbackClassFinal = 'error';
    lastFeedback[activeTier] = { html: feedbackHtml, className: feedbackClassFinal };
  } else if(feedback !== ''){
    // A fresh win or invalid-chain result naturally takes priority and
    // supersedes any older single-guess error.
    lastFeedback[activeTier] = null;
  } else if(lastFeedback[activeTier]){
    // Nothing new to show this render (e.g. we're just opening a
    // different box to type the next guess) - keep showing whatever was
    // last displayed instead of letting it silently vanish.
    feedbackHtml = lastFeedback[activeTier].html;
    feedbackClassFinal = lastFeedback[activeTier].className;
  }

  const maxWordLen = finalWord.length; // always the longest word in the puzzle

  const totalRungs = steps.length + 2;
  let sizeTier = '';
  if(totalRungs >= 9) sizeTier = 'rungs-xl';
  else if(totalRungs >= 7) sizeTier = 'rungs-lg';
  else if(totalRungs >= 5) sizeTier = 'rungs-md';

  // Same font-size/min-width numbers as the CSS tiers below, mirrored here
  // in plain JS so the box width can be a flat pixel number - no calc()/
  // var()/max() for the browser to resolve, which is what kept going wrong.
  const TIER_CONFIG = {
    '':         { fontPx: 21.6, minWidthPx: 165 },
    'rungs-md': { fontPx: 18.4, minWidthPx: 115 },
    'rungs-lg': { fontPx: 16,   minWidthPx: 100 },
    'rungs-xl': { fontPx: 14.4, minWidthPx: 88  },
  };
  const tierCfg = TIER_CONFIG[sizeTier];
  const letterSpacingPx = tierCfg.fontPx * 0.14; // matches the CSS letter-spacing
  const computedWidthPx = Math.round(Math.max(
    tierCfg.minWidthPx,
    maxWordLen * tierCfg.fontPx * 0.6 + (maxWordLen - 1) * letterSpacingPx + tierCfg.fontPx * 3.4
  ));

  function rungBoxStyle(L){
    // ONE flat pixel width for every rung in this puzzle (based on the
    // longest word). A short word just naturally occupies less of the
    // box, centered, while the longest word fills it edge to edge -
    // that's what gives the pyramid effect, not stretched-out text.
    return `width:${computedWidthPx}px; max-width:${computedWidthPx}px; min-width:0;`;
  }

  const rungsHtml = [];
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${finalWord.length}</div><div class="rung anchor" id="final-word-rung" style="${rungBoxStyle(finalWord.length)}">${finalWord}</div></div>`);
  for(let i = steps.length-1; i>=0; i--){
    const L = steps[i];
    const g = guesses[L];
    if(activeLength === L){
      // Only show the delete option here if this specific box already had
      // a guess in it when it was opened (i.e. you clicked in to replace
      // or remove an existing entry) - not for a box you're filling in
      // for the first time.

      rungsHtml.push(`<div class="rung-row"><div class="rung-count">${L}</div><input type="text" class="rung rung-input" id="rung-input-${L}" data-length="${L}" maxlength="${L}" size="${maxWordLen}" value="${inputValue}" style="${rungBoxStyle(L)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" inputmode="${keyboardEnabled ? 'text' : 'none'}" ${keyboardEnabled ? '' : 'readonly'}>${deleteBtn}</div>`);
