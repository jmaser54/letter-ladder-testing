<title>Delete Account — Letter Ladder</title>

<style>
  :root{
    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D;
  }
  body{
    margin:0; padding: 32px 16px 80px;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink); font-family:'Inter',system-ui,sans-serif;
  }
  .wrap{ max-width: 460px; margin:0 auto; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin-bottom:4px; }
  a{ color: var(--amber); }
  .back{ display:inline-block; margin-bottom: 22px; color: var(--ink-dim); text-decoration:none; touch-action: manipulation; }
  .back:hover{ color: var(--amber); }

  .delete-card{ background: var(--bg-panel); border-radius:18px; padding: 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .warning-text{ margin-bottom: 20px; }
  .form-message{ font-size: 0.85rem; margin-bottom: 14px; min-height: 1.1em; }
  .form-message.is-error{ color: #E27272; }

  .btn-danger{
    border:none; border-radius:10px; padding:10px 18px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.9rem;
    background: #C24545; color: #F5EFE0; touch-action: manipulation; width: 100%;
  }
  .btn-ghost{
    border:none; border-radius:10px; padding:10px 18px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.9rem;
    background: rgba(245,239,224,0.08); color: var(--ink); touch-action: manipulation;
  }
  .confirm-actions{ display:flex; gap:10px; margin-top: 14px; }
  .confirm-actions button{ flex:1; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 40px 20px; background: var(--bg-panel); border-radius:18px; }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K8X9ZNZP"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="wrap">
  <a class="back" href="index.html">← Back to game</a>
  <h1>Delete Account</h1>
  <div id="delete-content">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const contentEl = document.getElementById('delete-content');

  function renderInitial(user){
    contentEl.innerHTML = `
      <div class="delete-card">
        <div class="warning-text">Permanently delete your account and associated account data? This action cannot be undone.</div>
        <div class="form-message" id="delete-message"></div>
        <button type="button" class="btn-danger" id="delete-account-btn">Delete account</button>
      </div>
    `;
    document.getElementById('delete-account-btn').addEventListener('click', () => renderConfirm(user));
  }

  function renderConfirm(user){
    contentEl.innerHTML = `
      <div class="delete-card">
        <div class="warning-text">Are you sure? This will permanently delete your account and associated data.</div>
        <div class="confirm-actions">
          <button type="button" class="btn-danger" id="confirm-yes-btn">Yes</button>
          <button type="button" class="btn-ghost" id="confirm-no-btn">No</button>
        </div>
      </div>
    `;
    document.getElementById('confirm-no-btn').addEventListener('click', () => renderInitial(user));
    document.getElementById('confirm-yes-btn').addEventListener('click', async () => {
      const yesBtn = document.getElementById('confirm-yes-btn');
      yesBtn.disabled = true;
      try{
        // Removes the account's profile data (username, email, join date)
        // and the actual Firebase account itself. Past leaderboard scores
        // are historical game records rather than account data, so they
        // intentionally aren't touched here.
        await deleteDoc(doc(db, 'players', user.uid));
        await deleteUser(user);
        localStorage.removeItem('letterladder:accountUsername');
        window.location.href = 'index.html';
      }catch(err){
        renderInitial(user);
        document.getElementById('delete-message').classList.add('is-error');
        document.getElementById('delete-message').textContent = 'Please log out and back in, then try again right after logging in.';
      }
    });
  }

  onAuthStateChanged(auth, (user) => {
    if(!user || user.isAnonymous){
      contentEl.innerHTML = `<div class="empty-state">You're not signed into an account.</div>`;
      return;
    }
    renderInitial(user);
  });
</script>
</body>
</html>
