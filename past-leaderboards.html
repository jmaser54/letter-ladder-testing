<style>
  :root{
    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D; --green:#6FBF8B;
  }
  body{
    margin:0; padding: 32px 16px 80px;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink); font-family:'Inter',system-ui,sans-serif;
  }
  .wrap{ max-width: 560px; margin:0 auto; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin-bottom:4px; }
  a{ color: var(--amber); }
  .back{ display:inline-block; margin-bottom: 22px; color: var(--ink-dim); text-decoration:none; touch-action: manipulation; }
  .back:hover{ color: var(--amber); }
  .intro{ color: var(--ink-dim); margin-bottom: 24px; }

  .day-card{
    background: var(--bg-panel); border-radius:18px; padding: 20px 22px; margin-bottom:18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .day-date{ font-family:'Fraunces',serif; font-weight:700; font-size:1.2rem; margin-bottom:14px; }
  .tier-row{ margin-bottom: 14px; }
  .tier-row:last-child{ margin-bottom: 0; }
  .tier-label{ font-size:0.83rem; text-transform:uppercase; letter-spacing:0.1em; color: var(--amber); font-weight:700; margin-bottom:6px; }
  .score-row{ display:flex; align-items:center; gap:10px; padding: 3px 0; font-size:1.06rem; }
  .score-rank{ font-family:'Fraunces',serif; font-weight:700; color: var(--amber); width: 1.2em; flex-shrink:0; }
  .score-name{ flex:1; font-weight:600; word-break: break-word; }
  .score-hints{ font-size: 0.92rem; }
  .score-time{ font-family:'Fraunces',serif; font-weight:700; font-variant-numeric: tabular-nums; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 40px 20px; background: var(--bg-panel); border-radius:18px; }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K8X9ZNZP"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="wrap">
  <a class="back" href="leaderboard.html">← Back to leaderboard</a>
  <h1>Past Leaderboards</h1>
  <div id="past-leaderboards-list">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  function todayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function prettyDate(key){
    const [y,m,d] = key.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  }
  // The exact time-formatting logic used by index.html's Share Results
  // button, duplicated verbatim here since this is a separate static
  // HTML file with no shared JS module system to import it from directly.
  function formatTime(ms){
    const totalSeconds = ms / 1000;
    if(totalSeconds < 60){
      return `${totalSeconds.toFixed(1)}s`;
    } else if(totalSeconds < 3600){
      return `${Math.floor(totalSeconds / 60)}m ${Math.round(totalSeconds % 60)}s`;
    } else {
      const totalMinutes = Math.floor(totalSeconds / 60);
      return `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m ${Math.round(totalSeconds % 60)}s`;
    }
  }

  const tierNames = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const tierOrder = { easy: 0, medium: 1, hard: 2 };

  async function loadPastLeaderboards(){
    const container = document.getElementById('past-leaderboards-list');
    const today = todayKey();

    try{
      // No per-date index exists to query against directly, so this pulls
      // every score once and groups it client-side by date and tier -
      // completely reasonable at this stage's scale, and means dates
      // with zero recorded scores simply never appear at all, rather
      // than padding the page out with empty placeholders.
      const q = query(collection(db, 'scores'), orderBy('date', 'desc'), limit(1000));
      const snap = await getDocs(q);
      console.log('DIAG past-leaderboards: scores collection returned', snap.docs.length, 'total documents');
      snap.docs.forEach(d => console.log('DIAG score doc:', d.id, JSON.stringify(d.data())));

      const byDate = {};
      snap.docs.forEach(docSnap => {
        const row = docSnap.data();
        if(row.date === today) return; // today's own scores live on the main leaderboard page, not here
        if(!byDate[row.date]) byDate[row.date] = { easy: [], medium: [], hard: [] };
        if(byDate[row.date][row.tier]) byDate[row.date][row.tier].push(row);
      });

      const pastDates = Object.keys(byDate).sort().reverse();

      if(pastDates.length === 0){
        container.innerHTML = `<div class="empty-state">No past leaderboards yet - check back after today's scores come in!</div>`;
        return;
      }

      container.innerHTML = pastDates.map(dateKey => {
        const dayData = byDate[dateKey];
        const tierSections = Object.keys(dayData)
          .sort((a,b) => tierOrder[a] - tierOrder[b])
          .filter(tier => dayData[tier].length > 0)
          .map(tier => {
            const topThree = dayData[tier].sort((a,b) => a.timeMs - b.timeMs).slice(0,3);
            const rows = topThree.map((row, i) => `
              <div class="score-row">
                <div class="score-rank">${i+1}</div>
                <div class="score-name">${row.displayName || 'Guest'}</div>
                <div class="score-hints">${'💡'.repeat(row.hintsUsed || 0)}</div>
                <div class="score-time">${formatTime(row.timeMs)}</div>
              </div>
            `).join('');
            return `
              <div class="tier-row">
                <div class="tier-label">${tierNames[tier]}</div>
                ${rows}
              </div>
            `;
          }).join('');
        return `
          <div class="day-card" id="day-${dateKey}">
            <div class="day-date">${prettyDate(dateKey)}</div>
            ${tierSections}
          </div>
        `;
      }).join('');

      // The browser's native URL-fragment scroll only fires once, at
      // initial page load - long before this async content exists in
      // the DOM. It doesn't retry once a matching element does show up,
      // so this scroll has to be done manually here instead.
      if(window.location.hash){
        const target = document.getElementById(window.location.hash.slice(1));
        if(target) target.scrollIntoView({ block: 'start' });
      }
    }catch(e){
      console.error('Past leaderboards failed to load:', e);
      container.innerHTML = `<div class="empty-state">Couldn't load past leaderboards right now - try refreshing.</div>`;
    }
  }

  loadPastLeaderboards();
</script>
</body>
</html>
