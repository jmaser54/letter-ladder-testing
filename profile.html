<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<meta http-equiv="Expires" content="0">
<title>Profile — Letter Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D;
  }
  body{
    margin:0; padding: 32px 16px 80px;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink); font-family:'Inter',system-ui,sans-serif;
  }
  .wrap{ max-width: 460px; margin:0 auto; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin-bottom:4px; }
  a{ color: var(--amber); }
  .back{ display:inline-block; margin-bottom: 22px; color: var(--ink-dim); text-decoration:none; touch-action: manipulation; }
  .back:hover{ color: var(--amber); }

  .profile-card{ background: var(--bg-panel); border-radius:18px; padding: 22px; margin-bottom:18px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .profile-row{ padding: 10px 0; border-bottom: 1px solid rgba(245,239,224,0.08); }
  .profile-row:last-child{ border-bottom:none; }
  .profile-label{ font-size:0.72rem; color: var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
  .profile-value{ font-family:'Fraunces',serif; font-weight:700; font-size:1.15rem; }

  .password-title{ font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem; margin-bottom:10px; }
  .form-field{
    display:block; width:100%; box-sizing:border-box; margin-bottom:10px;
    padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(245,239,224,0.15);
    background: rgba(245,239,224,0.06); color: var(--ink); font-size: 0.95rem;
  }
  .form-message{ font-size: 0.82rem; margin-bottom: 10px; min-height: 1.1em; }
  .form-message.is-error{ color: #E27272; }
  .form-message.is-success{ color: #6FBF8B; }
  .form-hint{ color: var(--ink-dim); font-size: 0.76rem; margin: -6px 0 12px 0; }
  .btn-primary{
    border:none; border-radius:10px; padding:10px 18px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.9rem;
    background: var(--amber); color:#1B2A41; touch-action: manipulation;
  }
  .btn-ghost{
    border:none; border-radius:10px; padding:10px 18px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.9rem;
    background: rgba(245,239,224,0.08); color: var(--ink); touch-action: manipulation;
  }
  .empty-state{ text-align:center; color: var(--ink-dim); padding: 40px 20px; background: var(--bg-panel); border-radius:18px; }
  .page-footer{ text-align:center; margin-top: 8px; color: var(--ink-dim); font-size: 0.85rem; }
  .page-footer a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); touch-action: manipulation; }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K8X9ZNZP"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="wrap">
  <a class="back" href="index.html">← Back to game</a>
  <h1>Profile</h1>
  <div id="profile-content">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, updatePassword, updateEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function formatJoinDate(timestampMs){
    const d = new Date(timestampMs);
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  const contentEl = document.getElementById('profile-content');

  onAuthStateChanged(auth, async (user) => {
    if(!user || user.isAnonymous){
      contentEl.innerHTML = `<div class="empty-state">You're not signed into an account yet. <a href="index.html">Go back and create one</a> to see your profile.</div>`;
      return;
    }

    const username = localStorage.getItem('letterladder:accountUsername') || '(unknown)';
    let joinDateText = '—';
    let existingEmail = '';
    try{
      const snap = await getDoc(doc(db, 'players', user.uid));
      if(snap.exists()){
        if(snap.data().createdAt) joinDateText = formatJoinDate(snap.data().createdAt);
        if(snap.data().recoveryEmail) existingEmail = snap.data().recoveryEmail;
      }
    }catch(e){}

    contentEl.innerHTML = `
      <div class="profile-card">
        <div class="profile-row">
          <div class="profile-label">Username</div>
          <div class="profile-value">${username}</div>
        </div>
        <div class="profile-row">
          <div class="profile-label">Account created</div>
          <div class="profile-value">${joinDateText}</div>
        </div>
      </div>
      <div class="profile-card">
        <div class="password-title">Change password</div>
        <div class="form-message" id="pw-message"></div>
        <input type="password" class="form-field" id="new-password-field" placeholder="New password" autocomplete="new-password">
        <input type="email" class="form-field" id="recovery-email-field" placeholder="Email (optional)" autocomplete="email" value="${existingEmail}">
        <div class="form-hint">Your email will only be used for password recovery purposes.</div>
        <button type="button" class="btn-primary" id="update-account-btn">Update</button>
      </div>
      <div class="profile-card">
        <button type="button" class="btn-ghost" id="logout-btn" style="width:100%;">Log out</button>
      </div>
      <div class="page-footer">
        <a href="delete-account.html">Delete Account</a>
      </div>
    `;

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await signOut(auth);
      localStorage.removeItem('letterladder:accountUsername');

      // Reset everything that gates the first-visit experience, so
      // logging out genuinely feels like a brand-new visit - not just a
      // return to whatever guest state already existed on this device.
      localStorage.removeItem('letterladder:howToPlaySeen');
      localStorage.removeItem('letterladder:timerChoiceMade');
      localStorage.removeItem('letterladder:timerChoice');
      localStorage.removeItem('letterladder:activeTier');
      localStorage.removeItem('letterladder:lastViewedDateKey');
      const guestPrefix = 'letterladder:guest:';
      const guestKeysToRemove = [];
      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(key && key.startsWith(guestPrefix)) guestKeysToRemove.push(key);
      }
      guestKeysToRemove.forEach(key => localStorage.removeItem(key));

      window.location.href = 'index.html';
    });

    document.getElementById('update-account-btn').addEventListener('click', async () => {
      const messageEl = document.getElementById('pw-message');
      const newPassword = document.getElementById('new-password-field').value;
      const newEmail = document.getElementById('recovery-email-field').value.trim();
      messageEl.textContent = '';
      messageEl.className = 'form-message';

      if(!newPassword && newEmail === existingEmail){
        messageEl.classList.add('is-error');
        messageEl.textContent = 'Nothing to update yet.';
        return;
      }
      if(newPassword && newPassword.length < 6){
        messageEl.classList.add('is-error');
        messageEl.textContent = 'Password should be at least 6 characters.';
        return;
      }

      const updates = [];
      try{
        if(newPassword){
          await updatePassword(user, newPassword);
          updates.push('password');
        }
        if(newEmail && newEmail !== existingEmail){
          // Actually re-registers the real Firebase account under this
          // email (not just a stored label) - this is what's required
          // for a future password-reset email to have a real inbox to
          // reach, matching how account creation itself handles email.
          await updateEmail(user, newEmail);
          await setDoc(doc(db, 'players', user.uid), { recoveryEmail: newEmail }, { merge: true });
          existingEmail = newEmail;
          updates.push('email');
        }
        messageEl.classList.add('is-success');
        messageEl.textContent = updates.length ? `Updated: ${updates.join(' and ')}.` : '';
        document.getElementById('new-password-field').value = '';
      }catch(err){
        messageEl.classList.add('is-error');
        messageEl.textContent = 'Please log out and back in, then try again right after logging in.';
      }
    });
  });
</script>
</body>
</html>
