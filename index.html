function computeInitialUsedIndices(order, typedValue){
  // Best-effort reconstruction for a slot that already has a value when
  // opened (we don't know which specific tiles were originally tapped,
  // so this just claims the first N matching instances of each letter).
  const neededCounts = {};
  for(const ch of typedValue.toUpperCase()){
    neededCounts[ch] = (neededCounts[ch] || 0) + 1;
  }
  const consumedSoFar = {};
  const indices = [];
  order.forEach((letter, i) => {
    const upper = letter.toUpperCase();
    consumedSoFar[upper] = consumedSoFar[upper] || 0;
    if(neededCounts[upper] && consumedSoFar[upper] < neededCounts[upper]){
      indices.push(i);
      consumedSoFar[upper]++;
    }
  });
  return indices;
}

function setupBankTileDragging(){
  const bankTiles = document.getElementById('bank-tiles');
  if(!bankTiles) return;
  const HOLD_DELAY_MS = 180; // long enough to not trigger on a normal tap, short enough to feel responsive
  const MOVE_CANCEL_THRESHOLD = 10; // px of movement before the hold timer fires that cancels the drag-intent (lets a quick swipe/scroll pass through untouched)

  bankTiles.querySelectorAll('.bank-tile').forEach(tile => {
    tile.addEventListener('pointerdown', (e)=>{
      if(tile.classList.contains('used')) return;
      if(!bankState[activeTier]) return;

      const startClientX = e.clientX;
      const startClientY = e.clientY;
      const rect = tile.getBoundingClientRect();
      const grabOffsetX = e.clientX - rect.left;
      // Fixed rather than exact touch-relative offset, so the dragged
      // tile consistently sits above the finger (not obscured by it)
      // regardless of exactly where within the tile it was grabbed.
      const grabOffsetY = rect.height * 1.5;
      let dragging = false;
      let holdTimeout = null;

      // Preview-only state while dragging - the real bankState order
      // isn't touched until an actual drop. originalIndex is where the
      // dragged tile truly lives; previewGapIndex is where the empty
      // placeholder currently visually sits, which only matches
      // originalIndex until the pointer moves elsewhere within the bank.
      const originalIndex = Number(tile.dataset.index);
      let previewGapIndex = originalIndex;
      let otherTiles = [];
      let baselineRects = [];
      let placeholder = null;
      let bankTop = 0;

      function beginDrag(){
        dragging = true;
        skipNextBankTap = true;
        tile.classList.add('dragging');
        tile.style.position = 'fixed';
        tile.style.left = `${rect.left}px`;
        tile.style.top = `${rect.top}px`;
        tile.style.width = `${rect.width}px`;
        tile.style.height = `${rect.height}px`;
        tile.style.margin = '0';

        otherTiles = [...bankTiles.querySelectorAll('.bank-tile')].filter(t => t !== tile);
        // Captured once, before any preview shifting happens - these stay
        // valid, stable reference points for the gap-index calculation
        // for the entire drag, regardless of whatever transforms get
        // applied to individual tiles later during the preview.
        baselineRects = otherTiles.map(t => t.getBoundingClientRect());
        bankTop = bankTiles.getBoundingClientRect().top;

        // Placeholder takes the dragged tile's exact spot in the flex
        // row - same size, faded, no letter - so nothing else shifts
        // the instant the drag begins, only once the pointer actually
        // moves somewhere new.
        placeholder = document.createElement('div');
        placeholder.className = 'bank-tile-placeholder';
        tile.parentNode.insertBefore(placeholder, tile);
      }

      // Moves the placeholder to sit right before otherTiles[gapIndex]
      // (or at the very end if gapIndex is past the last tile), then
      // FLIP-animates any other tile whose position actually changed
      // as a result - this is what makes the shift read as tiles
      // sliding aside to open a space, not a silent snap.
      function movePlaceholderTo(gapIndex){
        const beforeRects = new Map();
        otherTiles.forEach(t => beforeRects.set(t, t.getBoundingClientRect()));

        if(gapIndex >= otherTiles.length){
          bankTiles.appendChild(placeholder);
        } else {
          bankTiles.insertBefore(placeholder, otherTiles[gapIndex]);
        }

        otherTiles.forEach(t => {
          const before = beforeRects.get(t);
          const after = t.getBoundingClientRect();
          const dx = before.left - after.left;
          if(dx === 0) return;
          t.style.transition = 'none';
          t.style.transform = `translateX(${dx}px)`;
          requestAnimationFrame(() => {
            t.style.transition = 'transform 0.15s ease';
            t.style.transform = '';
          });
        });

        previewGapIndex = gapIndex;
      }

      function onMove(ev){
        if(!dragging){
          const dx = Math.abs(ev.clientX - startClientX);
          const dy = Math.abs(ev.clientY - startClientY);
          if(dx > MOVE_CANCEL_THRESHOLD || dy > MOVE_CANCEL_THRESHOLD){
            clearTimeout(holdTimeout);
          }
          return;
        }
        ev.preventDefault();
        tile.style.left = `${ev.clientX - grabOffsetX}px`;
        tile.style.top = `${ev.clientY - grabOffsetY}px`;

        // The dragged tile's own rendered center - not the raw finger/
        // cursor position - is what determines overlap from here on.
        // The tile sits offset above the finger (so it isn't obscured
        // by it), so using the finger's position directly would trigger
        // reordering before the tile itself visually reaches another
        // tile's spot.
        const tileCenterX = (ev.clientX - grabOffsetX) + rect.width / 2;
        const tileCenterY = (ev.clientY - grabOffsetY) + rect.height / 2;

        // Nothing moves at all while the dragged tile is still above the
        // letter bank - only once it actually reaches the top of the
        // tiles does a live preview begin.
        const withinBank = tileCenterY >= bankTop;
        let targetGapIndex;
        if(!withinBank){
          targetGapIndex = originalIndex;
        } else {
          // Group into rows by baseline top value - flex-wrap lays tiles
          // out in horizontal rows, so tiles sharing a row share the
          // same top. Comparing X-position needs to happen only within
          // whichever row the dragged tile is actually overlapping, not
          // across every row at once.
          const rowTops = [...new Set(baselineRects.map(r => r.top))].sort((a,b) => a - b);
          let targetRowTop = rowTops[0];
          let closestDist = Infinity;
          for(const top of rowTops){
            const dist = Math.abs(tileCenterY - (top + 24)); // compare against each row's vertical center
            if(dist < closestDist){ closestDist = dist; targetRowTop = top; }
          }

          const rowEntries = baselineRects
            .map((r, i) => ({ i, r }))
            .filter(entry => entry.r.top === targetRowTop);

          targetGapIndex = rowEntries.length ? rowEntries[rowEntries.length - 1].i + 1 : otherTiles.length;
          for(const entry of rowEntries){
            const midX = (entry.r.left + entry.r.right) / 2;
            if(tileCenterX < midX){ targetGapIndex = entry.i; break; }
          }
        }

        if(targetGapIndex !== previewGapIndex){
          movePlaceholderTo(targetGapIndex);
        }
      }

      function onUp(){
        clearTimeout(holdTimeout);
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        if(dragging){
          // Only now, on an actual drop, does the real order/stableIds
          // data get touched - everything up to this point was purely
          // visual preview.
          if(previewGapIndex !== originalIndex){
            const order = bankState[activeTier].order;
            const stableIds = bankState[activeTier].stableIds;
            const remainingOrder = [...order];
            const [movedLetter] = remainingOrder.splice(originalIndex, 1);
            remainingOrder.splice(previewGapIndex, 0, movedLetter);
            const remainingIds = [...stableIds];
            const [movedId] = remainingIds.splice(originalIndex, 1);
            remainingIds.splice(previewGapIndex, 0, movedId);
            bankState[activeTier].order = remainingOrder;
            bankState[activeTier].stableIds = remainingIds;
          }

          if(placeholder && placeholder.parentNode) placeholder.remove();
          tile.classList.remove('dragging');
          tile.style.position = '';
          tile.style.left = '';
          tile.style.top = '';
          tile.style.width = '';
          tile.style.height = '';
          tile.style.margin = '';

          // Clean rebuild in the newly-committed order, rather than
          // trying to reconcile whatever ad-hoc DOM state the preview
          // left behind.
          render(false);
        }
      }

      holdTimeout = setTimeout(beginDrag, HOLD_DELAY_MS);
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}


function getBankWord(finalWord, guesses, steps, activeLength){
  // The bank shows whichever already-filled slot is the nearest one above
  // the active length - since every valid lower word's letters must be a
  // subset of every valid higher word's letters, that's always a valid
  // reference for building the current slot. Falls back to the final word
  // (the given, longest reference) if nothing above the active slot is
  // filled in yet.
  const above = steps.filter(L => L > activeLength && guesses[L]).sort((a,b)=>a-b);
  if(above.length > 0) return guesses[above[0]];
  return finalWord;
}

function getBelowWord(startingWord, guesses, steps, activeLength){
  // Mirror of getBankWord, looking downward instead of up: the letters in
  // whichever filled slot is the nearest one below the active length are
  // guaranteed to all reappear in the current guess too, so highlighting
  // them helps show what's already "locked in" versus what's genuinely
  // new territory. Falls back to the puzzle's given starting word if
  // nothing below the active slot has been filled in yet.
  const below = steps.filter(L => L < activeLength && guesses[L]).sort((a,b)=>b-a);
  if(below.length > 0) return guesses[below[0]];
  return startingWord;
}

function computeBelowMatchIndices(order, belowWord){
  // Greedily matches bank tiles (in whatever order they're currently
  // shown, shuffled or not) against the letter counts in belowWord, so
  // exactly the right number of tiles per letter get marked - e.g. if
  // belowWord has one "e" but the bank has two "e" tiles, only one of
  // them is marked as "from below," never both or neither.
  const remaining = {};
  for(const ch of belowWord){ remaining[ch] = (remaining[ch] || 0) + 1; }
  const matched = new Set();
  order.forEach((letter, i) => {
    if(remaining[letter] > 0){
      matched.add(i);
      remaining[letter]--;
    }
  });
  return matched;
}

function isTierComplete(tier){
  const puzzle = getTodaysPuzzle(tier);
  if(!puzzle) return true; // no puzzle scheduled for this tier today - don't block the celebration on it
  const steps = [];
  for(let L = puzzle.start.length+1; L < puzzle.final.length; L++) steps.push(L);
  const guesses = loadGuesses(tier);
  if(!steps.every(L => guesses[L])) return false;
  const { valid } = isValidChain(puzzle.start, guesses, puzzle.final);
  return valid;
}
function isTierGenuinelyWon(tier){
  // isTierComplete alone can't tell a real win apart from a tier that was
  // only filled in via "View solution" - this adds that distinction, for
  // anywhere that specifically needs to exclude revealed solutions (the
  // ladder-climb celebration, and the share text's win/not-played line).
  if(!isTierComplete(tier)) return false;
  return !localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:solutionRevealedAsLoss`);
}

function puzzleDayNumber(){
  const [ly, lm, ld] = LAUNCH_DATE_KEY.split('-').map(Number);
  const launch = new Date(ly, lm-1, ld);
  const [ty, tm, td] = dateKey.split('-').map(Number);
  const today = new Date(ty, tm-1, td);
  const diffDays = Math.round((today - launch) / 86400000);
  return diffDays + 1;
}

// The exact time-formatting logic used by the Share Results button -
// extracted into its own named function so it's the single, reusable
// source of truth. Other pages (leaderboard, stats) duplicate this exact
// same logic verbatim, since they're separate static HTML files with no
// shared JS module system to actually import a function across.
function formatDurationForShare(ms){
  const totalSeconds = ms / 1000;
  if(totalSeconds < 60){
    return `${totalSeconds.toFixed(1)}s`;
  } else if(totalSeconds < 3600){
    return `${Math.floor(totalSeconds / 60)}m ${Math.round(totalSeconds % 60)}s`;
  } else {
    const totalMinutes = Math.floor(totalSeconds / 60);
    return `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m ${Math.round(totalSeconds % 60)}s`;
  }
}

function buildShareText(){
  const tierLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const lines = [];
  const timerChoice = getTimerChoice();
  for(const tier of TIERS){
    const puzzle = getTodaysPuzzle(tier);
    if(!puzzle) continue; // nothing scheduled for this tier today, skip it
    if(isTierGenuinelyWon(tier)){
      const hints = getHintsUsed(tier);
      let timeSuffix = null;
      if(timerChoice === 'timed'){
        const frozenElapsed = localStorage.getItem(timerElapsedKey(tier));
        if(frozenElapsed !== null){
          timeSuffix = formatDurationForShare(Number(frozenElapsed));
        }
      }
      let line;
      if(timeSuffix !== null){
        // The time itself already proves completion, so the checkmark
        // (and parentheses around the time) would just be redundant -
        // hints still get shown alongside it though, since that's
        // distinct, meaningful info about how much help was needed.
        line = hints > 0
          ? `${tierLabels[tier]}: ${timeSuffix} ${'💡'.repeat(hints)}`
          : `${tierLabels[tier]}: ${timeSuffix}`;
      } else {
        line = hints > 0
          ? `${tierLabels[tier]}: ${'💡'.repeat(hints)}`
          : `${tierLabels[tier]}: ✔️`;
      }
      lines.push(line);
    } else {
      lines.push(`${tierLabels[tier]}: —`);
    }
  }
  return `Letter Ladder #${puzzleDayNumber()} 🪜\n\n${lines.join('\n')}\n\n${SITE_URL}`;
}

async function buildShareImage(){
  // Builds a results-card PNG matching the game's own visual style, for
  // sharing to platforms like Instagram Stories that handle images far
  // better than plain text through the native share sheet.
  const tierLabels = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const rows = [];
  for(const tier of TIERS){
    const puzzle = getTodaysPuzzle(tier);
    if(!puzzle) continue;
    if(isTierGenuinelyWon(tier)){
      const hints = getHintsUsed(tier);
      rows.push({ label: tierLabels[tier], status: hints > 0 ? '💡'.repeat(hints) : '✔', solved: true });
    } else {
      rows.push({ label: tierLabels[tier], status: '—', solved: false });
    }
  }

  const W = 1080, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Background gradient matching the game's own body background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#24384F');
  grad.addColorStop(0.55, '#1B2A41');
  grad.addColorStop(1, '#142132');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = '#F5EFE0';
  ctx.font = "700 68px Georgia, serif";
  ctx.fillText(`Letter Ladder #${puzzleDayNumber()} 🪜`, W/2, 170);

  ctx.fillStyle = '#9FB3C8';
  ctx.font = "400 38px Arial, sans-serif";
  ctx.fillText("Can you climb it?", W/2, 232);

  // Per-tier result rows, styled as bold, high-contrast cards - solid
  // amber fill for solved tiers (not a faint tint), a clearly visible
  // outlined box for unsolved ones, so this still reads clearly even at
  // the small thumbnail size most share sheets and chat apps show it at.
  let y = 330;
  const cardW = 820, cardH = 140, cardX = (W - cardW) / 2, cardGap = 26;
  for(const row of rows){
    ctx.beginPath();
    ctx.roundRect(cardX, y, cardW, cardH, 24);
    if(row.solved){
      ctx.fillStyle = '#E8A33D';
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    const textColor = row.solved ? '#1B2A41' : '#F5EFE0';
    ctx.textAlign = 'left';
    ctx.fillStyle = textColor;
    ctx.font = "700 52px Arial, sans-serif";
    ctx.fillText(row.label, cardX + 40, y + 90);

    ctx.textAlign = 'right';
    ctx.font = "700 52px Arial, sans-serif";
    ctx.fillStyle = row.solved ? textColor : '#9FB3C8';
    ctx.fillText(row.status, cardX + cardW - 40, y + 90);

    y += cardH + cardGap;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9FB3C8';
  ctx.font = "400 34px Arial, sans-serif";
  ctx.fillText(SITE_URL.replace('https://', ''), W/2, y + 30);

  return new Promise(resolve => {
    canvas.toBlob(blob => resolve(blob), 'image/png');
  });
}

function spawnConfetti(pieceCount){
  const colors = ['#E8A33D', '#6FBF8B', '#F5EFE0', '#D9705F'];
  for(let i=0; i<pieceCount; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
    piece.style.animationDelay = (Math.random()*0.4) + 's';
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 4200);
  }
}

function triggerLadderClimbCelebration(finalWord){
  // Once all three tiers are done for the day: the letters of the final
  // word walk out of their box (with a bouncy little walk) and climb a
  // ladder that appears on the right side of the screen, disappearing
  // off the top - no confetti for this one, since it's the bigger
  // moment. The real box empties out letter by letter in sync with each
  // one leaving (not a separate effect happening elsewhere), and the
  // full word reappears in the box a short pause after they've all
  // exited, right before the usual winning banner shows.
  const anchorEl = document.getElementById('final-word-rung');
  if(!anchorEl){ showSummitBanner(); return; } // safety fallback

  const rect = anchorEl.getBoundingClientRect();
  const originalText = anchorEl.textContent;

  const letters = finalWord.toUpperCase().split('');
  anchorEl.innerHTML = letters.map((ch, i) => `<span class="anchor-letter" data-anchor-index="${i}">${ch}</span>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'ladder-climb-overlay';

  const ladder = document.createElement('div');
  ladder.className = 'climb-ladder';
  // The ladder's base sits at the same height as the letters' starting
  // position (the final-word box), extending only upward off the top of
  // the screen from there - not spanning the full viewport - so it
  // visually reads as "walk to the ladder's base, then climb up."
  ladder.style.top = '-20px';
  ladder.style.bottom = `${window.innerHeight - rect.top}px`;
  overlay.appendChild(ladder);

  // The ladder itself (right: 6vw, 46px wide, with 5px rails on each
  // side) - climbing targets are spread across its interior width
  // (between the rails) rather than every letter aiming for one exact
  // spot, so they visibly use more of the ladder rather than stacking
  // on its right rail.
  const ladderRight = window.innerWidth - (window.innerWidth * 0.06);
  const ladderInnerLeft = ladderRight - 46 + 9;
  const ladderInnerWidth = 46 - 18;

  letters.forEach((letter, i) => {
    const el = document.createElement('div');
    el.className = 'climb-letter';
    el.textContent = letter;
    const letterStartX = rect.left + (i * (rect.width / letters.length));
    // Cycles across a few spots within the ladder's interior (left,
    // middle, right, repeat) - and subtracts half the letter's own
    // width (15px) since CSS "left" positions the left edge, not the
    // center, so without this the letter visually lands off-center.
    const targetCenterX = ladderInnerLeft + ladderInnerWidth * ((i % 3) / 2);
    el.style.setProperty('--start-x', `${letterStartX}px`);
    el.style.setProperty('--start-y', `${rect.top}px`);
    el.style.setProperty('--ladder-x', `${targetCenterX - 15}px`);
    const delayMs = i * 390;
    el.style.animationDelay = `${delayMs / 1000}s`;
    overlay.appendChild(el);

    // Hide this letter's spot in the real box at the same moment its
    // climbing counterpart starts walking out.
    setTimeout(() => {
      const anchorLetterEl = anchorEl.querySelector(`[data-anchor-index="${i}"]`);
      if(anchorLetterEl) anchorLetterEl.style.opacity = '0';
    }, delayMs);
  });

  document.body.appendChild(overlay);

  const exitDuration = 3060 + (letters.length - 1) * 390 + 180; // animation length + staggered delays + small buffer
  const pauseAfterExit = 1050; // a beat with the box sitting empty, before the word returns
  setTimeout(()=>{
    overlay.remove();
    anchorEl.textContent = originalText;
    showSummitBanner();
  }, exitDuration + pauseAfterExit);
}

function checkAndCelebrateIfAllComplete(finalWord){
  if(!TIERS.every(isTierGenuinelyWon)) return;
  const flagKey = `letterladder:${accountScope}:${dateKey}:summitShown`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  // Deferred: this render() call is still mid-flight and about to
  // reassign panel.innerHTML with a fresh copy of the final-word box -
  // triggering immediately would mean modifying a DOM element that's
  // seconds away from being wiped out and replaced. Waiting a tick lets
  // render() finish first, so this operates on the box that's actually
  // visible on the page.
  setTimeout(() => triggerLadderClimbCelebration(finalWord), 0);
}

function render(focusInput = false, pendingErrors = null){
  let nextTierForButton = null;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tier === activeTier);
  });

  // Capture whatever is currently typed (but not yet submitted) in the
  // active input before the panel gets rebuilt below - otherwise actions
  // like shuffle, which re-render without changing what's being typed,
  // would wipe out in-progress typing since a fresh input element only
  // ever starts from the last *committed* guess.
  let preservedLiveValue = null;
  if(activeLength != null){
    const existingInput = document.getElementById(`rung-input-${activeLength}`);
    if(existingInput) preservedLiveValue = existingInput.value;
  }

  const puzzle = getTodaysPuzzle(activeTier);
  if(!puzzle){
    panel.className = 'panel';
    panel.innerHTML = `<div class="empty-state">No ${activeTier} puzzle scheduled for today yet — check back soon!</div>`;
    return;
  }

  const startingWord = puzzle.start;
  const finalWord = puzzle.final;
  const steps = [];
  for(let L = startingWord.length+1; L < finalWord.length; L++) steps.push(L);

  const guesses = loadGuesses(activeTier);
  const allFilled = steps.every(L => guesses[L]);
  let feedback = '';
  let feedbackClass = '';
  let details = [];

  const revealedLossKey = `letterladder:${accountScope}:${dateKey}:${activeTier}:solutionRevealedAsLoss`;
  const isRevealedLoss = !!localStorage.getItem(revealedLossKey);

  if(isRevealedLoss){
    feedback = '';
    feedbackClass = 'revealed';
  } else if(allFilled){
    // Guarantee "played" is always counted before "solved" ever can be -
    // this covers puzzles that were already fully filled in from before
    // stats tracking existed, which would otherwise count as solved
    // without ever having been marked as played.
    markPlayedIfNeeded(activeTier);
    const { valid, invalidSteps } = isValidChain(startingWord, guesses, finalWord);
    if(valid){
      const nextTierForLink = { easy: 'medium', medium: 'hard' }[activeTier];
      if(nextTierForLink){
        nextTierForButton = nextTierForLink;
      }
      feedback = '';
      feedbackClass = 'win';
      markSolvedIfNeeded(activeTier, guesses);
      checkAndCelebrateIfAllComplete(finalWord);
    } else {
      feedback = "❌ Guesses aren't a valid progression.";
      feedbackClass = 'error';
      details = invalidSteps.map(s => {
        if(s.reason === 'missing_letters'){
          return `"${s.to.toUpperCase()}" is missing the "${s.letters.length === 1 ? s.letters[0].toUpperCase() : joinAnd(s.letters.map(l => l.toUpperCase()))}" from "${s.from.toUpperCase()}".`;
        }
        return `"${s.from.toUpperCase()}" → "${s.to.toUpperCase()}" isn't a valid one-letter step.`;
      });
    }
  }

  const isWon = feedbackClass === 'win';
  // Distinct from isWon: this covers both a genuine win AND a puzzle
  // filled in via View Solution, since some UI decisions (hiding the hint
  // button, showing the "clear to find a new path" prompt) should apply
  // either way - there's nothing left to hint at or discover once every
  // rung is filled in, regardless of how it got that way.
  const isMechanicallyComplete = isTierComplete(activeTier);
  // Editing after a win is allowed (clicking a rung + its delete-X reopens
  // it), so activeLength is no longer force-reset just because isWon is
  // true - only the actual guess-acceptance/delete logic controls it now.
  // The same applies after a revealed-loss: someone might still want to
  // keep exploring for a different valid path, even though the loss
  // itself is already permanently locked in for today's stats.

  if(activeLength === null && !isWon){
    // Always have a target box selected (without auto-focusing/opening
    // the keyboard) so the letter bank is ready to use immediately,
    // instead of requiring an initial tap into a box first. Points to the
    // highest unfilled box, not the lowest.
    const lastIncomplete = [...steps].reverse().find(L => !guesses[L]);
    if(lastIncomplete !== undefined) activeLength = lastIncomplete;
  }

  let feedbackHtml = feedback;
  let feedbackClassFinal = feedbackClass;
  if(pendingErrors){
    feedbackHtml = `<div class="error-list-wrap"><ul class="error-list">${pendingErrors.map(e => `<li>${e}</li>`).join('')}</ul></div>`;
    feedbackClassFinal = 'error';
    lastFeedback[activeTier] = { html: feedbackHtml, className: feedbackClassFinal };
  } else if(feedback !== ''){
    // A fresh win or invalid-chain result naturally takes priority and
    // supersedes any older single-guess error.
    lastFeedback[activeTier] = null;
  } else if(lastFeedback[activeTier]){
    // Nothing new to show this render (e.g. we're just opening a
    // different box to type the next guess) - keep showing whatever was
    // last displayed instead of letting it silently vanish.
    feedbackHtml = lastFeedback[activeTier].html;
    feedbackClassFinal = lastFeedback[activeTier].className;
  }

  const maxWordLen = finalWord.length; // always the longest word in the puzzle

  const totalRungs = steps.length + 2;
  let sizeTier = '';
  if(totalRungs >= 9) sizeTier = 'rungs-xl';
  else if(totalRungs >= 7) sizeTier = 'rungs-lg';
  else if(totalRungs >= 5) sizeTier = 'rungs-md';

  // Same font-size/min-width numbers as the CSS tiers below, mirrored here
  // in plain JS so the box width can be a flat pixel number - no calc()/
  // var()/max() for the browser to resolve, which is what kept going wrong.
  const TIER_CONFIG = {
    '':         { fontPx: 21.6, minWidthPx: 165 },
    'rungs-md': { fontPx: 18.4, minWidthPx: 115 },
    'rungs-lg': { fontPx: 16,   minWidthPx: 100 },
    'rungs-xl': { fontPx: 14.4, minWidthPx: 88  },
  };
  const tierCfg = TIER_CONFIG[sizeTier];
  const letterSpacingPx = tierCfg.fontPx * 0.05; // matches the CSS letter-spacing
  const computedWidthPx = Math.round(Math.max(
    tierCfg.minWidthPx,
    maxWordLen * tierCfg.fontPx * 0.6 + (maxWordLen - 1) * letterSpacingPx + tierCfg.fontPx * 3.4
  ));

  function rungBoxStyle(L){
    // ONE flat pixel width for every rung in this puzzle (based on the
    // longest word). A short word just naturally occupies less of the
    // box, centered, while the longest word fills it edge to edge -
    // that's what gives the pyramid effect, not stretched-out text.
    return `width:${computedWidthPx}px; max-width:${computedWidthPx}px; min-width:0;`;
  }

  const rungsHtml = [];
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${finalWord.length}</div><div class="rung anchor" id="final-word-rung" style="${rungBoxStyle(finalWord.length)}">${finalWord}</div></div>`);
  for(let i = steps.length-1; i>=0; i--){
    const L = steps[i];
    const g = guesses[L];
    if(activeLength === L){
      // Only show the delete option here if this specific box already had
      // a guess in it when it was opened (i.e. you clicked in to replace
      // or remove an existing entry) - not for a box you're filling in
      // for the first time.
      const deleteBtn = g ? `<button type="button" class="delete-guess-btn" data-length="${L}" aria-label="Delete this guess"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button>` : '';
      const inputValue = preservedLiveValue !== null ? preservedLiveValue : (g ? g : '');
      rungsHtml.push(`<div class="rung-row"><div class="rung-count">${L}</div><input type="text" class="rung rung-input" id="rung-input-${L}" data-length="${L}" maxlength="${L}" size="${maxWordLen}" value="${inputValue}" style="${rungBoxStyle(L)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" inputmode="${keyboardEnabled ? 'text' : 'none'}" ${keyboardEnabled ? '' : 'readonly'}>${deleteBtn}</div>`);
    } else {
      const clickableClass = 'clickable';
      rungsHtml.push(`<div class="rung-row"><div class="rung-count">${L}</div><div class="rung ${g?'':'empty'} ${clickableClass}" data-length="${L}" style="${rungBoxStyle(L)}">${g ? g : '&nbsp;'.repeat(L)}</div></div>`);
    }
  }
  rungsHtml.push(`<div class="rung-row"><div class="rung-count">${startingWord.length}</div><div class="rung anchor" style="${rungBoxStyle(startingWord.length)}">${startingWord}</div></div>`);

  const trashIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
  const lightbulbIcon = `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M9 21h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"></path><path d="M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"></path><path d="M12 3a6.5 6.5 0 0 0-4 11.6c.7.6 1.2 1.5 1.3 2.4h5.4c.1-.9.6-1.8 1.3-2.4A6.5 6.5 0 0 0 12 3z" fill="#F5C842" stroke="#F5C842" stroke-width="1.3" stroke-linejoin="round"></path></svg>`;
  // Hint targets whichever box the player currently has open - falls
  // back to the highest unfilled rung only if nothing's actively
  // selected (or the active one happens to already be filled). Up to
  // two hints are allowed per rung (first reveals the letter set,
  // second reveals the first letter) - once both have been used for
  // this specific target, there's no third hint to offer, so the
  // button disappears until a different (not-yet-maxed) rung becomes
  // the target.
  const unfilledForHint = steps.filter(L => !guesses[L]);
  const hintTargetLength = (activeLength !== null && !guesses[activeLength])
    ? activeLength
    : (unfilledForHint.length > 0 ? Math.max(...unfilledForHint) : null);
  const hintMaxedForTarget = hintTargetLength !== null && getHintInfo(activeTier, hintTargetLength).count >= 2;
  const showHintBtn = !isMechanicallyComplete && !hintMaxedForTarget;

  let bankHtml = '';
  let kbToggleHtml = '';
  let backspaceButtonHtml = '';
  if(!isWon && activeLength != null){
    let bankTilesHtml = '';
    const showBankTiles = !keyboardEnabled || !isTouchDevice;
    if(showBankTiles){
      const bankWord = getBankWord(finalWord, guesses, steps, activeLength);
      if(!bankState[activeTier] || bankState[activeTier].word !== bankWord || bankState[activeTier].forLength !== activeLength){
        const order = bankWord.split('');
        bankState[activeTier] = {
          word: bankWord,
          order,
          stableIds: order.map((_, i) => i), // travels with each letter through drag-reorders, unlike its current array position
          forLength: activeLength,
          usedIndices: computeInitialUsedIndices(order, guesses[activeLength] || ''),
        };
      }
      const order = bankState[activeTier].order;
      const stableIds = bankState[activeTier].stableIds;
      const usedSet = new Set(bankState[activeTier].usedIndices);
      const belowWord = getBelowWord(startingWord, guesses, steps, activeLength);
      const belowMatchSet = computeBelowMatchIndices(order, belowWord);
      const tilesHtml = order.map((letter, i) =>
        `<button type="button" class="bank-tile ${belowMatchSet.has(i) ? 'from-below' : ''} ${usedSet.has(stableIds[i]) ? 'used' : ''}" data-letter="${letter}" data-index="${i}" data-stable-id="${stableIds[i]}">${letter.toUpperCase()}</button>`
      ).join('');
      bankTilesHtml = `<div class="bank-tiles" id="bank-tiles">${tilesHtml}</div>`;
      const backspaceIcon = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9l-6 6 6 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"></path><line x1="12" y1="9" x2="18" y2="15"></line><line x1="18" y1="9" x2="12" y2="15"></line></svg>`;
      backspaceButtonHtml = `<button type="button" class="bank-primary-btn bank-submit-btn" id="bank-backspace-btn" aria-label="Delete last letter">${backspaceIcon}</button>`;
    }
    // No keyboard-toggle at all on desktop - a physical keyboard is
    // always available there, so there's nothing to toggle.
    if(isTouchDevice){
      const kbIcon = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"></rect><line x1="6" y1="9.5" x2="6" y2="9.5"></line><line x1="9.5" y1="9.5" x2="9.5" y2="9.5"></line><line x1="13" y1="9.5" x2="13" y2="9.5"></line><line x1="16.5" y1="9.5" x2="16.5" y2="9.5"></line><line x1="19.5" y1="9.5" x2="19.5" y2="9.5"></line><line x1="6" y1="13" x2="6" y2="13"></line><line x1="9.5" y1="13" x2="9.5" y2="13"></line><line x1="13" y1="13" x2="13" y2="13"></line><line x1="16.5" y1="13" x2="16.5" y2="13"></line><line x1="19.5" y1="13" x2="19.5" y2="13"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>`;
      kbToggleHtml = `<button type="button" class="bank-ctrl-btn ${keyboardEnabled ? 'kb-on' : ''}" id="keyboard-toggle-btn" aria-label="Toggle keyboard">${kbIcon}</button>`;
    }
    bankHtml = `
      <div class="letter-bank" id="letter-bank">
        ${bankTilesHtml}
      </div>
    `;
  }

  // Shuffle/hint/backspace only make sense with an active, unsolved slot
  // to act on - trash stays available regardless, so this whole row is
  // built independently of that condition rather than nested inside it.
  const primaryActionsHtml = `
    <div class="bank-primary-actions">
      ${!isWon && activeLength != null ? `<button type="button" class="bank-ctrl-btn" id="shuffle-btn" aria-label="Shuffle letters">🔀</button>` : ''}
      ${showHintBtn ? `<button type="button" class="bank-ctrl-btn" id="hint-btn" aria-label="Hint">${lightbulbIcon}</button>` : ''}
      <button type="button" class="bank-ctrl-btn" id="clear-btn" aria-label="Clear guesses">${trashIcon}</button>
      ${isMechanicallyComplete ? `<span class="clear-hint-text">Clear puzzle to find a new path?</span>` : ''}
      ${backspaceButtonHtml}
    </div>
  `;

  const anyTierSolvedToday = TIERS.some(tier => getTodaysPuzzle(tier) && isTierComplete(tier));

  panel.className = `panel ${sizeTier}`;
  // Replacing the panel's contents destroys the currently focused input.
  // On desktop (where the input is genuinely focused) that fires a blur,
  // which would otherwise be mistaken for the person clicking away and
  // trigger commit() - resetting activeLength and re-selecting the
  // highest unfilled rung, clobbering whichever rung they actually just
  // clicked into. Mobile rarely focuses the input at all, which is why
  // this only ever showed up on desktop.
  suppressBlurCommit = true;
  panel.innerHTML = `
    <div class="ladder-scroll" id="ladder-scroll"><div class="ladder">${rungsHtml.join('')}</div></div>
    <div class="feedback ${feedbackClassFinal}">${feedbackHtml}</div>
    ${details.map(d=>`<div class="details">${d}</div>`).join('')}
    <div class="hint-display" id="hint-display"></div>
    <div class="actions-row">
      ${nextTierForButton ? `<button class="btn-primary" id="next-puzzle-btn" type="button">Next puzzle</button>` : ''}
      ${anyTierSolvedToday ? `<button class="btn-primary" id="share-btn" type="button">Share results</button>` : ''}
    </div>
    <a href="#" id="solution-link" class="view-solution-link">View solution</a>
    ${bankHtml}
    ${primaryActionsHtml}
    ${!isWon && activeLength != null ? `<div class="actions-row">${kbToggleHtml}</div>` : ''}
    <div class="share-status" id="share-status"></div>
  `;
  suppressBlurCommit = false;

  if(activeLength !== null && !guesses[activeLength] && getHintInfo(activeTier, activeLength).count > 0){
    const hd = document.getElementById('hint-display');
    if(hd) hd.innerHTML = buildHintDisplayHtml(activeTier, activeLength);
  }

  document.getElementById('clear-btn').addEventListener('click', ()=>{
    showConfirmModal('Are you sure you want to clear your puzzle?', ()=>{
      const ladderEl = panel.querySelector('.ladder');
      if(ladderEl){
        ladderEl.classList.add('fading-out');
        setTimeout(()=>{
          activeLength = null;
          clearGuesses(activeTier);
          lastFeedback[activeTier] = null;
          setLastHintedLength(activeTier, null);
          bankState[activeTier] = null;
          render();
        }, 960);
      } else {
        activeLength = null;
        clearGuesses(activeTier);
        lastFeedback[activeTier] = null;
        setLastHintedLength(activeTier, null);
        bankState[activeTier] = null;
        render();
      }
    });
  });

  const shareBtn = document.getElementById('share-btn');
  if(shareBtn){
    shareBtn.addEventListener('click', async ()=>{
      const shareText = buildShareText();
      const statusEl = document.getElementById('share-status');

      // Text-only share - bundling the image in alongside the text
      // resulted in both showing up together in the native share sheet
      // (e.g. a Messages share getting the image attachment AND the text
      // caption at once), which felt redundant rather than helpful.
      if(navigator.share){
        try{
          await navigator.share({ text: shareText });
        }catch(e){
          // person cancelled the native share sheet - not an error, do nothing
        }
      } else {
        try{
          await navigator.clipboard.writeText(shareText);
          if(statusEl) statusEl.textContent = 'Copied to clipboard!';
        }catch(e){
          if(statusEl) statusEl.textContent = shareText;
        }
      }
    });
  }

  const solutionLink = document.getElementById('solution-link');
  if(solutionLink){
    solutionLink.addEventListener('click', (e) => {
      e.preventDefault();
      handleViewSolutionClick();
    });
  }

  const nextPuzzleBtn = document.getElementById('next-puzzle-btn');
  if(nextPuzzleBtn){
    bindTapAction(nextPuzzleBtn, ()=>{
      switchToTier({ easy: 'medium', medium: 'hard' }[activeTier]);
    });
  }

  const shuffleBtn = document.getElementById('shuffle-btn');
  if(shuffleBtn){
    bindTapAction(shuffleBtn, ()=>{
      const order = bankState[activeTier].order;
      const stableIds = bankState[activeTier].stableIds;
      // Fisher-Yates shuffle, in place - stableIds must move in lockstep
      // with order, since stableIds[i] describes order[i]. Shuffling only
      // one of them would scramble which tile each used-marker points to.
      for(let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
        [stableIds[i], stableIds[j]] = [stableIds[j], stableIds[i]];
      }
      render(true);
    });
  }

  const keyboardToggleBtn = document.getElementById('keyboard-toggle-btn');
  if(keyboardToggleBtn){
    bindTapAction(keyboardToggleBtn, ()=>{
      keyboardEnabled = !keyboardEnabled;
      localStorage.setItem('letterladder:keyboardEnabled', keyboardEnabled ? 'true' : 'false');
      render(true);
    });
  }

  let bankSyncSkip = false; // set true right before an input event we've already handled ourselves (tile tap / backspace), so the live-sync listener doesn't redundantly (or incorrectly) re-diff it

  const bankBackspaceBtn = document.getElementById('bank-backspace-btn');
  if(bankBackspaceBtn){
    bindTapAction(bankBackspaceBtn, ()=>{
      const inputEl = document.getElementById(`rung-input-${activeLength}`);
      if(inputEl && inputEl.value.length > 0){
        inputEl.value = inputEl.value.slice(0, -1);
        if(bankState[activeTier]) bankState[activeTier].usedIndices.pop();
        bankSyncSkip = true;
        inputEl.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  }

  panel.querySelectorAll('.bank-tile').forEach(tile => {
    bindTapAction(tile, ()=>{
      if(skipNextBankTap){ skipNextBankTap = false; return; } // this tap was actually the release of a drag - don't also select the letter
      const inputEl = document.getElementById(`rung-input-${activeLength}`);
      if(!inputEl) return;

      if(tile.classList.contains('used')){
        // Tapping an already-used (faded) tile removes that specific
        // letter from the current guess, wherever it appears - rather
        // than doing nothing, which was the previous behavior. The
        // tile's stable ID (not its current bank position) is what
        // identifies exactly which character in the guess it
        // corresponds to, since usedIndices is built in the same order
        // letters were typed.
        if(!bankState[activeTier]) return;
        const stableId = Number(tile.dataset.stableId);
        const usedIndices = bankState[activeTier].usedIndices;
        const pos = usedIndices.indexOf(stableId);
        if(pos === -1) return;

        activeSlotHasUntouchedGuess = false; // this is a genuine edit now
        inputEl.value = inputEl.value.slice(0, pos) + inputEl.value.slice(pos + 1);
        usedIndices.splice(pos, 1);
        bankSyncSkip = true;
        inputEl.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }

      if(activeSlotHasUntouchedGuess){
        activeSlotHasUntouchedGuess = false;
        inputEl.value = '';
        if(bankState[activeTier]) bankState[activeTier].usedIndices = [];
      }
      if(inputEl.value.length >= Number(inputEl.maxLength)) return; // already full
      inputEl.value += tile.dataset.letter;
      // Track the EXACT tile instance tapped, so this specific tile (not
      // just "a" matching letter) is what shows as used - matters when
      // there are duplicate letters like the three E's in "generated".
      if(bankState[activeTier]) bankState[activeTier].usedIndices.push(Number(tile.dataset.stableId));
      bankSyncSkip = true;
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    });
  });
  setupBankTileDragging();

  const hintBtn = document.getElementById('hint-btn');
  if(hintBtn){
    bindTapAction(hintBtn, ()=>{
      const hintDisplay = document.getElementById('hint-display');
      const unfilled = steps.filter(L => !guesses[L]);
      if(unfilled.length === 0){
        hintDisplay.innerHTML = `Every rung is already filled in!`;
        return;
      }
      const focusedEl = document.activeElement;
      const focusedLength = (focusedEl && focusedEl.id && focusedEl.id.startsWith('rung-input-')) ? Number(focusedEl.dataset.length) : null;
      const targetLength = (focusedLength !== null && !guesses[focusedLength])
        ? focusedLength
        : (activeLength !== null && !guesses[activeLength]) ? activeLength : Math.max(...unfilled);
      const dayHints = (typeof HINTS_SCHEDULE !== 'undefined' && HINTS_SCHEDULE[dateKey]) || null;
      const tierHint = dayHints ? dayHints[activeTier] : null;
      const targetWord = tierHint ? tierHint.solution.find(w => w.length === targetLength) : null;

      if(!targetWord){
        hintDisplay.innerHTML = `No hint available for this puzzle yet`;
        return;
      }

      const hintInfo = getHintInfo(activeTier, targetLength);
      const isSecondHint = hintInfo.count === 1;
      let confirmMsg = isSecondHint
        ? "Are you sure you'd like to use a second hint? This one reveals the first letter."
        : "Are you sure you'd like to use a hint?";
      if(getTimerChoice() === 'timed'){
        confirmMsg += `<div class="confirm-submessage">(Each hint adds 3 minutes to the timer)</div>`;
      }

      showConfirmModal(confirmMsg, ()=>{
        const updatedInfo = { ...hintInfo };
        if(!isSecondHint){
          updatedInfo.letters = joinAnd(getHintLetterOrder(targetWord).map(ch => ch.toUpperCase()));
        } else {
          updatedInfo.firstLetter = targetWord[0].toUpperCase();
        }
        updatedInfo.count = (updatedInfo.count || 0) + 1;
        saveHintInfo(activeTier, targetLength, updatedInfo);
        setLastHintedLength(activeTier, targetLength);
        recordHintUsed(activeTier);
        if(typeof dataLayer !== 'undefined'){
          dataLayer.push({
            event: 'hint_used',
            player_id: getPlayerId(),
            tier: activeTier,
            puzzle_date: dateKey,
            rung_length: targetLength,
            hint_level: isSecondHint ? 2 : 1,
          });
        }
        render(true);
      });
    });
  }

  panel.querySelectorAll('.rung.clickable').forEach(el => {
    bindTapAction(el, ()=>{
      const L = Number(el.dataset.length);
      activeSlotHasUntouchedGuess = !!guesses[L];
      activeLength = L;
      render(true);
    });
  });
  panel.querySelectorAll('.delete-guess-btn').forEach(btn => {
    function doDelete(){
      const L = Number(btn.dataset.length);
      const currentGuesses = loadGuesses(activeTier);
      delete currentGuesses[L];
      saveGuesses(activeTier, currentGuesses);
      // Force the letter bank to recompute from scratch - otherwise its
      // "which tiles are used" tracking stays stuck reflecting the guess
      // that just got deleted, leaving tiles faded when they should be
      // available again.
      bankState[activeTier] = null;
      // Clear the actual input's live value too - otherwise render()'s
      // in-progress-typing preservation (added for the shuffle fix) would
      // read this now-stale value straight off the DOM and put the just-
      // deleted guess right back into the freshly-rendered box.
      const existingInput = document.getElementById(`rung-input-${L}`);
      if(existingInput) existingInput.value = '';
      // Leave this same box open and focused, now empty, ready to type a
      // fresh guess right away.
      activeLength = L;
      render(true);
    }
    // On iOS specifically, blur can fire on the currently-focused input
    // BEFORE any mousedown/click on this button even happens - preventing
    // mousedown's default (which worked for other browsers) isn't reliable
    // there. Handling touchend directly, and preventing default on it,
    // suppresses the whole synthesized mouse-event sequence (blur,
    // mousedown, click) that would otherwise follow the tap - so the
    // delete runs immediately, before any premature re-render can happen.
    btn.addEventListener('touchend', (e)=>{
      e.preventDefault();
      doDelete();
    });
    btn.addEventListener('mousedown', (e)=> e.preventDefault());
    btn.addEventListener('click', (e)=>{
      // Only reached via an actual mouse click (desktop) - on touch
      // devices the touchend handler above already ran and prevented
      // this synthesized click from firing at all, so there's no
      // double-delete.
      e.stopPropagation();
      doDelete();
    });
  });

  let activeInput = null;
  if(activeLength != null){
    activeInput = document.getElementById(`rung-input-${activeLength}`);
  }

  if(activeInput){
    if(focusInput){
      // The rung must already be visible on screen for the person to have
      // tapped it - so the browser's default "scroll focused input into
      // view" behavior is never actually needed here, and on long puzzles
      // it was yanking the page away from a position the person had
      // deliberately scrolled to (hiding the icon row below the input).
      const scrollYBefore = window.scrollY;
      activeInput.focus({ preventScroll: true });
      activeInput.select();
      // Fallback for browsers that ignore preventScroll: if focusing still
      // triggered a scroll jump, put the page back where it was.
      requestAnimationFrame(()=>{
        if(Math.abs(window.scrollY - scrollYBefore) > 5){
          window.scrollTo(0, scrollYBefore);
        }
      });
    }

    let lastNonEmptyValue = activeInput.value || '';
    let committed = false;
    function commit(viaEnter){
      if(committed) return;
      committed = true;

      const L = activeLength;
      let liveValue = activeInput.value;
      // On some iPhones, the field's value can appear to already be
      // cleared by the moment an Enter-style submit is processed (before
      // our code gets to read it), which would otherwise look identical
      // to an abandoned/empty attempt and silently close with no error.
      // Fall back to the last thing they actually typed in that case.
      if(viaEnter && (!liveValue || liveValue.trim() === '') && lastNonEmptyValue){
        liveValue = lastNonEmptyValue;
      }
      const raw = liveValue.replace(/\s+/g,'').toLowerCase().slice(0, L);

      if(raw === ''){
        if(pendingErrors){
          // This box was reopened specifically to show an error (from an
          // earlier Enter-triggered submit). If it blurs away untouched
          // before the person retypes anything, don't silently wipe that
          // error off the screen - keep it visible.
          activeLength = null;
          render(false, pendingErrors);
          return;
        }
        // Nothing typed (or it was cleared) - just close without changing
        // anything, no error needed for an abandoned/empty attempt.
        activeLength = null;
        render();
        return;
      }

      markPlayedIfNeeded(activeTier);
      const errs = [];

      if(raw.length !== L){
        errs.push(`Guess must be ${L} letters long`);
      }

      if(!/^[a-z]+$/.test(raw)){
        errs.push("Guess must be letters only");
      } else {
        if(!WORD_SET.has(raw)) errs.push("Not a valid English word");
        const letterProblems = checkGuessLetters(raw, startingWord, finalWord);
        for(const problem of letterProblems){
          if(problem.reason === 'missing_starting_letters'){
            errs.push(`Guess doesn't include every letter from the bottom word: ${joinAnd(problem.letters.map(l => l.toUpperCase()))}`);
          } else if(problem.reason === 'letter_not_in_final'){
            const isPlural = problem.letters.length > 1;
            errs.push(`Guess uses ${isPlural ? "letters that aren't" : "a letter that isn't"} in the top word: ${joinAnd(problem.letters.map(l => l.toUpperCase()))}`);
          } else if(problem.reason === 'too_many_repeats'){
            const parts = problem.details.map(d => `"${d.ch.toUpperCase()}" too many times — it's only in the final word ${timesText(d.fCount)}`);
            errs.push(`Guess uses ${parts.join('; ')}`);
          }
        }
      }

      if(errs.length > 0){
        bumpGuessCount(activeTier, L);
        if(typeof dataLayer !== 'undefined'){
          dataLayer.push({
            event: 'word_submitted',
            player_id: getPlayerId(),
            tier: activeTier,
            puzzle_date: dateKey,
            rung_length: L,
            word: raw,
            is_accepted: false,
            is_creator_solution_word: false,
          });
        }
        activeInput.value = '';
        bankState[activeTier] = null;
        if(viaEnter){
          // An explicit submit attempt - keep this rung open so they can
          // fix it right away.
          render(true, errs);
        } else {
          // Tapped away instead of pressing Enter (this is actually the
          // common case on mobile, where the keyboard's "Return"/"Go" key
          // often just blurs the field rather than firing a proper Enter
          // key event). Still show the error - just don't force focus
          // back, since they may have deliberately tapped somewhere else.
          activeLength = null;
          render(false, errs);
        }
        return;
      }

      const newGuesses = loadGuesses(activeTier);
      newGuesses[L] = raw;
      saveGuesses(activeTier, newGuesses);
      lastFeedback[activeTier] = null;
      markStartedIfNeeded(activeTier);
      bumpGuessCount(activeTier, L);
      if(typeof dataLayer !== 'undefined'){
        const daySolution = (typeof HINTS_SCHEDULE !== 'undefined' && HINTS_SCHEDULE[dateKey] && HINTS_SCHEDULE[dateKey][activeTier])
          ? HINTS_SCHEDULE[dateKey][activeTier].solution : null;
        const creatorWordAtLength = daySolution ? daySolution.find(w => w.length === L) : null;
        dataLayer.push({
          event: 'word_submitted',
          player_id: getPlayerId(),
          tier: activeTier,
          puzzle_date: dateKey,
          rung_length: L,
          word: raw,
          is_accepted: true,
          is_creator_solution_word: creatorWordAtLength === raw,
        });
      }

      // Auto-advance to the next incomplete box - the highest unfilled
      // one, not the lowest. On iOS specifically, explicitly blurring the
      // old input first, then synchronously re-rendering and focusing
      // the new one (rather than letting an implicit blur-via-DOM-removal
      // happen automatically), gives Safari a clearer, more reliable
      // blur-then-focus transition to recognize for keeping the
      // on-screen keyboard open across the swap. This is scoped to iOS
      // only, not touch devices generally, since it was specifically
      // reasoned about and tested against Safari's behavior - other
      // mobile browsers may not need (or may not respond well to) the
      // same explicit-blur workaround.
      // Advances to the nearest still-unfilled step above the one just
      // filled, if one exists - accounts for players who work bottom-up,
      // continuing to prompt them in that same direction rather than
      // always redirecting to the overall highest unfilled box. Falls
      // back to the original "highest unfilled overall" search when
      // there's nothing left above (e.g. filling top-down, which
      // produces identical results to the prior behavior in that case).
      const unfilledAboveL = steps.filter(len => len > L && !newGuesses[len]);
      const nextIncomplete = unfilledAboveL.length > 0
        ? Math.min(...unfilledAboveL)
        : [...steps].reverse().find(len => !newGuesses[len]);
      if(isIOS && activeInput) activeInput.blur();
      activeLength = nextIncomplete !== undefined ? nextIncomplete : null;
      render(nextIncomplete !== undefined);
    }

    function tryCommitViaEnter(){
      // Only guarded on iOS - this exists specifically for a known iOS
      // quirk where the physical keyboard or on-screen "Go" button can
      // sometimes fire two separate "Enter was pressed" signals for one
      // real keypress. Desktop doesn't have that issue, so applying this
      // cooldown there could only ever incorrectly swallow a genuine,
      // intentional second Enter press.
      if(isIOS){
        const now = Date.now();
        if(now - lastEnterCommitAt < 700) return; // a duplicate signal for the
                                                   // same keypress - ignore it
        lastEnterCommitAt = now;
      }
      commit(true);
    }

    activeInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); return; }
      if(activeSlotHasUntouchedGuess && (e.key === 'Backspace' || e.key === 'Delete')){
        // This rung already had a complete guess when it was opened, and
        // nothing's been edited yet - clear it fully, matching exactly
        // what the red X button does, rather than a normal character-by-
        // character delete.
        e.preventDefault();
        activeSlotHasUntouchedGuess = false;
        const L = activeLength;
        const currentGuesses = loadGuesses(activeTier);
        delete currentGuesses[L];
        saveGuesses(activeTier, currentGuesses);
        bankState[activeTier] = null;
        activeInput.value = '';
        render(true);
        return;
      }
      if(activeSlotHasUntouchedGuess && e.key.length === 1 && /^[a-zA-Z]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey){
        // Same situation, but the first action is typing a new letter
        // rather than deleting - fully take over this keystroke (rather
        // than letting native typing proceed after a programmatic value
        // change, which can conflict with the browser's own cursor/
        // selection state) so the new guess starts fresh with just this
        // one letter, instead of appending onto the old one still
        // sitting in the box.
        e.preventDefault();
        activeSlotHasUntouchedGuess = false;
        const key = e.key.toLowerCase();
        const allowedCount = finalWord.toLowerCase().split('').filter(ch => ch === key).length;
        if(allowedCount > 0){
          activeInput.value = key;
          if(bankState[activeTier]) bankState[activeTier].usedIndices = [];
          activeInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
        return;
      }
      // Only letters that actually appear in the top (final) word can be
      // typed, and only up to as many times as they actually appear there -
      // this can't guarantee a correct guess, but it stops obviously
      // impossible letters (or too many repeats of a letter, like typing
      // five t's when the final word only has one) from ever being entered.
      if(e.key.length === 1 && /^[a-zA-Z]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey){
        const key = e.key.toLowerCase();
        const allowedCount = finalWord.toLowerCase().split('').filter(ch => ch === key).length;
        if(allowedCount === 0){
          e.preventDefault();
        } else {
          const currentValue = activeInput.value || '';
          const currentCount = currentValue.toLowerCase().split('').filter(ch => ch === key).length;
          if(currentCount >= allowedCount){
            e.preventDefault();
          }
        }
      }
    });
    function sanitizeToAllowedLetters(rawValue, finalWord){
      // Strips out any letter not in the final word, and caps each letter
      // at the exact number of times it's actually allowed to appear there
      // - applied to the resulting value itself rather than trying to
      // block individual keystrokes, since paste, autocorrect, and mobile
      // swipe-typing don't reliably fire normal keydown events per
      // character and can bypass a keystroke-level restriction entirely.
      const allowedCounts = {};
      for(const ch of finalWord.toLowerCase()){
        allowedCounts[ch] = (allowedCounts[ch] || 0) + 1;
      }
      const usedCounts = {};
      let result = '';
      for(const ch of rawValue){
        if(!/^[a-zA-Z]$/.test(ch)) continue;
        const lower = ch.toLowerCase();
        const allowed = allowedCounts[lower] || 0;
        const used = usedCounts[lower] || 0;
        if(used < allowed){
          result += ch;
          usedCounts[lower] = used + 1;
        }
      }
      return result;
    }

    activeInput.addEventListener('input', (e)=>{
      const sanitized = sanitizeToAllowedLetters(activeInput.value, finalWord);
      if(sanitized !== activeInput.value){
        activeInput.value = sanitized;
      }
      if(activeInput.value && activeInput.value.trim() !== ''){
        lastNonEmptyValue = activeInput.value;
      }
      // Keep the bank's tiles in sync live, regardless of whether this
      // keystroke came from the physical keyboard, a tapped tile, or the
      // on-screen backspace button.
      if(bankState[activeTier]){
        const order = bankState[activeTier].order;
        const stableIds = bankState[activeTier].stableIds;
        const arr = bankState[activeTier].usedIndices;
        if(!bankSyncSkip){
          // Genuine keyboard-driven change (typed or backspaced directly) -
          // reconcile the tracked indices to match the new value's length.
          while(arr.length > activeInput.value.length) arr.pop();
          while(arr.length < activeInput.value.length){
            const ch = activeInput.value[arr.length].toLowerCase();
            const usedSet = new Set(arr);
            const idx = order.findIndex((letter, i) => letter.toLowerCase() === ch && !usedSet.has(stableIds[i]));
            if(idx === -1) break;
            arr.push(stableIds[idx]);
          }
        }
        bankSyncSkip = false;
        const usedSet = new Set(arr);
        const tileEls = panel.querySelectorAll('.bank-tile');
        tileEls.forEach((tileEl) => {
          const stableId = Number(tileEl.dataset.stableId);
          if(usedSet.has(stableId)){
            tileEl.classList.add('used');
            tileEl.disabled = true;
          } else {
            tileEl.classList.remove('used');
            tileEl.disabled = false;
          }
        });
      }
      // Mobile keyboards don't always fire a proper keydown for
      // Return/Go on a plain input - but the 'input' event's inputType
      // reliably reflects it when they do commit a line break, so this
      // catches Enter presses that keydown alone might miss. The debounce
      // above keeps this from double-firing alongside keydown for the
      // exact same keypress.
      if(e.inputType === 'insertLineBreak'){ tryCommitViaEnter(); }
      // Auto-commit the moment this slot reaches its required length -
      // the player never actually needs to press Enter/tap submit;
      // reaching the exact length a guess needs is itself the signal
      // that it's ready to be evaluated.
      if(activeInput.value.length === Number(activeInput.maxLength) && activeInput.value.length > 0){
        setTimeout(() => commit(true), 0);
      }
    });
    activeInput.addEventListener('blur', ()=>{
      // Ignore blurs caused by our own re-render tearing down this input,
      // rather than the person genuinely clicking away from the puzzle.
      if(suppressBlurCommit) return;
      if(activeInput.isConnected === false) return;
      commit(false);
    });
  }

  const ladderScroll = document.getElementById('ladder-scroll');
  if(ladderScroll && activeInput){
    let wasFocused = false;
    let refocusTimer = null;
    ladderScroll.addEventListener('touchstart', ()=>{
      wasFocused = document.activeElement === activeInput;
    }, { passive: true });
    ladderScroll.addEventListener('scroll', ()=>{
      if(!wasFocused) return;
      clearTimeout(refocusTimer);
      refocusTimer = setTimeout(()=>{
        if(document.activeElement !== activeInput){
          activeInput.focus({ preventScroll: true });
        }
      }, 120);
    }, { passive: true });
  }

  renderTimerWidget();
  scheduleDailyProgressSync();
}

function switchToTier(newTier){
  const previousTier = activeTier;
  activeTier = newTier;
  if(previousTier !== activeTier) pauseTimer(previousTier);
  localStorage.setItem('letterladder:activeTier', activeTier);
  activeLength = null;
  document.querySelectorAll('.confetti-piece').forEach(piece => piece.remove());
  render(!isTouchDevice);
  showPlayPopupIfNeeded(activeTier, ()=>startTimerIfNeeded(activeTier));
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const tab = e.target.closest('.tab');
  if(!tab) return;
  switchToTier(tab.dataset.tier);
});

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    pauseTimer(activeTier);
    clearTimeout(dailyProgressSyncTimeout);
    syncDailyProgressToCloud();
    syncStatsToCloud(loadStats());
  } else {
    startTimerIfNeeded(activeTier);
    renderTimerWidget();
  }
});
window.addEventListener('pagehide', ()=>{
  pauseTimer(activeTier);
  clearTimeout(dailyProgressSyncTimeout);
  syncDailyProgressToCloud();
  syncStatsToCloud(loadStats());
});

render(!isTouchDevice);
showHowToPlayPopupIfNeeded();
showMigrationWelcomeBannerIfNeeded();
showMigrationLinkBannerIfNeeded();

// Only pulls when the local cache looks genuinely empty (a fresh device
// or browser that's never accumulated any local stats), so this can't
// clobber newer local changes with a potentially stale cloud copy in the
// far more common case of just reloading the same device. Still solves
// the actual cross-device need: signing into a real account on a new
// device correctly pulls its real stats down from the cloud.
async function pullStatsFromCloudIfNeeded(){
  if(!window.LetterLadderAuth) return;
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return;
  try{
    const snap = await window.LetterLadderAuth.getDoc(
      window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'playerStats', user.uid)
    );
    if(!snap.exists()) return;
    const cloudStats = snap.data();
    let localStats;
    try{ localStats = JSON.parse(localStorage.getItem(STATS_KEY) || 'null'); }catch(e){ localStats = null; }
    if(!localStats){
      localStorage.setItem(STATS_KEY, JSON.stringify(cloudStats));
      return;
    }
    const merged = {};
    for(const tier of [...TIERS, 'total']){
      const localTier = localStats[tier] || blankStat();
      const cloudTier = cloudStats[tier] || blankStat();
      // Whichever side has the more recent lastSolvedDate is the
      // genuinely current source of truth for that tier's played/solved/
      // streak - the other side is, by definition, stale for this tier.
      const cloudIsNewer = (cloudTier.lastSolvedDate || '') > (localTier.lastSolvedDate || '');
      const winner = cloudIsNewer ? cloudTier : localTier;
      merged[tier] = {
        played: winner.played || 0,
        solved: winner.solved || 0,
        currentStreak: winner.currentStreak || 0,
        lastSolvedDate: winner.lastSolvedDate || null,
        // A personal-best streak should never regress just because the
        // other device happens to be "more current" right now.
        maxStreak: Math.max(localTier.maxStreak || 0, cloudTier.maxStreak || 0),
      };
    }
    localStorage.setItem(STATS_KEY, JSON.stringify(merged));
  }catch(e){}
}

let ownerCheckDone = false;
(function waitForLetterLadderAuth(attemptsLeft){
  if(attemptsLeft === undefined) attemptsLeft = 100; // ~5 seconds total at 50ms intervals
  if(window.LetterLadderAuth){
    window.LetterLadderAuth.onAuthReady(async () => {
      if(!ownerCheckDone){
        ownerCheckDone = true;
        try{
          const player = window.LetterLadderAuth.getCurrentUser();
          if(player && !player.isAnonymous && accountScope !== 'guest'){
            const ownerKey = `letterladder:${accountScope}:ownerUid`;
            const storedOwnerUid = localStorage.getItem(ownerKey);
            if(storedOwnerUid && storedOwnerUid !== player.uid){
              const prefix = `letterladder:${accountScope}:`;
              const keysToRemove = [];
              for(let i = 0; i < localStorage.length; i++){
                const key = localStorage.key(i);
                if(key && key.startsWith(prefix)) keysToRemove.push(key);
              }
              keysToRemove.forEach(k => localStorage.removeItem(k));
              activeLength = null;
            }
            localStorage.setItem(ownerKey, player.uid);
          }
        }catch(e){}
      }

      renderAccountWidget();

      // If there's a pending email change, check whether it's actually
      // been confirmed yet (the verification link clicked) - Firebase's
      // real account email only updates once that happens, and nothing
      // proactively tells the app when it does. Reloading the user
      // object first ensures this checks the genuinely current email,
      // not a stale cached value from before the link was clicked.
      try{
        const player = window.LetterLadderAuth.getCurrentUser();
        if(player && !player.isAnonymous){
          await player.reload();
          const playerDocSnap = await window.LetterLadderAuth.getDoc(
            window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'players', player.uid)
          );
          if(playerDocSnap.exists()){
            const data = playerDocSnap.data();
            if(data.pendingEmail && player.email === data.pendingEmail){
              await window.LetterLadderAuth.setDoc(
                window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'players', player.uid),
                { recoveryEmail: data.pendingEmail, pendingEmail: null },
                { merge: true }
              );
            }
          }
        }
      }catch(e){}

      pullStatsFromCloudIfNeeded();
      // Backfills the account's cloud timer-choice record from this
      // device's existing local choice, if one was genuinely already
      // made - covers a preference set before this sync feature
      // existed, or a device that's simply never touched the toggle
      // since, so the cloud record naturally catches up over time.
      if(localStorage.getItem(TIMER_CHOICE_MADE_KEY)){
        setTimerChoice(getTimerChoice());
      }
      const restored = await pullDailyProgressFromCloudIfNeeded();
      if(restored){
        rebaselineProgressComparison();
        // activeLength may have been computed during an earlier, empty
        // pre-restore render (pointing at whichever rung looked
        // incomplete at that moment) and, being a persistent variable,
        // would otherwise stay stuck there across this render even
        // though the underlying data just changed - forcing a fresh
        // recalculation against the now-correct, restored guesses.
        activeLength = null;
        render(false);
        renderTimerWidget();

        // The play popup's own check ran earlier, against empty local
        // data, before this restore completed - if it's still showing
        // now that the real, restored data reveals the puzzle was
        // already started or solved, dismiss it exactly as if "Play"
        // had been tapped, rather than leaving a stale prompt on screen
        // for a puzzle that's actually already done.
        const playOverlay = document.querySelector('.play-overlay');
        if(playOverlay && hasEverStartedTimer(activeTier)){
          playOverlay.remove();
          startTimerIfNeeded(activeTier);
        }
      }
    });
  } else if(attemptsLeft > 0){
    setTimeout(() => waitForLetterLadderAuth(attemptsLeft - 1), 50);
  }
  // If it never loads (ad-blocker, offline, etc.), this quietly gives up -
  // the account widget just stays empty rather than polling forever.
})();
if(new URLSearchParams(window.location.search).get('showsignup') === '1'){
  showAccountForm('create');
}
timerTickInterval = setInterval(renderTimerWidget, 1000);

</script>
</body>
</html>
