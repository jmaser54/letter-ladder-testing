<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Letter Ladder — a daily word puzzle game. Grow words one letter at a time.">
<title>Letter Ladder</title>
<link rel="icon" href="og-image.png">
<link rel="apple-touch-icon" href="og-image.png">

<style>
  :root{
    --bg: #1B2A41;
    --bg-panel: #24384F;
    --rung: #F5EFE0;
    --rung-empty: rgba(245,239,224,0.08);
    --ink: #F5EFE0;
    --ink-dim: #9FB3C8;
    --amber: #E8A33D;
    --red: #D9705F;
    --blue: #5B9BD5;
    --green: #6FBF8B;
  }
  *{box-sizing:border-box;}
  html, body{ height: 100%; }
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    min-height: 100svh; /* svh = small viewport height, handles mobile browser chrome correctly */
    display: flex;
    flex-direction: column;
    padding: 20px 16px 12px;
  }

  header{ position: relative; text-align:center; flex-shrink:0; padding-bottom: 0; margin-bottom: 0; }
  .brand-row{
    position: relative;
    font-size: 2.66rem; /* 3.125rem × 0.85 ≈ 2.66rem — 15% smaller than before */
  }
  .brand-title-row{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    padding: 0 48px; /* keeps title text clear of the 32px icons + ~16px gap each side */
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: inherit;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.15;
    /* Lock to two lines at all screen widths by constraining the max-width
       to just under the width of "Letter Ladder" on one line at this font
       size. "Letter" and "Ladder" are similar lengths so they split cleanly. */
    max-width: 5.5ch; /* ~5.5 characters wide forces the break after "Letter" */
    word-break: normal;
  }
  .brand .rung-i{ color: var(--ink); }
  .account-widget{
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center;
  }
  .howto-icon-btn{
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink-dim);
    background: none; color: var(--ink-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 1rem;
    touch-action: manipulation; padding: 0; line-height: 1;
    transition: color 0.15s, border-color 0.15s;
  }
  .howto-icon-btn:hover{ color: var(--amber); border-color: var(--amber); }

  /* Account icon and dropdown — identical to game.html */
  .account-icon-btn{
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; padding: 0;
  }
  .account-icon-btn.has-account{
    background: var(--amber); color: #1B2A41;
    font-family:'Fraunces', serif; font-weight:700; font-size: 1rem;
  }
  .account-icon-btn.is-guest{
    background: rgba(245,239,224,0.12); color: var(--ink-dim);
  }
  .account-icon-btn.is-guest svg{ width: 18px; height: 18px; }
  .account-dropdown{
    position: absolute; top: calc(100% + 8px); left: 0;
    background: var(--bg-panel); border-radius: 12px; padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45); min-width: 180px; z-index: 200;
    text-align: left;
  }
  .account-dropdown-username{
    font-weight: 700; font-size: 0.95rem; color: var(--ink);
    padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid rgba(245,239,224,0.1);
    word-break: break-word;
  }
  .account-dropdown a, .account-dropdown button.dropdown-item{
    display: block; color: var(--ink-dim); text-decoration:none; font-size: 0.88rem;
    padding: 6px 0; touch-action: manipulation;
    background: none; border: none; cursor: pointer; width: 100%; text-align: left;
    font-family: inherit;
  }
  .account-dropdown a:hover, .account-dropdown button.dropdown-item:hover{ color: var(--amber); }

  /* Landing body */
  .landing-body{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 0 40px; /* title→logo gap: 60px. Reduced from 80px to even out distribution */
  }
  .brand-logo{
    width: 76px;
    height: 76px;
    border-radius: 50%;
    flex-shrink: 0;
    display: block;
    margin-bottom: 36px; /* logo→buttons: 36px. Was 48px — now closer to buttons, making title→logo→buttons feel more even */
  }
  .play-buttons{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    max-width: 280px;
  }

  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; cursor:pointer; padding: 12px 18px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color:#1B2A41; }
  .btn-ghost{ background: rgba(245,239,224,0.08); color: var(--ink); }
  /* Play buttons specifically get 15% larger font + slightly more vertical
     padding so the larger text has comfortable room without feeling cramped */
  .play-btn-full{
    width: 100%;
    font-size: 0.99rem;  /* 1.1rem × 0.9 */
    padding: 13px 18px;  /* 14px × 0.9 ≈ 13px */
  }

  .play-date{
    color: var(--ink-dim);
    font-size: 0.89rem;  /* 0.99rem × 0.9 — 10% smaller than button font */
    font-weight: 700;
    letter-spacing: 0.02em;
    text-align: center;
    margin-top: 22px;
  }

  /* How to Play overlay — identical structure to index.html */
  .howto-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.7);
    display:flex; align-items:center; justify-content:center; z-index:500;
    padding: 16px;
  }
  .howto-card{
    background: var(--bg-panel); border-radius:18px; padding: 28px 24px;
    max-width:380px; width:100%; position:relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .howto-card h2{ font-family:'Fraunces',serif; margin-top:0; }
  .howto-card ul{ line-height:1.7; }
  .howto-close{
    position:absolute; top:12px; right:12px;
    background:none; border:none; color:var(--ink-dim); font-size:1.4rem;
    cursor:pointer; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; touch-action:manipulation; padding:0;
  }
  .howto-close:hover{ background: rgba(245,239,224,0.2); }
  .howto-example-word{
    display:inline-block; background: var(--rung-empty);
    border-radius:6px; padding:1px 7px; font-weight:600; font-size:0.9em;
  }

  /* Login/create overlay — reused from index.html */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    display:flex; align-items:center; justify-content:center; z-index:500; padding:16px;
  }
  .leaderboard-prompt-card{
    background: var(--bg-panel); border-radius:18px; padding: 24px 22px;
    max-width:340px; width:100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .leaderboard-form-title{
    font-family:'Fraunces',serif; font-weight:700; font-size:1.1rem;
    margin-bottom:16px; text-align:center;
  }
  .leaderboard-form-field{
    display:block; width:100%; background: rgba(245,239,224,0.08);
    border:none; border-radius:10px; padding:11px 14px;
    color:var(--ink); font-family:inherit; font-size:0.95rem; margin-bottom:10px;
  }
  .leaderboard-form-field:focus{ outline: 2px solid var(--amber); }
  .leaderboard-form-error{
    color:var(--red); font-size:0.85rem; margin-bottom:10px; min-height:18px; text-align:center;
  }
  .leaderboard-form-hint{
    color:var(--ink-dim); font-size:0.8rem; margin-bottom:12px; text-align:center;
  }
  .leaderboard-prompt-actions{ display:flex; flex-direction:column; gap:10px; }
  .leaderboard-prompt-actions button{ width:100%; }
  .leaderboard-prompt-title{
    font-size:1rem; text-align:center; margin:6px 0 20px 0; padding-right:0; font-weight:700;
  }

  footer{ text-align:center; margin-top: 12px; color: var(--ink-dim); flex-shrink:0; padding-bottom: 8px; }
  footer a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); touch-action: manipulation; }
  footer a:hover{ color: var(--amber); border-color: var(--amber); }
  .footer-attribution{ font-size: 0.72rem; line-height: 1.7; opacity: 0.75; margin-bottom: 10px; }
  .footer-attribution p{ margin: 0; }
  .footer-attribution a{ color: var(--ink-dim); border-bottom: 1px dotted rgba(159,179,200,0.5); }
  .footer-nav{ font-size: 0.82rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; }
  .footer-sep{ color: var(--ink-dim); opacity: 0.5; }

  @media(max-width:400px){
    .brand-row{ font-size: 2.26rem; } /* 2.66rem × 0.85 — proportional scale-down */
    .brand-logo{ width: 64px; height: 64px; }
    .landing-body{ padding-top: 48px; }
    .brand-logo{ margin-bottom: 30px; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand-row">
      <div class="brand-title-row">
        <div class="account-widget" id="account-widget"></div>
        <h1 class="brand">Letter Ladder</h1>
        <button type="button" class="howto-icon-btn" id="howto-btn" aria-label="How to play">?</button>
      </div>

  </header>

    <img src="og-image.png" alt="" class="brand-logo">

  </main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ── constants ──────────────────────────────────────────────────────────────
  const TIMER_CHOICE_KEY = 'letterladder:timerChoice';
  const TIMER_CHOICE_MADE_KEY = 'letterladder:timerChoiceMade';
  const BLANK_PERSON_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path></svg>`;

  // ── date display ───────────────────────────────────────────────────────────
  function todayFormatted(){
    const d = new Date();
    return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  }
  document.getElementById('play-date').textContent = todayFormatted();

  // ── navigation helpers ─────────────────────────────────────────────────────
  function goToGame(timerChoice){
    // Set the timer preference before navigating so index.html picks it up
    if(timerChoice !== null){
      localStorage.setItem(TIMER_CHOICE_KEY, timerChoice);
      localStorage.setItem(TIMER_CHOICE_MADE_KEY, '1');
    }
    window.location.href = 'game.html';
  }

  // ── How to Play popup ──────────────────────────────────────────────────────
  function showHowToPlay(){
    const overlay = document.createElement('div');
    overlay.className = 'howto-overlay';
    overlay.innerHTML = `
      <div class="howto-card">
        <button type="button" class="howto-close" aria-label="Close">&times;</button>
        <h2>How to Play</h2>
        <p>Fill in the missing words by adding exactly one letter to the word below. Rearrange the letters as needed to make a new word.</p>
        <ul>
          <li>Words can be guessed in any order</li>
          <li>For example, <span class="howto-example-word">not</span> could become <span class="howto-example-word">tone</span>, <span class="howto-example-word">note</span>, or <span class="howto-example-word">torn</span></li>
          <li>A letter can repeat — <span class="howto-example-word">lead</span> could become <span class="howto-example-word">ladle</span> by adding a second "L"</li>
          <li>Every word must be a real English word</li>
        </ul>
      </div>
    `;
    document.body.appendChild(overlay);
    function close(){ overlay.remove(); }
    overlay.querySelector('.howto-close').addEventListener('click', close);
    overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  }
  document.getElementById('howto-btn').addEventListener('click', showHowToPlay);

  // ── account dropdown ───────────────────────────────────────────────────────
  function closeDropdown(){
    const d = document.querySelector('.account-dropdown');
    if(d) d.remove();
  }

  function renderAccountWidget(user){
    const container = document.getElementById('account-widget');
    const savedUsername = localStorage.getItem('letterladder:accountUsername');
    const hasAccount = !!(user && !user.isAnonymous && savedUsername);

    if(hasAccount){
      const initial = savedUsername.trim().charAt(0).toUpperCase();
      container.innerHTML = `<button type="button" class="account-icon-btn has-account" id="account-icon-btn" aria-label="Account menu">${initial}</button>`;
      container.querySelector('#account-icon-btn').addEventListener('click', ()=>{
        if(document.querySelector('.account-dropdown')){ closeDropdown(); return; }
        const dropdown = document.createElement('div');
        dropdown.className = 'account-dropdown';
        dropdown.innerHTML = `
          <div class="account-dropdown-username">${savedUsername}</div>
          <a href="leaderboard.html">Leaderboard</a>
          <a href="past-puzzles.html">Past puzzles</a>
          <a href="stats.html">Stats</a>
          <a href="profile.html">Profile</a>
          <button type="button" class="dropdown-item" id="logout-btn">Log out</button>
        `;
        container.appendChild(dropdown);
        dropdown.querySelector('#logout-btn').addEventListener('click', async ()=>{
          closeDropdown();
          await signOut(auth);
          localStorage.removeItem('letterladder:accountUsername');
          localStorage.removeItem('letterladder:timerChoiceMade');
          localStorage.removeItem('letterladder:timerChoice');
          localStorage.removeItem('letterladder:activeTier');
          localStorage.removeItem('letterladder:lastViewedDateKey');
          const guestPrefix = 'letterladder:guest:';
          const toRemove = [];
          for(let i = 0; i < localStorage.length; i++){
            const k = localStorage.key(i);
            if(k && k.startsWith(guestPrefix)) toRemove.push(k);
          }
          toRemove.forEach(k => localStorage.removeItem(k));
          window.location.reload();
        });
        setTimeout(()=>{
          document.addEventListener('click', function outside(e){
            if(!container.contains(e.target)){ closeDropdown(); document.removeEventListener('click', outside); }
          });
        }, 0);
      });
    } else {
      container.innerHTML = `<button type="button" class="account-icon-btn is-guest" id="account-icon-btn" aria-label="Create account or log in">${BLANK_PERSON_ICON}</button>`;
      container.querySelector('#account-icon-btn').addEventListener('click', ()=>{
        if(document.querySelector('.account-dropdown')){ closeDropdown(); return; }
        const dropdown = document.createElement('div');
        dropdown.className = 'account-dropdown';
        dropdown.innerHTML = `
          <a href="leaderboard.html">Leaderboard</a>
          <a href="past-puzzles.html">Past puzzles</a>
          <a href="#" id="dd-create">Create account</a>
          <a href="#" id="dd-login">Log in</a>
        `;
        container.appendChild(dropdown);
        dropdown.querySelector('#dd-create').addEventListener('click', e=>{ e.preventDefault(); closeDropdown(); showAuthForm('create'); });
        dropdown.querySelector('#dd-login').addEventListener('click', e=>{ e.preventDefault(); closeDropdown(); showAuthForm('login'); });
        setTimeout(()=>{
          document.addEventListener('click', function outside(e){
            if(!container.contains(e.target)){ closeDropdown(); document.removeEventListener('click', outside); }
          });
        }, 0);
      });
    }
  }

  // ── auth form (login / create account) ────────────────────────────────────
  function showAuthForm(mode){
    const isLogin = mode === 'login';
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="leaderboard-prompt-card">
        <div class="leaderboard-form-title">${isLogin ? 'Log in' : 'Create account'}</div>
        <div class="leaderboard-form-error" id="auth-error"></div>
        <input type="text" class="leaderboard-form-field" id="auth-username" placeholder="Username" autocomplete="username">
        <input type="password" class="leaderboard-form-field" id="auth-password" placeholder="Password" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
        ${!isLogin ? `
          <input type="email" class="leaderboard-form-field" id="auth-email" placeholder="Email (optional)" autocomplete="email">
          <div class="leaderboard-form-hint">Your email will only be used for password recovery purposes.</div>
        ` : ''}
        <div class="leaderboard-prompt-actions">
          <button type="button" class="btn-primary" id="auth-submit">${isLogin ? 'Log in' : 'Create account'}</button>
          <button type="button" class="btn-ghost" id="auth-cancel">Cancel</button>
        </div>
        ${isLogin ? `<a href="#" id="auth-forgot" style="display:block;text-align:center;margin-top:12px;font-size:0.82rem;color:var(--ink-dim);">Forgot password?</a>` : ''}
      </div>
    `;
    document.body.appendChild(overlay);

    overlay.querySelector('#auth-cancel').addEventListener('click', ()=> overlay.remove());

    overlay.querySelector('#auth-submit').addEventListener('click', async ()=>{
      const errorEl = overlay.querySelector('#auth-error');
      const username = overlay.querySelector('#auth-username').value.trim();
      const password = overlay.querySelector('#auth-password').value;
      errorEl.textContent = '';
      if(!username || !password){ errorEl.textContent = 'Please fill in both fields.'; return; }

      // Reuse index.html's LetterLadderAuth if available (same session),
      // otherwise fall back to direct Firebase calls via a page reload.
      // Since landing.html is a separate page, we navigate to index.html
      // with a flag so the user is prompted there. For simplicity and
      // to avoid duplicating the full auth logic, we pass the credentials
      // via sessionStorage to index.html which picks them up on load.
      // Actually the cleaner approach: load index.html which runs the auth
      // module, and use the existing showAccountForm flow. But since we
      // want the user fully logged in before reaching the game, we do the
      // auth directly here using the same Firebase SDK we already imported.
      try{
        const { getFirestore, collection, query, where, getDocs, setDoc, doc } =
          await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        const { createUserWithEmailAndPassword, signInWithEmailAndPassword } =
          await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");

        const db = getFirestore(app);

        function normalizeUsername(u){ return u.toLowerCase().trim(); }
        function usernameToSyntheticEmail(u){ return `${normalizeUsername(u)}@letterladder.user`; }

        async function findPlayerByUsername(u){
          const q = query(collection(db, 'players'), where('usernameLower', '==', normalizeUsername(u)));
          const snap = await getDocs(q);
          if(snap.empty) return null;
          const d = snap.docs[0];
          return { uid: d.id, ...d.data() };
        }

        if(isLogin){
          const player = await findPlayerByUsername(username);
          const registeredEmail = (player && player.authEmail) || usernameToSyntheticEmail(username);
          await signInWithEmailAndPassword(auth, registeredEmail, password);
          localStorage.setItem('letterladder:accountUsername', player ? player.username : username);
          overlay.remove();
          renderPlayButtons(auth.currentUser);
          renderAccountWidget(auth.currentUser);
        } else {
          // Validate username
          const BANNED = ['fuck','bitch','bastard','cunt','kike','nigger','nigga','asshole','faggot'];
          const lower = username.toLowerCase();
          if(username.length > 20){ errorEl.textContent = 'Username must be 20 characters or fewer.'; return; }
          if(BANNED.some(b => lower.includes(b))){ errorEl.textContent = 'Please choose a different username.'; return; }
          const existing = await findPlayerByUsername(username);
          if(existing){ errorEl.textContent = 'That username is already taken.'; return; }

          const email = (overlay.querySelector('#auth-email') || {}).value || '';
          const trimmedEmail = email.trim();
          const registeredEmail = trimmedEmail || usernameToSyntheticEmail(username);
          const cred = await createUserWithEmailAndPassword(auth, registeredEmail, password);
          const playerDoc = {
            username: username.trim(),
            usernameLower: normalizeUsername(username),
            createdAt: Date.now(),
            authEmail: registeredEmail,
          };
          await setDoc(doc(db, 'players', cred.user.uid), playerDoc);
          if(trimmedEmail){
            await setDoc(doc(db, 'playerRecovery', cred.user.uid), { recoveryEmail: trimmedEmail });
          }
          localStorage.setItem('letterladder:accountUsername', username.trim());
          overlay.remove();
          renderPlayButtons(cred.user);
          renderAccountWidget(cred.user);
        }
      }catch(err){
        const msg = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password'
          ? 'Incorrect username or password.'
          : err.code === 'auth/email-already-in-use'
          ? 'That username is already taken.'
          : err.message || 'Something went wrong. Please try again.';
        overlay.querySelector('#auth-error').textContent = msg;
      }
    });

    if(isLogin){
      overlay.querySelector('#auth-forgot').addEventListener('click', async e=>{
        e.preventDefault();
        const username = overlay.querySelector('#auth-username').value.trim();
        if(!username){ overlay.querySelector('#auth-error').textContent = 'Enter your username first.'; return; }
        try{
          const { sendPasswordResetEmail } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
          const { getFirestore, collection, query, where, getDocs } =
            await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
          const db = getFirestore(app);
          function normalizeUsername(u){ return u.toLowerCase().trim(); }
          const q = query(collection(db, 'players'), where('usernameLower', '==', normalizeUsername(username)));
          const snap = await getDocs(q);
          if(snap.empty){ overlay.querySelector('#auth-error').textContent = 'No recovery email on file for that username.'; return; }
          const uid = snap.docs[0].id;
          const recoverySnap = await getDoc(doc(db, 'playerRecovery', uid));
          if(!recoverySnap.exists() || !recoverySnap.data().recoveryEmail){
            overlay.querySelector('#auth-error').textContent = 'No recovery email on file for that username.'; return;
          }
          await sendPasswordResetEmail(auth, recoverySnap.data().recoveryEmail);
          overlay.querySelector('#auth-error').style.color = 'var(--green)';
          overlay.querySelector('#auth-error').textContent = 'Check your email for a reset link.';
        }catch(e){
          overlay.querySelector('#auth-error').textContent = 'Something went wrong. Please try again.';
        }
      });
    }
  }

  // ── play buttons ───────────────────────────────────────────────────────────
  function renderPlayButtons(user){
    const hasAccount = !!(user && !user.isAnonymous && localStorage.getItem('letterladder:accountUsername'));
    const container = document.getElementById('play-buttons');

    if(hasAccount){
      // Logged-in: single Play button, respects saved timer preference
      container.innerHTML = `<button type="button" class="btn-primary play-btn-full" id="play-btn">Play</button>`;
      container.querySelector('#play-btn').addEventListener('click', ()=> goToGame(null));
    } else {
      // Logged-out: must choose timer before entering
      container.innerHTML = `
        <button type="button" class="btn-primary play-btn-full" id="play-timed-btn">Play with timer</button>
        <button type="button" class="btn-ghost play-btn-full" id="play-untimed-btn">Play without timer</button>
      `;
      container.querySelector('#play-timed-btn').addEventListener('click', ()=> goToGame('timed'));
      container.querySelector('#play-untimed-btn').addEventListener('click', ()=> goToGame('untimed'));
    }
  }

  // ── auth state ─────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, (user)=>{
    renderAccountWidget(user);
    renderPlayButtons(user);

    // GA4 user_id
    try{
      if(user && typeof gtag !== 'undefined'){
        gtag('config', 'GTM-K8X9ZNZP', { user_id: user.uid });
      }
    }catch(e){}
  });
</script>
</body>
</html>
