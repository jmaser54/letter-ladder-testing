<style>
  :root{
    --bg: #1B2A41;
    --bg-panel: #24384F;
    --rung: #F5EFE0;
    --rung-empty: rgba(245,239,224,0.08);
    --ink: #F5EFE0;
    --ink-dim: #9FB3C8;
    --amber: #E8A33D;
    --red: #D9705F;
    --blue: #5B9BD5;
    --green: #6FBF8B;
  }
  *{box-sizing:border-box;}
  html, body{ height: 100%; }
  body{
    margin:0;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap{
    max-width: 560px; margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px 16px 12px;
  }

  header{ position: relative; text-align:center; margin-bottom: 12px; flex-shrink:0; }
  .brand-row{
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    font-size: 2rem;
  }
  .brand{
    grid-column: 2;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: inherit;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand-logo{
    grid-column: 1;
    justify-self: end;
    width: 1em;
    height: 1em;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .brand .rung-i{ color: var(--amber); }
  .top-links{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 16px; margin-top:6px; font-size: 0.8rem;
  }
  .top-links a{ color: var(--ink-dim); text-decoration:none; border-bottom: 1px dotted var(--ink-dim); touch-action: manipulation; }
  .top-links a:hover{ color: var(--amber); border-color: var(--amber); }
  .top-links .logo-link{ display:inline-flex; align-items:center; border-bottom:none; line-height:0; }
  .top-links .logo-link svg{ display:block; border-radius:50%; transition:opacity 0.15s ease; }
  .top-links .logo-link:hover svg{ opacity:0.8; }

  .date-row{
    text-align:center; color: var(--ink-dim); font-size: 0.8rem; margin-bottom: 10px;
    letter-spacing: 0.03em; text-transform: uppercase; flex-shrink:0;
  }

  .tabs{
    display:flex; background: rgba(0,0,0,0.2); border-radius: 999px; padding: 4px; margin-bottom: 14px;
    flex-shrink:0;
  }
  .tab{
    flex:1; text-align:center; padding: 9px 0; border-radius: 999px; cursor:pointer;
    font-weight:600; font-size:0.9rem; color: var(--ink-dim); transition: all 0.15s ease;
    user-select:none;
  }
  .tab.active{ background: var(--amber); color: #1B2A41; }
  .tab .dot{ display:none; }

  .panel{
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }


  .ladder-scroll{
    /* No longer its own internal scroll region - the whole page scrolls
       naturally now via the browser's own scrollbar, which handles the
       on-screen keyboard correctly without any custom viewport math. */
    padding: 2px 2px;
  }
  .ladder{
    display:flex; flex-direction:column; align-items:center; gap: var(--rung-gap, 10px);
    position: relative;
    padding: 10px 30px;
    margin: 0 auto;
    width: -webkit-fit-content;
    width: fit-content;
  }

  @keyframes fade-away{
    0%{ opacity:1; }
    100%{ opacity:0; }
  }
  .ladder.fading-out{
    animation: fade-away 0.92s ease-in forwards;
  }

  .rung-row{
    display:grid; grid-template-columns: 22px 1fr 22px; align-items:center; column-gap:12px; width:100%;
    position: relative;
  }
  .rung-row > .rung{ justify-self: center; }
  .rung-count{ width: 22px; text-align:right; color: var(--ink-dim); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  .delete-guess-btn{
    width: 24px; height: 38px;
    border: none; background: none;
    color: #FF5A45;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items:center; justify-content:center;
    padding: 0;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  .delete-guess-btn:hover{ filter: brightness(1.15); }
  .delete-guess-btn:active{ transform: scale(0.85); }
  .rung{
    font-family:'Fraunces', serif;
    font-size: var(--rung-font, 1.35rem);
    font-weight:600;
    letter-spacing: 0.05em;
    background: var(--rung);
    color: #1B2A41;
    height: var(--rung-height, 50px);
    line-height: var(--rung-height, 50px);
    padding: 0 18px;
    border-radius: 10px;
    text-align:center;
    text-transform: uppercase;
    box-sizing: border-box;
  }
  .rung.empty{
    background: var(--rung-empty);
    color: var(--ink-dim);
    border: 1.5px dashed rgba(245,239,224,0.25);
  }
  .rung.anchor{ background: var(--amber); }
  .rung.clickable{ cursor: pointer; transition: filter 0.1s ease, transform 0.1s ease; }
  .rung.clickable:hover{ filter: brightness(1.08); }
  .rung.clickable:active{ transform: scale(0.97); }
  input.rung-input{
    border: none;
    outline: none;
    box-shadow: 0 0 0 2px var(--amber);
    box-sizing: border-box;
    min-width: 0;
    transform: scaleX(1.06);
  }

  /* Ladders get taller the more rungs a puzzle has, so these tiers shrink
     things down automatically to keep long puzzles more compact - short
     puzzles stay at full comfortable size. Combined with the scrollable
     ladder area above, a puzzle that still doesn't fully fit (rare - only
     the longest puzzles on the smallest screens) simply scrolls within its
     own little area instead of taking over the whole page. */
  .panel.rungs-md{ --rung-font: 1.15rem; --rung-height: 44px; --rung-minw: 115px; --rung-gap: 6px; }
  .panel.rungs-lg{ --rung-font: 1rem; --rung-height: 39px; --rung-minw: 100px; --rung-gap: 5px; }
  .panel.rungs-xl{ --rung-font: 0.9rem; --rung-height: 35px; --rung-minw: 88px; --rung-gap: 4px; }


  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.95rem;
    border:none; border-radius:10px; cursor:pointer; padding: 12px 18px;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--amber); color:#1B2A41; }
  .btn-ghost{ background: rgba(245,239,224,0.08); color: var(--ink); }
  #hint-btn{ display:inline-flex; align-items:center; justify-content:center; padding: 10px 14px; }

  .feedback{ margin-top:8px; text-align:center; font-weight:600; min-height: 14px; flex-shrink:0; }
  .feedback.win, .feedback.ok{ text-align:center; }
  .error-list{ list-style:none; margin: 12px 0 0; padding:0; text-align:left; display:inline-block; }
  .error-list li{ position:relative; padding-left:18px; margin-bottom:6px; font-weight:600; color: var(--red); font-size:0.9rem; }
  .error-list li::before{ content:"●"; color: var(--red); position:absolute; left:0; font-size:0.6rem; top:5px; }
  .error-list-wrap{ display:flex; justify-content:center; }
  .feedback.win{ color: var(--amber); font-weight: 700; }
  .feedback.error{ color: var(--red); }
  .feedback.ok{ color: var(--ink-dim); font-weight:500; }
  .details{ margin-top:4px; text-align:center; font-size:0.8rem; color: var(--red); font-style:italic; }

  .letter-bank{
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .bank-tiles{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 100%;
  }
  .bank-tile{
    width: 48px; height: 48px;
    border: none; border-radius: 10px;
    background: var(--rung);
    color: #1B2A41;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.3rem;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .bank-tile.from-below{ background: var(--amber); }
  .bank-tile:active{ transform: scale(0.9); }
  .bank-tile{ touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; } /* prevents the browser's own touch-scroll AND text-selection highlight from fighting the hold-and-drag gesture */
  .bank-tile.dragging{
    position: relative;
    z-index: 50;
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    transition: none;
    scale: 1.3;
    animation: tile-jiggle 0.15s ease-in-out infinite;
  }
  @keyframes tile-jiggle{
    0%, 100%{ rotate: -5deg; }
    50%{ rotate: 5deg; }
  }
  .bank-tile.used{
    background: rgba(245,239,224,0.08);
    color: var(--ink-dim);
    opacity: 0.4;
    cursor: default;
  }
  .bank-tile-placeholder{
    width: 48px; height: 48px;
    border: 2px dashed rgba(245,239,224,0.2);
    border-radius: 10px;
    background: transparent;
    box-sizing: border-box;
  }
  .bank-controls{
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin-top: 22px;
  }
  .bank-ctrl-btn{
    width: 46px; height: 46px;
    border: none; border-radius: 10px;
    background: rgba(245,239,224,0.08);
    color: var(--ink);
    font-size: 1.5rem;
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .bank-ctrl-btn:active{ transform: scale(0.92); }
  .bank-ctrl-btn.kb-on{ background: var(--bg); color: var(--ink); }
  .bank-ctrl-btn.bank-submit-btn{ background: var(--amber); color: #1B2A41; }
  .bank-ctrl-btn.bank-group-spacer{ margin-left: 14px; }

  .bank-primary-actions{
    display: flex; gap: 14px;
    align-items: center;
    max-width: 100%;
    margin-top: 0;
    margin-bottom: 8px;
  }
  .clear-hint-text{
    color: var(--ink-dim);
    font-size: 0.88rem;
    line-height: 1.3;
  }
  .bank-primary-btn{
    flex: 1;
    height: 39px;
    border: none; border-radius: 12px;
    background: rgba(245,239,224,0.08);
    color: var(--ink);
    display: flex; align-items:center; justify-content:center;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .bank-primary-btn:active{ transform: scale(0.96); }
  .bank-primary-btn.bank-submit-btn{ background: var(--amber); color: #1B2A41; }

  .actions-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px; margin-top:8px; margin-bottom:8px; flex-shrink:0; }
  #next-puzzle-btn, #share-btn{ font-size: 0.95rem; padding: 12px 21px; }
  .hint-display{
    text-align:center; margin-top:6px; margin-bottom:8px; font-size:0.85rem; color: var(--ink-dim);
    font-style:italic; flex-shrink:0; min-height: 0;
  }
  .hint-display .hint-letters{ color: var(--amber); font-style:normal; font-weight:600; letter-spacing:0.04em; }
  .share-status{ text-align:center; margin-top:8px; font-size:0.8rem; color: var(--blue); font-weight:600; flex-shrink:0; }

  .view-solution-link{
    display:table; margin: 8px auto 8px auto;
    font-size:0.88rem; color: var(--ink-dim); text-decoration:none;
    border-bottom: 1px dotted var(--ink-dim);
    touch-action: manipulation;
  }
  .view-solution-link:hover{ color: var(--amber); border-color: var(--amber); }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 30px 0; }

  .confirm-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .play-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.75);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .play-card{
    background: var(--bg-panel); border-radius: 20px; padding: 36px;
    width: min(90vw, 580px); height: min(78vh, 480px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items:center; justify-content:center; gap: 28px;
  }
  .play-prompt-text{
    font-family:'Fraunces',serif; font-weight:700; color: var(--ink);
    font-size: 2.04rem; text-align: center; line-height: 1.1;
  }
  .play-btn-big{
    font-family:'Fraunces',serif; font-weight:700; font-size: 1.36rem;
    background: var(--amber); color: #1B2A41; border: none; border-radius: 10px;
    padding: 15px 40px; cursor: pointer; touch-action: manipulation;
  }
  .play-btn-big:hover{ filter: brightness(1.05); }
  .confirm-card{
    background: var(--bg-panel); border-radius: 16px; padding: 24px 22px;
    max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .confirm-message{ font-size: 1rem; margin-bottom: 20px; text-align:center; }
  .confirm-submessage{ font-size: 0.82rem; color: var(--ink-dim); margin-top: 8px; }
  .confirm-actions{ display:flex; gap:10px; justify-content:center; }
  .confirm-actions button{ flex:1; }
  .leaderboard-prompt-card{
    background: var(--bg-panel); border-radius: 16px; padding: 24px 22px;
    max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
  }
  .leaderboard-prompt-dismiss{
    position: absolute; top: 9px; right: 14px;
    font-size: 0.748rem; color: var(--ink-dim); cursor: pointer;
    text-decoration: none;
    touch-action: manipulation;
  }
  .leaderboard-prompt-dismiss:hover{ color: var(--amber); }
  .leaderboard-prompt-title{ font-size: 1rem; text-align:center; margin: 6px 0 20px 0; padding-right: 60px; }
  .leaderboard-form-title{ font-family:'Fraunces', serif; font-weight:700; font-size: 1.1rem; text-align:left; margin: 6px 0 16px 0; }
  .leaderboard-prompt-actions{ display:flex; flex-direction:column; gap:10px; }
  .leaderboard-prompt-actions button{ width:100%; }
  .leaderboard-form-field{
    display:block; width:100%; box-sizing:border-box; margin-bottom:10px;
    padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(245,239,224,0.15);
    background: rgba(245,239,224,0.06); color: var(--ink); font-size: 0.95rem;
  }
  .leaderboard-form-error{ color: #E27272; font-size: 0.82rem; margin-bottom: 10px; min-height: 1.1em; }
  .leaderboard-form-hint{ color: var(--ink-dim); font-size: 0.76rem; margin: -6px 0 12px 0; }

  .howto-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .howto-card{
    position: relative;
    background: var(--bg-panel); border-radius: 18px; padding: 26px 24px;
    max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .howto-card h2{ font-family:'Fraunces',serif; margin-top:0; }
  .howto-card ul{ line-height:1.7; }
  .howto-close{
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(245,239,224,0.1); color: var(--ink);
    font-size: 1.1rem; line-height: 1; cursor: pointer;
    display: flex; align-items:center; justify-content:center;
  }
  .howto-close:hover{ background: rgba(245,239,224,0.2); }
  .howto-example-word{
    font-family:'Fraunces',serif; background: var(--rung); color:#1B2A41;
    padding: 2px 8px; border-radius:6px; font-weight:600; text-transform: uppercase;
    display: inline-block; margin: 3px 0; line-height: 1.4;
  }

  .timer-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .timer-card{
    background: var(--bg-panel); border-radius: 18px; padding: 26px 24px;
    max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .timer-card h2{ font-family:'Fraunces',serif; margin-top:0; margin-bottom: 10px; }
  .timer-card p{ color: var(--ink-dim); font-size: 0.9rem; margin-bottom: 20px; }
  .timer-choice-actions{ display:flex; gap:10px; }
  .timer-choice-actions button{
    flex:1; border:none; border-radius:10px; padding:12px 10px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.9rem;
    background: rgba(245,239,224,0.1); color: var(--ink);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .timer-choice-actions button:hover{ background: var(--amber); color: #1B2A41; }

  .timer-widget{
    position: absolute; bottom: 0; right: 0;
  }
  .hint-time-penalty-indicator{
    position: absolute; bottom: -20px; right: 0;
    font-family:'Fraunces',serif; font-weight:700; font-variant-numeric: tabular-nums;
    color: var(--amber); font-size: 0.8rem;
  }
  .account-widget{
    position: absolute; bottom: 0; left: 0;
  }
  .account-icon-btn{
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; padding: 0;
  }
  .account-icon-btn.has-account{
    background: var(--amber); color: #1B2A41;
    font-family:'Fraunces', serif; font-weight:700; font-size: 1rem;
  }
  .account-icon-btn.is-guest{
    background: rgba(245,239,224,0.12); color: var(--ink-dim);
  }
  .account-icon-btn.is-guest svg{ width: 18px; height: 18px; }
  .account-dropdown{
    position: absolute; top: calc(100% + 8px); left: 0;
    background: var(--bg-panel); border-radius: 12px; padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.45); min-width: 180px; z-index: 200;
    text-align: left;
  }
  .account-dropdown-username{
    font-weight: 700; font-size: 0.95rem; color: var(--ink);
    padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid rgba(245,239,224,0.1);
    word-break: break-word;
  }
  .account-dropdown a{
    display: block; color: var(--ink-dim); text-decoration:none; font-size: 0.88rem;
    padding: 6px 0; touch-action: manipulation;
  }
  .account-dropdown a:hover{ color: var(--amber); }
  .timer-widget-btn{
    position: relative;
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 6px;
    font-family:'Fraunces',serif; font-weight:700; font-variant-numeric: tabular-nums;
    color: var(--amber); font-size: 0.95rem;
  }
  .timer-emoji{ font-size: 0.9em; line-height: 1; }
  .timer-display{ min-width: 2.4em; text-align: left; }
  .timer-tooltip{
    position: absolute; top: 100%; right: 0; margin-top: 6px;
    background: var(--bg-panel); color: var(--ink);
    font-family:'Inter',sans-serif; font-weight:600; font-size: 0.72rem;
    padding: 6px 10px; border-radius: 8px; white-space: nowrap;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.15s ease;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    z-index: 50;
  }
  .timer-widget-btn:hover .timer-tooltip{
    opacity: 1; visibility: visible;
    transition-delay: 1s;
  }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signInAnonymously, signOut, onAuthStateChanged, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, addDoc,
    query, where, orderBy, limit, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Firebase's email/password auth genuinely needs an email as the account
  // identifier - there's no native username-only option. Rather than ever
  // showing the player an email field, a chosen username is quietly turned
  // into a synthetic, never-displayed email behind the scenes. Firebase's
  // own built-in "no two accounts can share an email" enforcement then
  // transparently doubles as username-uniqueness checking, with nothing
  // extra needed to build that ourselves.
  function usernameToSyntheticEmail(username){
    const normalized = username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
    return `${normalized}@players.letterladder.io`;
  }
  function normalizeUsername(username){
    return username.trim().toLowerCase().replace(/[^a-z0-9_.-]/g, '');
  }
  async function findPlayerByUsername(username){
    const q = query(collection(db, 'players'), where('usernameLower', '==', normalizeUsername(username)));
    const snap = await getDocs(q);
    if(snap.empty) return null;
    const docSnap = snap.docs[0];
    return { uid: docSnap.id, ...docSnap.data() };
  }

  // Firebase's raw error codes and messages talk about "email" throughout,
  // which would be confusing/wrong to show directly given the disguise -
  // this translates the ones a player could realistically hit into
  // messages that talk about usernames instead.
  function friendlyAuthError(error){
    const code = error && error.code;
    if(code === 'auth/email-already-in-use') return 'That username is already taken - try another.';
    if(code === 'auth/invalid-email') return 'That username has characters that aren\'t allowed - try letters and numbers only.';
    if(code === 'auth/weak-password') return 'Password should be at least 6 characters.';
    if(code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Username or password is incorrect.';
    if(code === 'auth/too-many-requests') return 'Too many attempts - please wait a moment and try again.';
    return 'Something went wrong. Please try again.';
  }

  const BANNED_USERNAME_SUBSTRINGS = [
    'fuck', 'bitch', 'bastard', 'cunt', 'kike', 'nigger', 'nigga', 'asshole', 'faggot',
  ];

  async function createAccount(username, password, recoveryEmail){
    const trimmedUsername = username.trim();
    if(trimmedUsername.length > 20){
      return { success: false, error: 'Username must be 20 characters or fewer.' };
    }
    const lowerUsername = trimmedUsername.toLowerCase();
    if(BANNED_USERNAME_SUBSTRINGS.some(word => lowerUsername.includes(word))){
      return { success: false, error: 'Please choose a different username.' };
    }
    try{
      const trimmedEmail = recoveryEmail && recoveryEmail.trim();
      // If a real email was provided, register the actual Firebase account
      // under that email directly - this is what makes Firebase's own,
      // genuine password-reset email actually reach them, since Firebase
      // always sends it to whatever email is genuinely registered on the
      // account. Without one, there's no real inbox to deliver a reset
      // link to, so that account falls back to the synthetic,
      // un-recoverable email as before.
      const registeredEmail = trimmedEmail || usernameToSyntheticEmail(username);
      const cred = await createUserWithEmailAndPassword(auth, registeredEmail, password);
      // Store the player's real, human-chosen username alongside their
      // account, plus a lowercased copy for case-insensitive lookups (the
      // synthetic-email path got this for free by always lowercasing;
      // this keeps that same behavior now that login may need to look
      // this record up directly instead of just computing an email).
      const playerDoc = {
        username: username.trim(),
        usernameLower: normalizeUsername(username),
        createdAt: Date.now(),
      };
      if(trimmedEmail) playerDoc.recoveryEmail = trimmedEmail;
      await setDoc(doc(db, 'players', cred.user.uid), playerDoc);
      return { success: true, uid: cred.user.uid, username: username.trim() };
    }catch(error){
      return { success: false, error: friendlyAuthError(error) };
    }
  }

  async function login(username, password){
    try{
      const player = await findPlayerByUsername(username);
      // If this username has a real registered email on file, that's what
      // the account actually needs to sign in with - otherwise (unknown
      // username, or a known one that never provided an email) fall back
      // to the deterministic synthetic formula, which correctly covers
      // both those cases the same way account creation would have.
      const registeredEmail = (player && player.recoveryEmail) || usernameToSyntheticEmail(username);
      const cred = await signInWithEmailAndPassword(auth, registeredEmail, password);
      return { success: true, uid: cred.user.uid, username: (player && player.username) || username.trim() };
    }catch(error){
      return { success: false, error: friendlyAuthError(error) };
    }
  }

  async function requestPasswordReset(username){
    try{
      const player = await findPlayerByUsername(username);
      if(!player || !player.recoveryEmail){
        return { success: false, error: 'No recovery email is on file for that username.' };
      }
      await sendPasswordResetEmail(auth, player.recoveryEmail);
      return { success: true };
    }catch(error){
      return { success: false, error: 'Something went wrong. Please try again.' };
    }
  }

  async function playAsGuest(){
    try{
      const cred = await signInAnonymously(auth);
      return { success: true, uid: cred.user.uid, isGuest: true };
    }catch(error){
      return { success: false, error: friendlyAuthError(error) };
    }
  }

  async function logOut(){
    await signOut(auth);
  }

  // Writes one completed-puzzle score as a new document, structured so
  // the leaderboard display (a later phase) can query "every score for
  // this exact puzzle date + tier, sorted fastest first."
  async function submitScore({ date, tier, timeMs, hintsUsed, displayName }){
    try{
      const user = auth.currentUser;
      const scoreData = {
        date, tier, timeMs, hintsUsed, displayName,
        uid: user ? user.uid : null,
        isGuest: !user || user.isAnonymous,
        createdAt: Date.now(),
      };
      if(user && !user.isAnonymous){
        // Deterministic ID per (uid, date, tier) - this is what actually
        // prevents duplicate leaderboard entries for the same person's
        // same puzzle, no matter how many separate sessions or devices
        // submit it. A later submission correctly overwrites an earlier
        // one for the same puzzle, rather than creating a second entry.
        await setDoc(doc(db, 'scores', `${user.uid}_${date}_${tier}`), scoreData);
      } else {
        // Guests have no persistent identity to deduplicate against, so
        // they keep the previous auto-ID behavior unchanged.
        await addDoc(collection(db, 'scores'), scoreData);
      }
      return { success: true };
    }catch(error){
      return { success: false, error: 'Could not save your score right now.' };
    }
  }

  // Exposed on window since this lives in its own ES module scope,
  // separate from the game's main (non-module) script.
  window.LetterLadderAuth = {
    createAccount, login, playAsGuest, logOut, submitScore, requestPasswordReset,
    getCurrentUser: () => auth.currentUser,
    onAuthReady: (callback) => onAuthStateChanged(auth, callback),
    db, doc, setDoc, getDoc, collection, query, where, orderBy, limit, getDocs,
  };
</script>

<script>
// ---------- date helpers ----------
function bumpGuessCount(tier, L){
  const key = `letterladder:${accountScope}:${dateKey}:${tier}:guessCount:${L}`;
  const current = Number(localStorage.getItem(key) || 0);
  localStorage.setItem(key, String(current + 1));
  return current + 1;
}
function getTotalGuessCount(tier){
  let total = 0;
  const prefix = `letterladder:${accountScope}:${dateKey}:${tier}:guessCount:`;
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(prefix)) total += Number(localStorage.getItem(key) || 0);
  }
  return total;
}

function getPlayerId(){
  const key = 'letterladder:playerId';
  let id = localStorage.getItem(key);
  if(!id){
    id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `p-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    localStorage.setItem(key, id);
  }
  return id;
}

function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
function resolveDateKey(){
  // Supports "Past Puzzles" archive play via ?archive=YYYY-MM-DD. Only
  // ever accepts a date that's both a real scheduled puzzle AND strictly
  // before today - never today's own date (that's just the real game) and
  // never a future date (which would leak an upcoming puzzle early).
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('archive');
  const today = todayKey();
  if(requested && /^\d{4}-\d{2}-\d{2}$/.test(requested) && requested < today
     && PUZZLE_SCHEDULE && PUZZLE_SCHEDULE[requested]){
    return { key: requested, isArchive: true };
  }
  return { key: today, isArchive: false };
}

// ---------- game logic (ported from the original Flask app.py) ----------
function counter(str){
  const c = {};
  for(const ch of str) c[ch] = (c[ch]||0)+1;
  return c;
}
function timesText(n){
  if(n === 1) return 'once';
  if(n === 2) return 'twice';
  return `${n} times`;
}
// Tapping a button while a box is focused would otherwise blur that
// input first, which triggers commit() and can close/reset the box
// before this button's own action gets a chance to run. The fix is to
// run the action directly inside touchend (with preventDefault to stop
// the blur), not in a separate click listener - preventDefault on a
// touch event can silently suppress the click that would otherwise
// follow it, which is what broke this whole class of button on mobile.
function bindTapAction(el, action){
  let firedViaTouch = false;
  el.addEventListener('touchend', (e)=>{
    e.preventDefault();
    firedViaTouch = true;
    action();
  });
  el.addEventListener('mousedown', (e)=> e.preventDefault());
  el.addEventListener('click', ()=>{
    if(firedViaTouch){ firedViaTouch = false; return; }
    action();
  });
}

// Lets Enter submit a form from any of its input fields, by triggering
// the same submit button's click handler - avoids duplicating submit
// logic separately for keyboard vs. mouse/touch across every form.
function bindEnterToSubmit(inputEls, submitBtnEl){
  inputEls.forEach(inputEl => {
    if(!inputEl) return;
    inputEl.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        submitBtnEl.click();
      }
    });
  });
}

      </div>

  `;
  document.body.appendChild(overlay);

  function close(){ overlay.remove(); }
  bindTapAction(overlay.querySelector('.confirm-cancel'), close);

}

function joinAnd(items){
  if(items.length === 1) return items[0];
  if(items.length === 2) return `${items[0]} and ${items[1]}`;
  return `${items.slice(0,-1).join(', ')}, and ${items[items.length-1]}`;
}
function lettersPhrase(letters){
  return letters.length === 1 ? `the letter ${letters[0]}` : `the letters ${joinAnd(letters)}`;
}
function getHintLetterOrder(word){
  // The hint just needs to show which letters are used, not imply any
  // particular order matters - so if the plain alphabetical arrangement
  // happens to spell out a real word (possibly even the answer itself),
  // shuffle instead rather than accidentally giving away more than
  // intended.
  const lower = word.toLowerCase();
  const sorted = lower.split('');
  sorted.sort();
  if(!WORD_SET.has(sorted.join(''))){
    return sorted;
  }
  let attempt = sorted.slice();
  for(let i = 0; i < 20; i++){
    for(let j = attempt.length - 1; j > 0; j--){
      const k = Math.floor(Math.random() * (j + 1));
      [attempt[j], attempt[k]] = [attempt[k], attempt[j]];
    }
    if(!WORD_SET.has(attempt.join(''))) return attempt;
  }
  // Vanishingly unlikely to ever be reached, but don't loop forever.
  return attempt;
}
function checkGuessLetters(guess, startingWord, finalWord){
  const problems = [];

  const guessCounter = counter(guess);
  const startingCounter = counter(startingWord);
  const missingStarting = [];
  for(const ch of Object.keys(startingCounter)){
    const have = guessCounter[ch] || 0;
    if(have < startingCounter[ch]) missingStarting.push(ch);
  }
  if(missingStarting.length > 0){
    problems.push({ reason:'missing_starting_letters', letters: missingStarting });
  }

  const finalCounter = counter(finalWord);
  const notInFinal = [];
  const tooMany = [];
  for(const ch of Object.keys(guessCounter)){
    const gCount = guessCounter[ch];
    const fCount = finalCounter[ch] || 0;
    if(fCount === 0){
      notInFinal.push(ch);
    } else if(gCount > fCount){
      tooMany.push({ ch, fCount });
    }
  }
  if(notInFinal.length > 0){
    problems.push({ reason:'letter_not_in_final', letters: notInFinal });
  }
  if(tooMany.length > 0){
    problems.push({ reason:'too_many_repeats', details: tooMany });
  }
  return problems;
}
function isStepValid(word1, word2){
  if(word2.length !== word1.length + 1){
    return { valid:false, reason:'wrong_length' };
  }
  const counts1 = counter(word1);
  const counts2 = counter(word2);
  const missing = [];
  for(const ch of Object.keys(counts1)){
    const have = counts2[ch] || 0;
    if(have < counts1[ch]) missing.push(ch);
  }
  if(missing.length > 0){
    return { valid:false, reason:'missing_letters', letters: missing };
  }
  return { valid:true };
}
function isValidChain(startingWord, guessesObj, finalWord){
  const lengths = Object.keys(guessesObj).map(Number).sort((a,b)=>a-b);
  const allWords = [startingWord, ...lengths.map(l => guessesObj[l]), finalWord];
  const invalidSteps = [];
  for(let i=0;i<allWords.length-1;i++){
    const result = isStepValid(allWords[i], allWords[i+1]);
    if(!result.valid){
      invalidSteps.push({ from: allWords[i], to: allWords[i+1], ...result });
    }
  }
  return { valid: invalidSteps.length === 0, invalidSteps };
}

function collectMigratableData(){
  const data = {};
  const globalKeys = [
    'letterladder:stats',
    'letterladder:activeTier',
    'letterladder:howToPlaySeen',
    'letterladder:keyboardEnabled',
    'letterladder:timerChoice',
    'letterladder:timerChoiceMade',
  ];
  for(const key of globalKeys){
    const value = localStorage.getItem(key);
    if(value !== null) data[key] = value;
  }
  // Also grab everything scoped to today's date (in-progress gameplay:
  // guesses, hints used, timer state, played/solved/loss bookkeeping
  // flags) - past days' per-puzzle data isn't included since it's no
  // longer actionable anyway (an old puzzle can't be replayed), and the
  // aggregate stats object above already captures what matters from
  // history (streaks, totals, scores).
  const todayPrefix = `letterladder:${todayKey()}:`;
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(todayPrefix)){
      data[key] = localStorage.getItem(key);
    }
  }
  return data;
}

function importMigrationDataIfPresent(){
  const host = window.location.hostname;
  const onNewDomain = host === NEW_DOMAIN_HOSTNAME || host.endsWith('.' + NEW_DOMAIN_HOSTNAME);
  if(!onNewDomain) return;
  const params = new URLSearchParams(window.location.search);
  const migrateParam = params.get('migrate');
  if(!migrateParam) return;

  try{
    const data = JSON.parse(decodeURIComponent(migrateParam));
    let importedCount = 0;
    for(const [key, value] of Object.entries(data)){
      if(key === STATS_KEY){
        // Stats get a genuine field-by-field merge rather than an
        // all-or-nothing replace, since someone may have already played
        // a bit on this domain before migrating - a whole-object
        // replace would silently throw away whichever side didn't win,
        // rather than combining them. Unlike every other key below,
        // summing isn't naturally safe to repeat - re-running the same
        // migration link would double the numbers each time - so this
        // is explicitly guarded to only ever merge once.
        if(localStorage.getItem('letterladder:statsMigrationApplied')){
          continue;
        }
        const incoming = JSON.parse(value);
        const existing = loadStats();
        const merged = {};
        for(const tier of ['easy','medium','hard','total']){
          const a = existing[tier] || blankStat();
          const b = incoming[tier] || blankStat();
          const aMoreRecent = (a.lastSolvedDate || '') >= (b.lastSolvedDate || '');
          merged[tier] = {
            played: (a.played || 0) + (b.played || 0),
            solved: (a.solved || 0) + (b.solved || 0),
            maxStreak: Math.max(a.maxStreak || 0, b.maxStreak || 0),
            lastSolvedDate: aMoreRecent ? a.lastSolvedDate : b.lastSolvedDate,
            currentStreak: aMoreRecent ? (a.currentStreak || 0) : (b.currentStreak || 0),
          };
        }
        saveStats(merged);
        localStorage.setItem('letterladder:statsMigrationApplied', '1');
        importedCount++;
        continue;
      }
      // Only fill in keys that aren't already present locally, so this
      // never overwrites any fresh progress already made on the new
      // domain before clicking the migration link.
      if(localStorage.getItem(key) === null){
        localStorage.setItem(key, value);
        importedCount++;
      }
    }
    if(importedCount > 0){
      window.letterLadderMigrationJustImported = true;
    }
  }catch(e){
    // malformed or tampered migrate param - fail silently rather than
    // breaking the page load over it
  }

  // Clean the URL either way, so the migration data doesn't linger in
  // the address bar or browser history.
  const cleanUrl = window.location.origin + window.location.pathname;
  window.history.replaceState({}, '', cleanUrl);
}

function showMigrationLinkBannerIfNeeded(){

function timerStartKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}:timerStartedAt`; }
function timerElapsedKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}:timerElapsedMs`; }
function timerAccumulatedKey(tier){ return `letterladder:${accountScope}:${dateKey}:${tier}:timerAccumulatedMs`; }

// The timer should only advance while the player is actually here, on this
// puzzle - not while the tab is hidden, another tier is active, or they've
// navigated to a different page entirely. Rather than tracking a single
// start timestamp and assuming it always represents unbroken elapsed time,
// this banks completed segments into an accumulated total and only ever
// treats timerStartKey as "the current segment's start" - present exactly
// while actively running, absent while paused.
function getCurrentElapsedMs(tier){
  const accumulated = Number(localStorage.getItem(timerAccumulatedKey(tier)) || 0);
  const segmentStart = localStorage.getItem(timerStartKey(tier));
  const running = segmentStart !== null ? (Date.now() - Number(segmentStart)) : 0;
  return accumulated + running;
}
function pauseTimer(tier){
  const segmentStart = localStorage.getItem(timerStartKey(tier));
  if(segmentStart === null) return; // already paused (or never started) - nothing to fold in
  const elapsed = getCurrentElapsedMs(tier);
  localStorage.setItem(timerAccumulatedKey(tier), String(elapsed));
  localStorage.removeItem(timerStartKey(tier));
}

function formatElapsed(ms){
  const totalSeconds = Math.floor(ms / 1000);
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function hasEverStartedTimer(tier){
  const accumulated = Number(localStorage.getItem(timerAccumulatedKey(tier)) || 0);
  return accumulated > 0
    || localStorage.getItem(timerElapsedKey(tier)) !== null
    || localStorage.getItem(timerStartKey(tier)) !== null;
}

// ---------- stats, streaks & score (all local to this device/browser -
// there are no accounts, so none of this follows you to another device) ----------
const STATS_KEY = `letterladder:${accountScope}:stats`;

function blankStat(){
  return { played:0, solved:0, currentStreak:0, maxStreak:0, lastSolvedDate:null };
}
function loadStats(){
  try{
    // One-time recovery: stats accumulated before account-scoping existed
    // lived under this same, unscoped key. The very first time a given
    // account loads its own (still-empty) scoped stats, inherit a copy of
    // that pre-existing history rather than silently losing it - the old
    // key is left in place rather than deleted, since it's ambiguous
    // which account should end up claiming it.
    if(accountScope !== 'guest' && localStorage.getItem(STATS_KEY) === null){
      const legacyRaw = localStorage.getItem('letterladder:stats');
      if(legacyRaw){
        localStorage.setItem(STATS_KEY, legacyRaw);
      }
    }
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // guard against a corrupted/partial object from an older version
      for(const key of ['easy','medium','hard','total']){
        parsed[key] = Object.assign(blankStat(), parsed[key] || {});
      }
      return parsed;
    }
  }catch(e){}
  return { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
}
function saveStats(stats){
  try{ localStorage.setItem(STATS_KEY, JSON.stringify(stats)); }catch(e){}
  syncStatsToCloud(stats);
}

// Fire-and-forget: keeps a durable, cloud-backed copy of stats in sync
// with every local change, so they survive local storage getting cleared
// and can eventually follow the account across devices. Local storage
// remains the fast, synchronous source of truth for everything currently
// on this page - this just mirrors it outward in the background.
let dailyProgressSyncTimeout = null;
let lastKnownProgressSnapshotJSON = null;

// Excludes lastModifiedAt itself from the comparison snapshot - comparing
// a snapshot against itself including its own timestamp key would be
// circular, since that key changes every time it's bumped regardless of
// whether anything else did.
function getComparableProgressSnapshot(){
  const snapshot = getTodaysProgressSnapshot();
  delete snapshot[`letterladder:${accountScope}:${dateKey}:lastModifiedAt`];
  return snapshot;
}

// Silently re-establishes the comparison baseline to match whatever was
// just restored from the cloud, without treating that restoration itself
// as a "genuine new change" that would spuriously bump the timestamp
// right back to now - which would defeat the point of having preserved
// the cloud's original, meaningful timestamp in the first place.
function rebaselineProgressComparison(){
  lastKnownProgressSnapshotJSON = JSON.stringify(getComparableProgressSnapshot());
}

function scheduleDailyProgressSync(){
  // Only bumps the timestamp when the underlying progress data has
  // genuinely changed since it was last seen - not simply whenever
  // render() happens to fire, which includes plain page loads and
  // passive re-displays with zero new progress. Without this check, a
  // browser could always look artificially "more recent" than the cloud
  // just from being opened, even while holding stale, pre-fix puzzle
  // data - which is exactly what let it keep losing the comparison and
  // never actually pulling the real, current state.
  if(window.LetterLadderAuth && !isArchiveMode){
    const user = window.LetterLadderAuth.getCurrentUser();
    if(user && !user.isAnonymous){
      const currentJSON = JSON.stringify(getComparableProgressSnapshot());
      if(lastKnownProgressSnapshotJSON !== null && currentJSON !== lastKnownProgressSnapshotJSON){
        localStorage.setItem(`letterladder:${accountScope}:${dateKey}:lastModifiedAt`, String(Date.now()));
      }
      lastKnownProgressSnapshotJSON = currentJSON;
    }
  }
  clearTimeout(dailyProgressSyncTimeout);
  dailyProgressSyncTimeout = setTimeout(syncDailyProgressToCloud, 2000);
}

function syncStatsToCloud(stats){
  if(!window.LetterLadderAuth) return;
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return;
  // Never sync a completely blank stats object up to the cloud - since
  // merge:true replaces each tier's object wholesale rather than deep-
  // merging its individual fields, writing an all-zero state here would
  // silently destroy any real, existing progress already in the cloud.
  // The only time every tier is genuinely 0/0 is either a brand-new
  // account (cloud is presumably also blank, so skipping is harmless) or
  // local data that's been lost/wiped, which should never be allowed to
  // propagate and overwrite real cloud data.
  const isEntirelyBlank = [...TIERS, 'total'].every(tier => {
    const t = stats[tier] || {};
    return !t.played && !t.solved;
  });
  if(isEntirelyBlank) return;
  const attempt = () => window.LetterLadderAuth.setDoc(
    window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'playerStats', user.uid),
    stats,
    { merge: true }
  );
  try{
    attempt().catch(() => {
      // One retry after a short delay - covers the common case of a
      // brief network hiccup or the write racing a page navigation,
      // without adding unbounded retry complexity right before launch.
      setTimeout(() => { attempt().catch(()=>{}); }, 1500);
    });
  }catch(e){}
}

// Captures every localStorage key under today's account+date prefix as
// one bundle - guesses, timer state, hints, completion flags, all of it
// - rather than listing each specific key type individually, which would
// risk silently missing something as the game's state model grows. This
// naturally includes lastModifiedAt too, since it lives under the same
// prefix, so it correctly travels along with the rest of the snapshot.
function getTodaysProgressSnapshot(){
  const prefix = `letterladder:${accountScope}:${dateKey}:`;
  const snapshot = {};
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(prefix)){
      snapshot[key] = localStorage.getItem(key);
    }
  }
  return snapshot;
}

function applyProgressSnapshot(snapshot){
  for(const key of Object.keys(snapshot)){
    localStorage.setItem(key, snapshot[key]);
  }
}

function getLocalLastModifiedAt(){
  return Number(localStorage.getItem(`letterladder:${accountScope}:${dateKey}:lastModifiedAt`) || 0);
}

// When someone creates an account mid-session after already genuinely
// playing (and possibly solving) today's puzzles as a guest, that
// progress lives under the 'guest' scope and would otherwise be
// silently orphaned - the new account's own scope starts out completely
// empty, making an already-solved puzzle look unstarted after the
// reload. This re-keys today's guest-scoped progress under the new
// account's scope instead, before the reload happens, so nothing gets
// lost. Only runs when genuinely coming from guest play - a normal
// login/account-creation from a fresh, guest-free session has nothing
// to migrate and this correctly no-ops.
function migrateGuestProgressToAccount(newUsername){
  if(accountScope !== 'guest') return;
  const guestSnapshot = getTodaysProgressSnapshot();
  const oldPrefix = `letterladder:guest:`;
  const newPrefix = `letterladder:${newUsername}:`;
  const migratedSnapshot = {};
  for(const key of Object.keys(guestSnapshot)){
    if(key.startsWith(oldPrefix)){
      const newKey = newPrefix + key.slice(oldPrefix.length);
      localStorage.setItem(newKey, guestSnapshot[key]);
      migratedSnapshot[newKey] = guestSnapshot[key];
    }
  }
  // Push this migrated data to the cloud immediately, under the new
  // account's real uid - without this, the migration only ever existed
  // on this one device, and a fresh session anywhere else (a different
  // browser, incognito, another device) would find nothing to restore
  // and show every puzzle as unstarted, despite it genuinely already
  // being solved.
  try{
    const user = window.LetterLadderAuth && window.LetterLadderAuth.getCurrentUser();
    if(user && !user.isAnonymous && Object.keys(migratedSnapshot).length > 0){
      const modifiedAt = Date.now();
      migratedSnapshot[`letterladder:${newUsername}:${dateKey}:lastModifiedAt`] = String(modifiedAt);
      localStorage.setItem(`letterladder:${newUsername}:${dateKey}:lastModifiedAt`, String(modifiedAt));
      window.LetterLadderAuth.setDoc(
        window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'dailyProgress', `${user.uid}_${dateKey}`),
        { snapshot: migratedSnapshot, lastModifiedAt: modifiedAt }
      ).catch(()=>{});
    }
  }catch(e){}
}

// Guests never get personal stats tracked (markPlayedIfNeeded/
// markSolvedIfNeeded both skip entirely without a real account), and
// their leaderboard scores get submitted under 'Guest', not any
// specific account. So completing puzzles as a guest and then creating
// an account partway through today left those earlier completions
// stranded - correctly migrated as raw progress data (guesses, timer),
// but never counted toward played/solved/streak, and never
// re-attributed on the leaderboard. This backfills both, for every
// tier genuinely won today (excluding revealed solutions) that stats
// don't yet reflect. Safe to call unconditionally: re-submitting an
// already-attributed score is a harmless overwrite given deterministic,
// per-account document IDs, and the lastSolvedDate check below is what
// actually prevents double-counting stats.
function backfillGuestStatsAndScores(newUsername){
  // loadStats()/saveStats() both read and write the module-level
  // STATS_KEY constant, which is fixed to the OLD 'guest' scope at this
  // point in execution (accountScope only re-evaluates on the page's
  // next reload) - using them here would silently write these backfilled
  // stats to the wrong, orphaned key. Read/write the new account's key
  // explicitly instead, mirroring loadStats' exact parsing/defaulting.
  const newStatsKey = `letterladder:${newUsername}:stats`;
  let stats;
  try{
    const raw = localStorage.getItem(newStatsKey);
    const parsed = raw ? JSON.parse(raw) : {};
    stats = {
      easy: Object.assign(blankStat(), parsed.easy || {}),
      medium: Object.assign(blankStat(), parsed.medium || {}),
      hard: Object.assign(blankStat(), parsed.hard || {}),
      total: Object.assign(blankStat(), parsed.total || {}),
    };
  }catch(e){
    stats = { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
  }

  let anyBackfilled = false;
  for(const tier of TIERS){
    if(isTierGenuinelyWon(tier) && stats[tier].lastSolvedDate !== dateKey){
      stats[tier].played += 1;
      stats[tier].solved += 1;
      bumpStreak(stats[tier], dateKey);
      stats.total.played += 1;
      stats.total.solved += 1;
      anyBackfilled = true;
      // markPlayedIfNeeded checks for a real account before it ever sets
      // its own "already counted" flag, so that flag never got set
      // during guest play - without setting it here too, the normal
      // play-tracking code would see no flag on a later visit and
      // increment "played" a second time.
      localStorage.setItem(`letterladder:${newUsername}:${dateKey}:${tier}:playedCounted`, '1');
      // Same protection for "solved" - explicitly set here rather than
      // relying solely on migration to have already copied it over.
      localStorage.setItem(`letterladder:${newUsername}:${dateKey}:${tier}:solvedCounted`, '1');
      submitCurrentScore(tier, newUsername);
    }
  }
  if(TIERS.every(isTierGenuinelyWon) && stats.total.lastSolvedDate !== dateKey){
    bumpStreak(stats.total, dateKey);
    anyBackfilled = true;
  }
  if(anyBackfilled){
    try{ localStorage.setItem(newStatsKey, JSON.stringify(stats)); }catch(e){}
    syncStatsToCloud(stats);
  }
}

// Same fire-and-forget pattern as stats: keeps a durable, cloud-backed
// copy of today's actual puzzle progress in sync, so a genuinely fresh
// browser or device can restore it rather than starting from scratch.
// The lastModifiedAt timestamp travels alongside the snapshot, since
// it's what a later session needs to correctly resolve a conflict
// against its own local state.
function syncDailyProgressToCloud(){
  if(!window.LetterLadderAuth) return;
  if(isArchiveMode) return; // archive plays never sync progress
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return;
  try{
    const snapshot = getTodaysProgressSnapshot();
    let modifiedAt = getLocalLastModifiedAt();
    if(modifiedAt === 0){
      modifiedAt = Date.now();
      localStorage.setItem(`letterladder:${accountScope}:${dateKey}:lastModifiedAt`, String(modifiedAt));
    }
    window.LetterLadderAuth.setDoc(
      window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'dailyProgress', `${user.uid}_${dateKey}`),
      { snapshot, lastModifiedAt: modifiedAt }
    ).then(() => {
      console.log('DIAG dailyProgress sync: succeeded for', `${user.uid}_${dateKey}`);
    }).catch((e) => {
      console.error('DIAG dailyProgress sync: FAILED -', e.code || e.message || e);
    });
  }catch(e){
    console.error('DIAG dailyProgress sync: threw synchronously -', e.message || e);
  }
}

// Compares the local and cloud timestamps directly and lets whichever
// side was genuinely touched more recently win - rather than a blunt
// "only pull if local is completely empty" check, which would leave two
// sessions with any pre-existing local data permanently unable to ever
// reconcile with each other, even when one is meaningfully more current.
async function pullDailyProgressFromCloudIfNeeded(){
  if(!window.LetterLadderAuth) return false;
  if(isArchiveMode) return false;
  const user = window.LetterLadderAuth.getCurrentUser();
  if(!user || user.isAnonymous) return false;
  try{
    const snap = await window.LetterLadderAuth.getDoc(
      window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'dailyProgress', `${user.uid}_${dateKey}`)
    );
    if(!snap.exists() || !snap.data().snapshot){
      console.log('DIAG dailyProgress pull: no cloud doc found for', `${user.uid}_${dateKey}`, '- exists:', snap.exists());
      return false;
    }
    const cloudModifiedAt = Number(snap.data().lastModifiedAt || 0);
    const localModifiedAt = getLocalLastModifiedAt();
    const localIsGenuinelyEmpty = Object.keys(getTodaysProgressSnapshot()).length === 0;
    console.log('DIAG dailyProgress pull: cloudModifiedAt=', cloudModifiedAt, 'localModifiedAt=', localModifiedAt, 'localIsGenuinelyEmpty=', localIsGenuinelyEmpty);
    if(cloudModifiedAt <= localModifiedAt && !localIsGenuinelyEmpty){
      console.log('DIAG dailyProgress pull: skipped - local considered at least as current');
      return false;
    }
    applyProgressSnapshot(snap.data().snapshot);
    console.log('DIAG dailyProgress pull: restored', Object.keys(snap.data().snapshot).length, 'keys');
    return true;
  }catch(e){
    console.error('DIAG dailyProgress pull: threw an error -', e.code || e.message || e);
  }
  return false;
}

importMigrationDataIfPresent(); // deferred to here so STATS_KEY/blankStat/loadStats/saveStats above are safely initialized before the merge logic can reference them
function dateKeyMinusOneDay(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()-1);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function bumpStreak(stat, todayKeyStr){
  if(stat.lastSolvedDate === todayKeyStr) return; // already counted today, don't double-bump
  const wasYesterday = stat.lastSolvedDate === dateKeyMinusOneDay(todayKeyStr);
  stat.currentStreak = wasYesterday ? stat.currentStreak + 1 : 1;
  stat.maxStreak = Math.max(stat.maxStreak, stat.currentStreak);
  stat.lastSolvedDate = todayKeyStr;
}

function revealSolutionAsLoss(tier){
  const puzzleHints = HINTS_SCHEDULE[dateKey] && HINTS_SCHEDULE[dateKey][tier];
  if(!puzzleHints) return; // nothing to reveal - shouldn't happen in practice
  const solution = puzzleHints.solution;
  const revealedGuesses = {};
  for(let i = 1; i < solution.length - 1; i++){
    revealedGuesses[solution[i].length] = solution[i];
  }
  saveGuesses(tier, revealedGuesses);
  localStorage.setItem(`letterladder:${accountScope}:${dateKey}:${tier}:solutionRevealedAsLoss`, '1');
  const hasEverStarted = localStorage.getItem(timerStartKey(tier)) !== null || localStorage.getItem(timerAccumulatedKey(tier)) !== null;
  if(hasEverStarted && !localStorage.getItem(timerElapsedKey(tier))){
    localStorage.setItem(timerElapsedKey(tier), String(getCurrentElapsedMs(tier)));
  }
  recordLossIfNeeded(tier);
}

function hasRealAccount(){
  return !!localStorage.getItem('letterladder:accountUsername');
}

function recordLossIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:lossCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  markPlayedIfNeeded(tier);

  if(hasRealAccount()){
    const stats = loadStats();
    stats[tier].currentStreak = 0; // explicitly break the streak - this is a loss
    saveStats(stats);
  }
}

function markPlayedIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  if(!hasRealAccount()) return; // guests don't get personal stats tracked at all
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:playedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');
  const stats = loadStats();
  stats[tier].played += 1;
  stats.total.played += 1;
  saveStats(stats);
}

const HINT_TIME_PENALTY_MS = 3 * 60 * 1000;

function showHintTimePenaltyIndicator(){
  const existing = document.getElementById('hint-time-penalty-indicator');
  if(existing) existing.remove();

  const brandRow = document.querySelector('.brand-row');
  if(!brandRow) return;

  const indicator = document.createElement('div');
  indicator.id = 'hint-time-penalty-indicator';
  indicator.className = 'hint-time-penalty-indicator';
  indicator.textContent = '+3 mins';
  brandRow.appendChild(indicator);

  setTimeout(() => {
    if(indicator.parentNode) indicator.remove();
  }, 3000);
}

function recordHintUsed(tier){
  const key = `letterladder:${accountScope}:${dateKey}:${tier}:hintsUsed`;
  const current = parseInt(localStorage.getItem(key) || '0', 10);
  localStorage.setItem(key, String(current + 1));

  // Applied directly to the accumulated total (not deferred until the
  // puzzle is completed), so the very next timer display tick already
  // reflects the penalty - regardless of whether the timer is currently
  // running or paused at this exact moment.
  const accumulatedKey = timerAccumulatedKey(tier);
  const currentAccumulated = Number(localStorage.getItem(accumulatedKey) || 0);
  localStorage.setItem(accumulatedKey, String(currentAccumulated + HINT_TIME_PENALTY_MS));

  if(getTimerChoice() === 'timed'){
    showHintTimePenaltyIndicator();
  }
}
function getHintsUsed(tier){
  return parseInt(localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintsUsed`) || '0', 10);
}

function getHintInfo(tier, L){
  try{
    const raw = localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintInfo:${L}`);
    return raw ? JSON.parse(raw) : { count: 0, letters: null, firstLetter: null };
  }catch(e){
    return { count: 0, letters: null, firstLetter: null };
  }
}
function saveHintInfo(tier, L, info){
  localStorage.setItem(`letterladder:${accountScope}:${dateKey}:${tier}:hintInfo:${L}`, JSON.stringify(info));
}

function getLastHintedLength(tier){
  const raw = localStorage.getItem(`letterladder:${accountScope}:${dateKey}:${tier}:lastHintedLength`);
  return raw !== null ? Number(raw) : null;
}
function setLastHintedLength(tier, L){
  const key = `letterladder:${accountScope}:${dateKey}:${tier}:lastHintedLength`;
  if(L === null){
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, String(L));
  }
}

function buildHintDisplayHtml(tier, L){
  const info = getHintInfo(tier, L);
  const parts = [];
  if(info.letters){
    parts.push(`${L}-letter word uses: <span class="hint-letters">${info.letters}</span>`);
  }
  if(info.firstLetter){
    parts.push(`First letter: <span class="hint-letters">${info.firstLetter}</span>`);
  }
  return parts.join('<br>');
}

function markStartedIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:startedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  if(typeof dataLayer !== 'undefined'){
    dataLayer.push({
      event: 'puzzle_started',
      player_id: getPlayerId(),
      tier: tier,
      puzzle_date: dateKey,
    });
  }
}

function closeAnyOpenAccountDropdown(){
  const existing = document.querySelector('.account-dropdown');
  if(existing) existing.remove();
}

function renderAccountWidget(){
  const container = document.getElementById('account-widget');
  if(!container) return;
  const currentUser = window.LetterLadderAuth ? window.LetterLadderAuth.getCurrentUser() : null;
  const hasAccount = !!(currentUser && !currentUser.isAnonymous);
  const savedUsername = localStorage.getItem('letterladder:accountUsername');

  if(hasAccount && savedUsername){
    const initial = savedUsername.trim().charAt(0).toUpperCase();
    container.innerHTML = `<button type="button" class="account-icon-btn has-account" id="account-icon-btn" aria-label="Account menu">${initial}</button>`;
    bindTapAction(container.querySelector('#account-icon-btn'), ()=>{
      if(document.querySelector('.account-dropdown')){ closeAnyOpenAccountDropdown(); return; }
      const dropdown = document.createElement('div');
      dropdown.className = 'account-dropdown';
      dropdown.innerHTML = `
        <div class="account-dropdown-username">${savedUsername}</div>
        <a href="stats.html">Stats</a>
        <a href="profile.html">Profile</a>
      `;
      container.appendChild(dropdown);
      setTimeout(()=>{
        document.addEventListener('click', function outsideClick(e){
          if(!container.contains(e.target)){ closeAnyOpenAccountDropdown(); document.removeEventListener('click', outsideClick); }
        });
      }, 0);
    });
  } else {
    container.innerHTML = `<button type="button" class="account-icon-btn is-guest" id="account-icon-btn" aria-label="Create account or log in">${BLANK_PERSON_ICON}</button>`;
    bindTapAction(container.querySelector('#account-icon-btn'), ()=>{
      if(document.querySelector('.account-dropdown')){ closeAnyOpenAccountDropdown(); return; }
      const dropdown = document.createElement('div');
      dropdown.className = 'account-dropdown';
      dropdown.innerHTML = `
        <a href="#" id="account-create-link">Create account</a>
        <a href="#" id="account-login-link">Log in</a>
      `;
      container.appendChild(dropdown);
      bindTapAction(dropdown.querySelector('#account-create-link'), ()=>{
        closeAnyOpenAccountDropdown();
        showAccountForm('create');
      });
      bindTapAction(dropdown.querySelector('#account-login-link'), ()=>{
        closeAnyOpenAccountDropdown();
        showAccountForm('login');
      });
      setTimeout(()=>{
        document.addEventListener('click', function outsideClick(e){
          if(!container.contains(e.target)){ closeAnyOpenAccountDropdown(); document.removeEventListener('click', outsideClick); }
        });
      }, 0);
    });
  }
}

// Standalone create-account / log-in flow, reachable from the header icon
// directly (not just after winning a timed puzzle) - shares the same
// underlying Firebase calls and error handling as the post-win popup.
function showAccountForm(mode){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  const isLogin = mode === 'login';
  overlay.innerHTML = `
    <div class="leaderboard-prompt-card">
      ${isLogin ? `<div class="leaderboard-prompt-title">Log in</div>` : `<div class="leaderboard-form-title">Create account</div>`}
      <div class="leaderboard-form-error" id="acct-form-error"></div>
      <input type="text" class="leaderboard-form-field" id="acct-username-field" placeholder="Username" autocomplete="username">
      <input type="password" class="leaderboard-form-field" id="acct-password-field" placeholder="Password" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      ${isLogin ? '' : `
        <input type="email" class="leaderboard-form-field" id="acct-email-field" placeholder="Email (optional)" autocomplete="email">
        <div class="leaderboard-form-hint">Your email will only be used for password recovery purposes.</div>
      `}
      <div class="leaderboard-prompt-actions">
        <button type="button" class="btn-primary" id="acct-submit-btn">${isLogin ? 'Log in' : 'Create account'}</button>
        <button type="button" class="btn-ghost" id="acct-cancel-btn">Cancel</button>
      </div>
      ${isLogin ? '<a href="#" class="leaderboard-form-hint" id="acct-forgot-link" style="display:block; text-align:center; margin-top:12px; cursor:pointer;">Forgot password?</a>' : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  bindTapAction(overlay.querySelector('#acct-cancel-btn'), close);

  const errorEl = overlay.querySelector('#acct-form-error');
  const submitBtnEl = overlay.querySelector('#acct-submit-btn');
  bindEnterToSubmit([
    overlay.querySelector('#acct-username-field'),
    overlay.querySelector('#acct-password-field'),
    overlay.querySelector('#acct-email-field'),
  ], submitBtnEl);

  if(isLogin){
    bindTapAction(overlay.querySelector('#acct-forgot-link'), ()=>{
      close();
      showForgotPasswordForm();
    });
  }

  bindTapAction(overlay.querySelector('#acct-submit-btn'), async ()=>{
    const username = overlay.querySelector('#acct-username-field').value.trim();
    const password = overlay.querySelector('#acct-password-field').value;
    if(!username || !password){
      errorEl.textContent = 'Please fill in both fields.';
      return;
    }
    errorEl.textContent = '';
    const emailField = overlay.querySelector('#acct-email-field');
    const result = isLogin
      ? await window.LetterLadderAuth.login(username, password)
      : await window.LetterLadderAuth.createAccount(username, password, emailField ? emailField.value : '');
    if(!result.success){
      errorEl.textContent = result.error;
      return;
    }
    localStorage.setItem('letterladder:accountUsername', result.username);
    localStorage.setItem('letterladder:activeTier', 'easy');
    if(!isLogin){
      migrateGuestProgressToAccount(result.username);
      backfillGuestStatsAndScores(result.username);
    }

    // Pull this account's usual timer preference from the cloud, so
    // someone who always plays timed doesn't stay stuck on whatever was
    // locally set as a guest on this particular device.
    try{
      let usualTimerChoice = null;
      const statsSnap = await window.LetterLadderAuth.getDoc(
        window.LetterLadderAuth.doc(window.LetterLadderAuth.db, 'playerStats', result.uid)
      );
      if(statsSnap.exists() && statsSnap.data().timerChoice){
        usualTimerChoice = statsSnap.data().timerChoice;
      } else {
        const scoresQuery = window.LetterLadderAuth.query(
          window.LetterLadderAuth.collection(window.LetterLadderAuth.db, 'scores'),
          window.LetterLadderAuth.where('uid', '==', result.uid),
          window.LetterLadderAuth.limit(1)
        );
        const scoresSnap = await window.LetterLadderAuth.getDocs(scoresQuery);
        if(!scoresSnap.empty) usualTimerChoice = 'timed';
      }
      if(usualTimerChoice){
        localStorage.setItem(TIMER_CHOICE_KEY, usualTimerChoice);
        localStorage.setItem(TIMER_CHOICE_MADE_KEY, '1');
      }
    }catch(e){
      console.error('Failed to pull timer preference on login:', e);
    }

    window.location.reload();
  });
}

const LEADERBOARD_PROMPT_DISMISSED_KEY = 'letterladder:leaderboardPromptDismissed';

async function submitCurrentScore(tier, displayName){
  if(!window.LetterLadderAuth) return;
  const timeMs = Number(localStorage.getItem(timerElapsedKey(tier)) || 0);
  const hintsUsed = getHintsUsed(tier);
  await window.LetterLadderAuth.submitScore({ date: dateKey, tier, timeMs, hintsUsed, displayName });
}

function showLeaderboardPromptIfNeeded(tier){
  if(isArchiveMode) return; // archive plays never touch the leaderboard
  if(!window.LetterLadderAuth) return; // Firebase's module script hasn't finished loading yet - skip gracefully rather than error
  if(localStorage.getItem(LEADERBOARD_PROMPT_DISMISSED_KEY)){
    // The dismissed flag only means "stop showing me the popup" - it was
    // never meant to also silently stop submitting scores, but returning
    // here unconditionally did exactly that for every subsequent win.
    // Submit silently as a guest instead, same as the hasRealAccount()
    // branch below does for account holders.
    window.LetterLadderAuth.playAsGuest().then(() => submitCurrentScore(tier, 'Guest'));
    return;
  }
  const savedUsername = localStorage.getItem('letterladder:accountUsername');
  if(hasRealAccount()){
    // Already has a real account - silently submit under their existing
    // username every time, exactly as spec'd, with no popup at all.
    submitCurrentScore(tier, savedUsername);

      </div>

  function close(){ overlay.remove(); }

  bindTapAction(overlay.querySelector('#lb-dismiss-link'), async ()=>{
    localStorage.setItem(LEADERBOARD_PROMPT_DISMISSED_KEY, '1');
    await window.LetterLadderAuth.playAsGuest();
    await submitCurrentScore(tier, 'Guest');
    close();
  });

  bindTapAction(overlay.querySelector('#lb-play-guest-btn'), async ()=>{
    await window.LetterLadderAuth.playAsGuest();
    await submitCurrentScore(tier, 'Guest');
    close();
  });

  bindTapAction(overlay.querySelector('#lb-create-account-btn'), ()=>{
    const titleEl = overlay.querySelector('#lb-prompt-title');
    const bodyEl = overlay.querySelector('#lb-prompt-body');
    titleEl.className = 'leaderboard-form-title';
    titleEl.textContent = 'Create account';

    const errorEl = bodyEl.querySelector('#lb-form-error');
    const lbSubmitBtn = bodyEl.querySelector('#lb-submit-account-btn');
    bindEnterToSubmit([
      bodyEl.querySelector('#lb-username-field'),
      bodyEl.querySelector('#lb-password-field'),
      bodyEl.querySelector('#lb-email-field'),
    ], lbSubmitBtn);
    bindTapAction(lbSubmitBtn, async ()=>{
      const username = bodyEl.querySelector('#lb-username-field').value.trim();
      const password = bodyEl.querySelector('#lb-password-field').value;
      if(!username || !password){
        errorEl.textContent = 'Please fill in both fields.';
        return;
      }
      errorEl.textContent = '';
      const email = bodyEl.querySelector('#lb-email-field').value;
      const result = await window.LetterLadderAuth.createAccount(username, password, email);
      if(!result.success){
        errorEl.textContent = result.error;
        return;
      }
      localStorage.setItem('letterladder:accountUsername', result.username);
      migrateGuestProgressToAccount(result.username);
      backfillGuestStatsAndScores(result.username);
      await submitCurrentScore(tier, result.username);
      window.location.reload();
    });
  });
}

function markSolvedIfNeeded(tier, guesses){
  if(isArchiveMode) return; // archive plays never count toward stats or analytics
  const flagKey = `letterladder:${accountScope}:${dateKey}:${tier}:solvedCounted`;
  if(localStorage.getItem(flagKey)) return;
  localStorage.setItem(flagKey, '1');

  const hasEverStarted = localStorage.getItem(timerStartKey(tier)) !== null || localStorage.getItem(timerAccumulatedKey(tier)) !== null;
  if(hasEverStarted){
    localStorage.setItem(timerElapsedKey(tier), String(getCurrentElapsedMs(tier)));
  }

  // Pushed to the GTM data layer rather than called via gtag() directly -
  // gtag('event', ...) routes straight to GA4 and never passes through
  // GTM's own trigger system, so GTM has no way to see or act on it.
  // Guarded since ad blockers commonly block analytics scripts entirely -
  // that should never be able to break the actual game if dataLayer isn't
  // available for any reason.
  if(typeof dataLayer !== 'undefined'){
    const elapsedMs = localStorage.getItem(timerElapsedKey(tier));
    const timerChoice = getTimerChoice();
    dataLayer.push({
      event: 'puzzle_completed',
      player_id: getPlayerId(),
      tier: tier,
      puzzle_date: dateKey,
      hints_used: getHintsUsed(tier),
      guess_count: getTotalGuessCount(tier),
      timed_or_untimed: timerChoice,
      completion_time_seconds: (timerChoice === 'timed' && elapsedMs !== null) ? Math.round(Number(elapsedMs) / 1000) : null,
    });

    // Which specific word ended up in the player's own completed path at
    // each rung, using the final settled answer at the moment of
    // completion rather than every intermediate attempt (those are
    // separately covered by word_submitted above) - this fires exactly
    // once per rung per player (guarded by the same one-time flag as
    // puzzle_completed), so changing an answer back and forth only ever
    // counts as a single word for that position. Also flags whether that
    // word happens to match the creator's designated solution at this
    // rung, since a player's real path and the creator's path aren't
    // always the same word.
    const daySolution = (typeof HINTS_SCHEDULE !== 'undefined' && HINTS_SCHEDULE[dateKey] && HINTS_SCHEDULE[dateKey][tier])
      ? HINTS_SCHEDULE[dateKey][tier].solution : null;
    for(const len of Object.keys(guesses)){
      const creatorWordAtLength = daySolution ? daySolution.find(w => w.length === Number(len)) : null;
      dataLayer.push({
        event: 'word_used',
        player_id: getPlayerId(),
        tier: tier,
        puzzle_date: dateKey,
        rung_length: Number(len),
        word: guesses[len],
        is_player_solution_word: true,
        is_creator_solution_word: creatorWordAtLength === guesses[len],
      });
    }
  }

  if(hasRealAccount()){
    const stats = loadStats();
    const stat = stats[tier];
    stat.solved += 1;
    stats.total.solved += 1;
    bumpStreak(stat, dateKey);

    // If this solve completes all three tiers for today, the "total" streak
    // (a separate concept from the per-tier ones - it tracks consecutive
    // days you completed EVERY puzzle, tying into the summit celebration)
    // gets its own bump.
    if(TIERS.every(isTierComplete)){
      bumpStreak(stats.total, dateKey);
    }

    saveStats(stats);
  }

  // Confetti for the 1st and 2nd puzzle completed today, whichever tiers
  // those happen to be - the 3rd (finishing all three) gets the bigger
  // ladder-climb celebration instead, not confetti.
  if(!TIERS.every(isTierComplete)){
    triggerTierWinConfetti();
  }

  if(getTimerChoice() === 'timed'){
    showLeaderboardPromptIfNeeded(tier);
  }

  scheduleDailyProgressSync(); // updates the timestamp if this genuinely changed anything
  clearTimeout(dailyProgressSyncTimeout);
  syncDailyProgressToCloud(); // then sync immediately rather than waiting on the debounce
}
