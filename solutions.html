<script>
function prettyDate(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}

const container = document.getElementById('solutions-list');
const tierNames = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };

// This page now always shows exactly one tier's solution for one specific
// date, requested via ?date=YYYY-MM-DD&tier=easy|medium|hard - this is
// what the game's "View solution" link points to (whether that's today's
// own puzzle or an archived past day). There's no more "yesterday, all
// three tiers" default - if the params are missing or don't match a real
// scheduled puzzle, this just shows a graceful empty state.
const params = new URLSearchParams(window.location.search);
const requestedDate = params.get('date');
const requestedTier = params.get('tier');

function todayKey(){
  const d = new Date();
  const eastern = new Date(d.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const y = eastern.getFullYear();
  const m = String(eastern.getMonth()+1).padStart(2,'0');
  const day = String(eastern.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
if(requestedDate && requestedDate !== todayKey()){
  document.querySelector('.back').href = `game.html?archive=${requestedDate}`;
}

const day = requestedDate && HINTS_SCHEDULE ? HINTS_SCHEDULE[requestedDate] : null;
const puzzle = day && requestedTier ? day[requestedTier] : null;

if(!puzzle){
  container.innerHTML = `<div class="empty-state">No solution to show here - head back to the game and use "View solution" on the puzzle you're playing.</div>`;
} else {
  document.getElementById('page-heading').textContent = 'Puzzle Solution';
  document.getElementById('page-intro').textContent =
    "One possible solution to the puzzle. There's usually more than one viable path.";

  const chainHtml = puzzle.solution.map((word, i) => {
    const arrow = i > 0 ? '<span class="chain-arrow">→</span>' : '';
    return `${arrow}<span class="chain-word">${word}</span>`;
  }).join('');

  container.innerHTML = `
    <div class="day-card">
      <div class="day-date">${prettyDate(requestedDate)}</div>
      <div class="tier-row">
        <div class="tier-label">${tierNames[requestedTier]}</div>
        <div class="chain">${chainHtml}</div>
      </div>
    </div>`;
}
</script>

<script>
// Tall desktop screens: keep the footer at the bottom of the window instead
// of floating mid-page. Phones and short pages are left exactly as they are.
(function(){
  var f = document.querySelector('.site-footer');
  if(!f) return;
  var base = parseFloat(getComputedStyle(f).marginTop) || 0;
  var b = document.body, PAD = 16;
  function place(){
    f.style.marginTop = base + 'px';
    b.style.paddingBottom = '';
    if(window.innerWidth < 768) return;
    var cs = getComputedStyle(b);
    var footerBottom = f.getBoundingClientRect().bottom + window.scrollY;
    var gap = window.innerHeight - (footerBottom + PAD + (parseFloat(cs.marginBottom) || 0));
    if(gap > 0){ b.style.paddingBottom = PAD + 'px'; f.style.marginTop = (base + gap) + 'px'; }
  }
  window.addEventListener('resize', place);
  window.addEventListener('load', place);
  if(window.ResizeObserver){
    var ro = new ResizeObserver(function(){ requestAnimationFrame(place); });
    Array.prototype.forEach.call(document.body.children, function(el){ if(el !== f && el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE') ro.observe(el); });
  }
  place();
})();
</script>
