<title>Your Stats — Letter Ladder</title>

<style>
  :root{
    --bg: #1B2A41; --bg-panel:#24384F; --rung:#F5EFE0; --ink:#F5EFE0; --ink-dim:#9FB3C8; --amber:#E8A33D;
  }
  body{
    margin:0; padding: 32px 16px 80px;
    background: radial-gradient(120% 140% at 50% -10%, #24384F 0%, #1B2A41 55%, #142132 100%);
    color: var(--ink); font-family:'Inter',system-ui,sans-serif;
  }
  .wrap{ max-width: 560px; margin:0 auto; }
  h1{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; margin-bottom:18px; }
  a{ color: var(--amber); }
  .back{ display:inline-block; margin-bottom: 22px; color: var(--ink-dim); text-decoration:none; touch-action: manipulation; }
  .back:hover{ color: var(--amber); }
  .intro{ color: var(--ink-dim); margin-bottom: 24px; font-size: 0.92rem; }

  .stat-card{ background: var(--bg-panel); border-radius:18px; padding: 22px 22px; margin-bottom:18px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .stat-card.total{ border: 1.5px solid rgba(232,163,61,0.35); }
  .stat-title{ font-family:'Fraunces',serif; font-weight:700; font-size:1.15rem; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .stat-title .tier-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .tier-dot.easy{ background:#6FBF8B; }
  .tier-dot.medium{ background:#E8A33D; }
  .tier-dot.hard{ background:#D9705F; }
  .tier-dot.total{ background:#F5EFE0; }

  .stat-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .stat-box{ text-align:center; }
  .stat-value{ font-family:'Fraunces',serif; font-weight:700; font-size:1.6rem; color: var(--amber); }
  .stat-label{ font-size:0.72rem; color: var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
  .streak-note{ margin-top:12px; font-size:0.72rem; color: var(--ink-dim); font-style:italic; font-weight:700; text-align:center; }

  .empty-state{ text-align:center; color: var(--ink-dim); padding: 40px 20px; background: var(--bg-panel); border-radius:18px; }

  .summary-card{ background: var(--bg-panel); border-radius:18px; padding: 22px; margin-bottom:18px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
  .summary-table{ width:100%; border-collapse: collapse; font-size: 0.88rem; }
  .summary-table th{
    text-align:left; font-family:'Fraunces',serif; font-weight:700; font-size:0.92rem;
    color: var(--ink); padding-bottom:10px; border-bottom: 1px solid rgba(245,239,224,0.12);
  }
  .summary-table td{ padding: 10px 0; border-bottom: 1px solid rgba(245,239,224,0.08); }
  .summary-table tr:last-child td{ border-bottom:none; }
  .summary-table td:not(:first-child), .summary-table th:not(:first-child){ text-align:right; }
  .summary-table .level-cell{ display:flex; align-items:center; gap:8px; font-weight:600; }
  .summary-table .total-row td{ font-weight:700; color: var(--amber); }

  .confirm-overlay{
    position: fixed; inset: 0; background: rgba(10,16,26,0.6);
    display: flex; align-items:center; justify-content:center;
    z-index: 1000; padding: 20px;
  }
  .confirm-card{
    background: var(--bg-panel); border-radius: 16px; padding: 24px 22px;
    max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .confirm-message{ font-size: 1rem; margin-bottom: 20px; text-align:center; }
  .confirm-actions{ display:flex; gap:10px; justify-content:center; }
  .confirm-actions button{
    flex:1; border:none; border-radius:10px; padding:10px 18px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.9rem;
  }
  .confirm-cancel{ background: rgba(245,239,224,0.08); color: var(--ink); }
  .confirm-ok{ background: var(--amber); color:#1B2A41; }

<div class="wrap">
  <a class="back" href="index.html">← Back to game</a>
  <h1>Your Stats</h1>
  <div id="summary-table-container"></div>
  <div id="stats-list"></div>
  <div style="text-align:center; margin-top: 10px;">
    <button id="reset-btn" style="background:rgba(245,239,224,0.08); color:var(--ink-dim); border:none; border-radius:10px; padding:10px 18px; font-family:'Inter',sans-serif; font-size:0.85rem; cursor:pointer;">Reset my stats</button>
  </div>
</div>

<script>
// Matches index.html's exact scoping scheme - the same synchronous,
// immediately-available flag is used here too, since this page has no
// Firebase connection of its own and doesn't need one for this.
const accountScope = localStorage.getItem('letterladder:accountUsername') || 'guest';
const STATS_KEY = `letterladder:${accountScope}:stats`;

function blankStat(){
  return { played:0, solved:0, currentStreak:0, maxStreak:0, lastSolvedDate:null };
}
function loadStats(){
  try{
    // Same one-time recovery as index.html - stats accumulated before
    // account-scoping existed lived under this same, unscoped key.
    if(accountScope !== 'guest' && localStorage.getItem(STATS_KEY) === null){
      const legacyRaw = localStorage.getItem('letterladder:stats');
      if(legacyRaw){
        localStorage.setItem(STATS_KEY, legacyRaw);
      }
    }
    const raw = localStorage.getItem(STATS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      for(const key of ['easy','medium','hard','total']){
        parsed[key] = Object.assign(blankStat(), parsed[key] || {});
      }
      return parsed;
    }
  }catch(e){}
  return { easy: blankStat(), medium: blankStat(), hard: blankStat(), total: blankStat() };
}

</script>
<script>
function showConfirmModal(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-card">
      <div class="confirm-message">${message}</div>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel">Cancel</button>
        <button type="button" class="confirm-ok">Confirm</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector('.confirm-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
  overlay.querySelector('.confirm-ok').addEventListener('click', ()=>{
    close();
    onConfirm();
  });
}

document.getElementById('reset-btn').addEventListener('click', () => {
  showConfirmModal('Are you sure you want to reset your stats? This action cannot be undone.', ()=>{
    localStorage.removeItem(STATS_KEY);
    location.reload();
  });
});
</script>

<script>
function renderStatsPage(stats){
  const container = document.getElementById('stats-list');
  const totalEverPlayed = stats.easy.played + stats.medium.played + stats.hard.played;

  if(totalEverPlayed === 0){
    container.innerHTML = `<div class="empty-state">No puzzles played yet on this device.</div>`;
  } else {
    function solvePct(stat){
      return stat.played === 0 ? 0 : Math.round((stat.solved / stat.played) * 100);
    }
    function renderCard(label, dotClass, stat, isTotal){
      const streakNote = isTotal ? `<div class="streak-note">Complete all 3 puzzles to maintain this streak</div>` : '';
      return `
        <div class="stat-card ${isTotal ? 'total' : ''}">
          <div class="stat-title"><span class="tier-dot ${dotClass}"></span>${label}</div>
          <div class="stat-grid">
            <div class="stat-box"><div class="stat-value">${stat.played}</div><div class="stat-label">Played</div></div>
            <div class="stat-box"><div class="stat-value">${solvePct(stat)}%</div><div class="stat-label">Solved</div></div>
            <div class="stat-box"><div class="stat-value">${stat.currentStreak}</div><div class="stat-label">Current Streak</div></div>
            <div class="stat-box"><div class="stat-value">${stat.maxStreak}</div><div class="stat-label">Max Streak</div></div>
          </div>
          ${streakNote}
        </div>`;
    }

    container.innerHTML = [
      renderCard('Easy', 'easy', stats.easy, false),
      renderCard('Medium', 'medium', stats.medium, false),
      renderCard('Hard', 'hard', stats.hard, false),
      renderCard('Total', 'total', stats.total, true),
    ].join('');
  }
}

renderStatsPage(loadStats());
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBnp4e0ea-eWy4x2WLtTyNyV5r5TpdNdM",
    authDomain: "letter-ladder-c6b15.firebaseapp.com",
    projectId: "letter-ladder-c6b15",
    storageBucket: "letter-ladder-c6b15.firebasestorage.app",
    messagingSenderId: "131656230098",
    appId: "1:131656230098:web:2b752fc4fa953f3557b90b",
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // The exact time-formatting logic used by index.html's Share Results
  // button, duplicated verbatim here since this is a separate static
  // HTML file with no shared JS module system to import it from directly.
  function formatTime(ms){
    if(ms === null) return '—';
    const totalSeconds = ms / 1000;
    if(totalSeconds < 60){
      return `${totalSeconds.toFixed(1)}s`;
    } else if(totalSeconds < 3600){
      return `${Math.floor(totalSeconds / 60)}m ${Math.round(totalSeconds % 60)}s`;
    } else {
      const totalMinutes = Math.floor(totalSeconds / 60);
      return `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m ${Math.round(totalSeconds % 60)}s`;
    }
  }

  // Sums three possibly-null values, staying null if any one of them is
  // null - matches the spec's "Total = Easy + Medium + Hard" rule, but a
  // sum across an incomplete set of tiers wouldn't be a meaningful total.
  function sumOrNull(a, b, c){
    if(a === null || b === null || c === null) return null;
    return a + b + c;
  }

  async function fetchTierTimeStats(uid, tier){
    const myQ = query(collection(db, 'scores'), where('uid', '==', uid), where('tier', '==', tier));
    const globalQ = query(collection(db, 'scores'), where('tier', '==', tier));
    const [mySnap, globalSnap] = await Promise.all([getDocs(myQ), getDocs(globalQ)]);
    const myTimes = mySnap.docs.map(d => d.data().timeMs).filter(t => typeof t === 'number');
    const globalTimes = globalSnap.docs.map(d => d.data().timeMs).filter(t => typeof t === 'number');

    return {
      best: myTimes.length ? Math.min(...myTimes) : null,
      average: myTimes.length ? myTimes.reduce((a,b) => a+b, 0) / myTimes.length : null,
      globalAverage: globalTimes.length ? globalTimes.reduce((a,b) => a+b, 0) / globalTimes.length : null,
    };
  }

  async function renderTimeSummaryTable(user){
    const container = document.getElementById('summary-table-container');
    try{
      const [easyStats, mediumStats, hardStats] = await Promise.all([
        fetchTierTimeStats(user.uid, 'easy'),
        fetchTierTimeStats(user.uid, 'medium'),
        fetchTierTimeStats(user.uid, 'hard'),
      ]);

      // Per the spec, the Total row sums the three tiers' own already-
      // calculated values directly, rather than being recalculated
      // independently from the underlying score documents.
      const totalStats = {
        best: sumOrNull(easyStats.best, mediumStats.best, hardStats.best),
        average: sumOrNull(easyStats.average, mediumStats.average, hardStats.average),
        globalAverage: sumOrNull(easyStats.globalAverage, mediumStats.globalAverage, hardStats.globalAverage),
      };

      function row(label, dotClass, stats){
        return `
          <tr class="${dotClass === 'total' ? 'total-row' : ''}">
            <td><span class="level-cell"><span class="tier-dot ${dotClass}"></span>${label}</span></td>
            <td>${formatTime(stats.best)}</td>
            <td>${formatTime(stats.average)}</td>
            <td>${formatTime(stats.globalAverage)}</td>
          </tr>`;
      }

      container.innerHTML = `
        <div class="summary-card">
          <table class="summary-table">
            <thead>
              <tr><th>Level</th><th>Best Time</th><th>Average Time</th><th>Global Average</th></tr>
            </thead>
            <tbody>
              ${row('Easy', 'easy', easyStats)}
              ${row('Medium', 'medium', mediumStats)}
              ${row('Hard', 'hard', hardStats)}
              ${row('Total', 'total', totalStats)}
            </tbody>
          </table>
        </div>`;

      return easyStats.best !== null || mediumStats.best !== null || hardStats.best !== null;
    }catch(e){
      console.error('Time summary failed to load:', e);
      return false;
    }
  }

  // Matches index.html's same "only pull when local looks genuinely
  // empty" rule, so a fresh device correctly pulls real stats down from
  // the cloud without ever risking overwriting newer local changes on a
  // device that already has some.
  onAuthStateChanged(auth, async (user) => {
    if(!user || user.isAnonymous) return;

    if(!localStorage.getItem(STATS_KEY)){
      try{
        const snap = await getDoc(doc(db, 'playerStats', user.uid));
        if(snap.exists()){
          localStorage.setItem(STATS_KEY, JSON.stringify(snap.data()));
          renderStatsPage(loadStats());
        }
      }catch(e){}
    }

    const hasRealScoreData = await renderTimeSummaryTable(user);
    // If the summary table just proved (from real score documents) that
    // this account has genuinely played before, the detailed section
    // below it should never keep showing a flatly contradictory "no
    // puzzles played" message - even if this account's separate,
    // synced aggregate stats record is itself empty or missing (e.g. an
    // older account whose play history predates that sync ever
    // succeeding). There's no reliable played/solved/streak breakdown
    // to show instead here, so this just removes the false claim rather
    // than fabricating numbers.
    if(hasRealScoreData){
      const listContainer = document.getElementById('stats-list');
      if(listContainer.innerHTML.includes('No puzzles played yet')){
        listContainer.innerHTML = '';
      }
    }
  });
</script>
</body>
